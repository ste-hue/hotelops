# Manual template for the PRIVATE ste-hue/obsidian-vault repository only.
# The weekly schedule stays disabled until Stefano approves deployment.
name: vault-loop

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: vault-loop
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'ste-hue/obsidian-vault' && github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vault
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ste-hue/hotelops
          path: hotelops
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ste-hue/mgmt-os
          token: ${{ secrets.MGMT_OS_READ_TOKEN }}
          path: mgmt_os
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ste-hue/mutui-tracker
          token: ${{ secrets.MGMT_OS_READ_TOKEN }}
          path: mutui-tracker
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ste-hue/panorama-businessplan
          token: ${{ secrets.MGMT_OS_READ_TOKEN }}
          path: panorama-businessplan
          fetch-depth: 0
          persist-credentials: false

      # Only an authenticated 404 permits bootstrap. Network/auth failures stop.
      - name: Locate persistent state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          url = 'https://api.github.com/repos/ste-hue/obsidian-vault/git/ref/heads/vault-loop-state'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          try:
              with urllib.request.urlopen(request) as response:
                  exists = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise RuntimeError('Unable to verify state branch') from None
              exists = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('exists=' + str(exists).lower() + '\n')
          PY
      - name: Checkout persistent state
        if: steps.state.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: vault-loop-state
          path: state
          persist-credentials: false
      - name: Bootstrap state directory
        if: steps.state.outputs.exists == 'false'
        run: mkdir -p state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml
      - name: Reconcile sources
        id: reconcile
        working-directory: hotelops
        env:
          VAULT_LOOP_PATH_HOTELOPS: ${{ github.workspace }}/hotelops
          VAULT_LOOP_PATH_MGMT_OS: ${{ github.workspace }}/mgmt_os
          VAULT_LOOP_PATH_MUTUI_TRACKER: ${{ github.workspace }}/mutui-tracker
          VAULT_LOOP_PATH_PANORAMA_BUSINESSPLAN: ${{ github.workspace }}/panorama-businessplan
          VAULT_LOOP_PATH_VAULT: ${{ github.workspace }}/vault
        run: |
          set +e
          python -m scripts.vault_loop.reconcile --state "${{ github.workspace }}/state/vault_loop" --quiet
          result=$?
          set -e
          case "$result" in 0|1|2|3) ;; *) exit "$result" ;; esac
          test -f "${{ github.workspace }}/state/vault_loop/state.json"
          echo "exit=$result" >> "$GITHUB_OUTPUT"
          # No vault paths, content or financial claims in logs or step summary.
          echo "Vault Loop audit exit: $result. Private report retained." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vault-loop-report
          path: state/vault_loop/last_report.md
          if-no-files-found: error
          retention-days: 30
      - name: Persist atomic state and report
        working-directory: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! test -d .git; then git init -q -b vault-loop-state; fi
          git config user.name vault-loop
          git config user.email vault-loop@users.noreply.github.com
          git config credential.helper '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
          git add vault_loop/state.json vault_loop/checkpoint.json vault_loop/findings.json vault_loop/last_report.md
          if ! git diff --cached --quiet; then
            git commit -q -m "vault-loop: record audit"
            git push -q https://github.com/ste-hue/obsidian-vault.git HEAD:refs/heads/vault-loop-state
          fi
      - name: Fail incomplete reconciliation
        if: steps.reconcile.outputs.exit == '2' || steps.reconcile.outputs.exit == '3'
        run: exit 1
