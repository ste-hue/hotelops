    promotion_policy: RAW_ONLY
    detector_category: stampa_cassa_pos
    raw_storage:
      backend: gcs
      bucket: hotelops-raw
      path_template: "ristocube/stampa_cassa/ORTI"
    notes: |
      Variante POS della famiglia "stampa cassa" — NON è
      HOTELCUBE_STAMPACASSA (PMS: camere H_, Caparra, Matricola RT).
      Colonne: N. Documento Fiscale (es. "2026 R 1000 A"), Cod. Risorsa
      (= sala POS: BAR/RISLUNCH/RISDINNE), Data, Ora, Pagante, Totale,
      Sospesi, Pagato, Pos, Operatore.
      ⚠️ Stesso cap export a 1000 righe del fratello HotelCube, taglio in
      ordine ALFABETICO di N. Documento → serie bucata su tutto il periodo
      (primo file 2026-07-30: serie 2026-R-A, doc 684–1942, 259 buchi).
      Verificare gap numerici per serie a ogni intake; riesportare spezzando
      per numero documento/mese, non "dall'ultima data".

