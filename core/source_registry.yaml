  POWERBI_MENUENGINEERING_ORTI_SNAPSHOT:
    system: POWERBI
    dataset: MENUENGINEERING
    dataset_label: "Menu engineering F&B per piatto (prezzo/costo unitario, qtà, incidenza — export Power BI RistoCube)"
    societa: ORTI
    business_unit: null
    lifecycle: SNAPSHOT
    canonical_table: f_menu_engineering
    parser_module: ingest.flussi.ingest_menu_engineering
    natural_key: [snapshot_date, sala, piatto]
    loop_targets: [fb_model]
    promotion_policy: AUTO
    detector_category: menu_engineering
    raw_storage:
      backend: gcs
      bucket: hotelops-raw
      path_template: "powerbi/menu_engineering/ORTI"
    notes: |
      Export "Engineering F&B Data.xlsx": una riga per (Sala × Piatto) con
      Prz./Costo unitario, Qtà, %Inc., Costo, Listino, Vendita — CUMULATO sul
      periodo del filtro Power BI, SENZA dimensione data nel contenuto (il
      footer "Applied filters" non dichiara il periodo).
      Promosso 2026-07-30 (consumer: modello F&B Feliciani, spec
      2026-07-30-modello-fb-feliciani): snapshot_date da intake_at (pattern
      OTB), foto accumulate, hash su (snapshot_date, sala, piatto) → una
      foto per giorno, l'ultima si legge con MAX(snapshot_date). Unica fonte
      col COSTO UNITARIO per piatto; le Qtà del file (periodo ignoto) NON si
      usano come denominatore — coperti da f_coperti_giornalieri, qty da
      f_vendite_fb sul periodo del report.

