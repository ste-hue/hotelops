# ══════════════════════════════════════════════════════════════════════════════
# HOTELOPS ONTOLOGY — Semantic Layer (Single Source of Truth)
# ══════════════════════════════════════════════════════════════════════════════
# Struttura a 4 layer: business → dimensions → facts → views
# Ogni entita' sa cosa e', dove vive, da dove viene, chi la consuma.
# Leggibile da: codice, CLI, LLM, SDK.
# ══════════════════════════════════════════════════════════════════════════════

version: "1.0"
project: hotelops-suite
dataset: hotelops
last_updated: "2026-03-28"


# ══════════════════════════════════════════════════════════════════════════════
# LAYER 0: BUSINESS ENTITIES (canonical)
# ══════════════════════════════════════════════════════════════════════════════
# Entita' di business che non vivono (ancora) in tabelle BQ dedicate.
# Serializzate qui come enumerazioni + attributi.
# Candidate per promozione a d_societa, d_business_units, d_banche.

business:

  societa:
    ORTI:
      nome: "ORTI S.r.l."
      ruolo: operativa
      business_units: [HOTEL, RESIDENCE, CVM, HQ]
      banche: {Cc1: INTESA, Cc2: MPS_KROSS, Cc3: MPS}
      note: "Gestione operativa hotel. Non genera cash autonomamente — paga fitto a INTUR."
    INTUR:
      nome: "INTUR S.r.l."
      ruolo: holding
      business_units: [LIDO, HQ]
      banche: {Cc1: SELLA, Cc2: MPS, Cc3: INTESA, Cc4: BCP}
      note: "Proprieta' immobili + spiaggia. Dipende dal fitto ORTI per debt service."

  business_units:
    HOTEL:     {societa: ORTI, stagionale: true, apertura: apr-ott, note: "Hotel 4* Maiori"}
    RESIDENCE: {societa: ORTI, stagionale: false, note: "Angelina Residence, tutto l'anno"}
    CVM:       {societa: ORTI, stagionale: false, note: "Casa Vacanze Maiori, tutto l'anno"}
    LIDO:      {societa: INTUR, stagionale: true, apertura: mag-set, note: "Concessione balneare"}
    HQ:        {societa: [ORTI, INTUR], note: "Funzioni centrali / amministrazione"}

  banche:
    MPS:       {nome: "Monte dei Paschi di Siena", societa: [ORTI, INTUR], esposizione_pct: 86.4}
    MPS_KROSS: {nome: "MPS Kross", societa: [ORTI], note: "Conto separato"}
    SELLA:     {nome: "Banca Sella", societa: [INTUR], note: "Operativo, no finanziamenti attivi"}
    INTESA:    {nome: "Intesa Sanpaolo", societa: [ORTI, INTUR], esposizione_pct: 13.6}
    BCP:       {nome: "Banca di Credito Popolare", societa: [INTUR], note: "Conto operativo"}

  assi_temporali:
    COMPETENZA:
      domanda: "Quando consumo/genero?"
      audience: Gasparotto
      view_primaria: v_budget_vs_consuntivo
    CASSA:
      domanda: "Quando il soldo entra/esce?"
      audience: Rosa
      view_primaria: v_piano_finanziario_mensile
    IMPEGNO:
      domanda: "Quando devo pagare?"
      audience: [Rosa, Gasparotto]
      view_primaria: v_previsione_cassa

  fonti_budget:
    GASPAROTTO:        {scope: "Full CE", granularity: "company-level, seasonality-adjusted", target: f_budget_mensile}
    MAPPATURA:         {scope: "Fixed/variable costs", granularity: "per BU", target: f_budget_mensile}
    INCIDENZA:         {scope: "Payroll costs", granularity: "per divisione", target: f_budget_mensile}
    PIANO_FINANZIARIO: {scope: "Cash flow 28 voci", granularity: "ORTI+INTUR monthly", target: f_piano_finanziario_input}
    SCADENZIARIO:      {scope: "Loan schedules", granularity: "per voce x mese", target: f_piano_finanziario_input}
    BVA_2026:          {scope: "Revenue budgets", granularity: "per voce x mese", target: f_piano_finanziario_input}
    CLI:               {scope: "Manual forecast", granularity: "per voce x mese", target: f_piano_finanziario_input}
    APP:               {scope: "Streamlit saves", granularity: "per voce x mese", target: f_piano_finanziario_input}

  sign_conventions:
    views: "ENTRATE positive = entrata, USCITE positive = uscita"
    esolver: "ENTRATE = imp_avere - imp_dare, USCITE = imp_dare - imp_avere"
    banche: "importo_netto positivo = entrata, negativo = uscita"

  codice_conto_formats:
    d_piano_conti: {format: "XX.XX.XX", example: "57.09.13", note: "Con punti"}
    f_movimenti_contabili: {format: "XXXXXX", example: "570913", note: "Senza punti"}
    join_strategy: "REPLACE(codice_conto, '.', '')"

  # ── Three Naming Systems ─────────────────────────────────────────────────
  # Ogni codice conto Esolver porta due etichette in base al contesto.
  # Esolver e' il master, gli altri due sono lenti sullo stesso dato.
  #
  # Esempio per codice_conto 57.09.13.01:
  #   Esolver:     57.09.13.01 "Enel Energia"
  #   PF (Rosa):   voce_pf = "Utenze"
  #   CE (Gaspar): categoria_ce = "Costi Produttivi"
  #
  naming_systems:

    esolver:
      ruolo: master
      descrizione: "Piano dei conti Esolver — autorita' unica sui codici conto"
      granularita: "~160 leaf accounts"
      formato: "XX.XX.XX (punti = livelli dell'albero)"
      gerarchia: "Il punto separa i livelli: 57 > 57.09 > 57.09.13 > 57.09.13.01"
      tabella_bq: d_piano_conti
      esempio: {codice: "57.09.13.01", descrizione: "Enel Energia"}

    piano_finanziario:
      ruolo: lente
      alias: [PF, Rosa, Tesoreria]
      descrizione: "28 voci aggregate per tipo di flusso di cassa"
      asse: CASSA
      audience: Rosa
      domanda: "Quando il soldo entra/esce?"
      granularita: "28 voci (11 ENTRATE + 17 USCITE)"
      tabella_bq: d_voci_piano_finanziario
      colonna_label: voce_label
      join_strategy: "cod_conto_pattern LIKE — pattern matching, non FK"
      esempio: {voce_id: USCITE_UTENZE, voce_label: "Utenze", codici_inclusi: ["5709%", "5711%"]}
      views_looker: [v_condges_pf_mensile, v_condges_budget_consuntivo]

    controllo_gestione:
      ruolo: lente
      alias: [CE, Gasparotto, CdG]
      descrizione: "7 macro-categorie per natura del costo/ricavo"
      asse: COMPETENZA
      audience: Gasparotto
      domanda: "Quanto consumo/genero? Dove sto sforando?"
      granularita: "7 categorie"
      categorie: [Ricavi, Costi Produttivi, Costi Commerciali, Costi Amministrativi,
                  Costi del Personale, Oneri Tributari, Oneri Finanziari]
      tabella_bq: d_categorie_conti
      colonna_label: categoria_ce
      colonna_tipo: tipo_costo  # F=Fisso, V=Variabile, P=Personale, IP=Ricavo, X=Extra-EBITDA
      join_strategy: "FK diretto su codice_conto (REPLACE dots)"
      esempio: {codice: "57.09.13.01", categoria_ce: "Costi Produttivi", tipo_costo: "F"}
      views_looker: [v_condges_budget_consuntivo]

    # ── Come si collegano ──────────────────────────────────────────────────
    # Un singolo codice Esolver mappa a ENTRAMBE le lenti:
    #
    #   codice_conto ──JOIN──> d_voci_piano_finanziario ──> voce_pf (Rosa)
    #                 ──JOIN──> d_categorie_conti        ──> categoria_ce (Gasparotto)
    #
    # Le Looker views v_condges_budget_consuntivo espongono entrambe le etichette.
    # L'utente filtra per voce_pf OPPURE categoria_ce in base al contesto.


# ══════════════════════════════════════════════════════════════════════════════
# LAYER 1: DIMENSIONS
# ══════════════════════════════════════════════════════════════════════════════
# Tabelle BQ dimensionali. Cambiano raramente. Loaders in core/bq/load/.

dimensions:

  d_voci_piano_finanziario:
    bq_table: d_voci_piano_finanziario
    descrizione: "28 voci PF: struttura Piano Finanziario → codici conto Esolver"
    source: core/bq/dimensioni/d_voci_piano_finanziario.csv
    loader: core.bq.load.load_voci_piano_finanziario
    cardinality: 28
    join_type: LIKE  # cod_conto_pattern — non FK, pattern matching
    columns: [voce_id, voce_label, sezione, categoria, societa_id, fonte,
              cod_conto_pattern, cod_conto_pat2, cod_conto_pat3, banca_tipo_pat,
              ord, bu_filter, categoria_ce, tipo_costo]
    consumed_by: [v_piano_finanziario_consuntivo, v_piano_finanziario_mensile]
    note: "fonte=ESOLVER joins via LIKE, fonte=BANCHE via banca_tipo_pat, fonte=MANUALE solo via FK"

  d_mapping_piano_finanziario:
    bq_table: d_mapping_piano_finanziario
    descrizione: "220 sotto-voci PF → Esolver account codes per societa"
    source: core/bq/dimensioni/d_mapping_piano_finanziario.csv
    loader: core.bq.load.load_mapping_piano_finanziario
    cardinality: 302
    note: "Granularita' piu' fine di d_voci — per sotto-voce e per societa"

  d_piano_conti:
    bq_table: d_piano_conti
    descrizione: "Piano dei conti 2026 — 160 conti con codice, tipo, sezione CE/SP"
    loader: core.bq.load.load_piano_conti
    cardinality: 160
    format_codice: "XX.XX.XX"
    consumed_by: [v_budget_vs_consuntivo]

  d_categorie_conti:
    bq_table: d_categorie_conti
    descrizione: "Mapping codice_conto → tipo_costo, categoria_ce"
    loader: core.bq.load.load_categorie
    cardinality: 167
    consumed_by: [v_budget_vs_consuntivo, v_pl_movimenti]

  d_fornitori:
    bq_table: d_fornitori
    descrizione: "Fornitori ORTI con voce_id e flag intercompany"
    source: core/bq/dimensioni/d_fornitori.csv
    loader: core.bq.load.load_fornitori
    cardinality: 64

  d_anagrafica_fornitori:
    bq_table: d_anagrafica_fornitori
    descrizione: "Anagrafica fornitori completa per riconciliazione partite"
    loader: core.bq.load.load_anagrafica_fornitori

  d_coefficienti_stagionalita:
    bq_table: d_coefficienti_stagionalita
    descrizione: "Moltiplicatori stagionalita' mensili per BU, da f_ricavi_storici"
    loader: core.bq.load.load_coefficienti_stagionalita
    invariant: "SUM per BU = 12.0"
    consumed_by: [f_budget_mensile]

  # ── Dimensioni mancanti (candidate) ────────────────────
  # Queste entita' sono hardcoded in business: ma non hanno tabella BQ dedicata.
  # Promuoverle a tabelle permetterebbe JOIN puliti e label management.
  _missing:
    d_societa: {status: "hardcoded in business.societa", priority: bassa}
    d_business_units: {status: "hardcoded in business.business_units", priority: media}
    d_banche: {status: "hardcoded in business.banche", priority: media}
    d_reparti: {status: "in Obsidian ontology, 17 reparti", priority: bassa}
    d_periodi_apertura: {status: "menzionato in CLAUDE.md, non materializzato", priority: bassa}
    d_budget_costi_fissi: {status: "43 righe, loader esiste", priority: bassa}
    d_personale_mensile: {status: "78 righe, loader non trovato", priority: bassa}


# ══════════════════════════════════════════════════════════════════════════════
# LAYER 2: FACT TABLES
# ══════════════════════════════════════════════════════════════════════════════
# Ogni riga = un evento finanziario con 5 dimensioni standard:
#   societa_id, business_unit_id, funzione_id, location_id, oggetto_id
#
# lifecycle: APPEND = accumula con MD5 dedup | SNAPSHOT = DELETE-INSERT

facts:

  # ── Banca group ──────────────────────────────────────
  f_banche_movimenti:
    bq_table: f_banche_movimenti
    lifecycle: APPEND
    asse: CASSA
    descrizione: "Movimenti bancari da homebanking — MPS, MPS_KROSS, SELLA, INTESA, BCP"
    pipeline: ingest.banca.ingest
    registry_key: banca
    source_drive: ingresso/homebanking/{societa}/
    dedup: MD5
    sign: "importo_netto positivo = entrata, negativo = uscita"
    consumed_by: [v_piano_finanziario_consuntivo, v_cashflow_mensile, v_incassi_per_canale]

  f_accodamenti:
    bq_table: f_accodamenti
    lifecycle: APPEND
    asse: CASSA
    descrizione: "Vendite HotelCube PMS: corrispettivi, caparre, fatture attive"
    pipeline: ingest.banca.ingest_accodamenti
    registry_key: accodamenti
    source_drive: ingresso/accodamenti/ORTI/
    dedup: MD5
    consumed_by: []  # orphan

  # ── Flussi group ─────────────────────────────────────
  f_movimenti_contabili:
    bq_table: f_movimenti_contabili
    lifecycle: APPEND
    asse: COMPETENZA
    descrizione: "Prima nota Esolver — CodConto senza punti (570913)"
    pipeline: ingest.flussi.ingest_movimenti_contabili
    registry_key: movimenti_contabili
    source_drive: ingresso/movimenti_contabili/{societa}/
    dedup: MD5
    format_codice: "XXXXXX"
    consumed_by: [v_piano_finanziario_consuntivo, v_piano_finanziario_mensile,
                  v_budget_vs_consuntivo, v_pl_movimenti]

  f_budget_mensile:
    bq_table: f_budget_mensile
    lifecycle: SNAPSHOT
    asse: COMPETENZA
    descrizione: "Budget mensile per codice conto"
    pipeline: ingest.flussi.ingest_gasparotto
    registry_key: gasparotto
    source_drive: ingresso/gasparotto/
    fonti: [GASPAROTTO, MAPPATURA, INCIDENZA]
    note: "Fonti con priorita': STRUTTURALI > MAPPATURA > PERSONALE > INCIDENZA > CONS2025_* > GASPAROTTO. v_budget_vs_consuntivo usa ROW_NUMBER per dedup."
    consumed_by: [v_piano_finanziario_mensile, v_budget_vs_consuntivo]

  f_piano_finanziario_input:
    bq_table: f_piano_finanziario_input
    lifecycle: SNAPSHOT
    asse: CASSA
    descrizione: "Previsioni cash flow: 28 voci x 12 mesi"
    pipeline: ingest.flussi.ingest_piano_finanziario_xlsx
    registry_key: piano_finanziario
    source_drive: ingresso/piani_finanziari/{societa}/
    fonti: [PIANO_FINANZIARIO, SCADENZIARIO, BVA_2026, CLI, APP]
    consumed_by: [v_piano_finanziario_mensile]

  f_saldi_banca_snapshot:
    bq_table: f_saldi_banca_snapshot
    lifecycle: APPEND
    asse: CASSA
    descrizione: "Registro contabile banca da Esolver, running balance end-of-day"
    pipeline: ingest.flussi.ingest_scheda_contabile
    registry_key: scheda_contabile
    source_drive: ingresso/registro_banca_esolver/{societa}/
    consumed_by: [v_previsione_cassa]

  f_partite_aperte_fornitori:
    bq_table: f_partite_aperte_fornitori
    lifecycle: SNAPSHOT
    asse: IMPEGNO
    descrizione: "Snapshot partite aperte fornitori — obblighi di pagamento"
    pipeline: ingest.flussi.ingest_partite_aperte
    registry_key: partite_fornitori
    source_drive: ingresso/partite_fornitori/{societa}/
    consumed_by: [v_previsione_cassa]

  f_bilancino:
    bq_table: f_bilancino
    lifecycle: SNAPSHOT
    asse: COMPETENZA
    descrizione: "Bilancio di verifica Esolver, solo leaf nodes"
    pipeline: ingest.flussi.ingest_bilancino
    registry_key: bilancino
    source_drive: ingresso/bilancino/{societa}/
    consumed_by: []  # orphan

  f_consumi_economato:
    bq_table: f_consumi_economato
    lifecycle: APPEND
    asse: COMPETENZA
    descrizione: "Consumi materie prime per reparto/prodotto"
    pipeline: ingest.flussi.ingest_consumi_economato
    registry_key: economato
    source_drive: ingresso/economato/
    consumed_by: []  # orphan

  f_coperti_giornalieri:
    bq_table: f_coperti_giornalieri
    lifecycle: APPEND
    asse: COMPETENZA
    descrizione: "Coperti pasto giornalieri per BU/tipo_ospite"
    pipeline: ingest.flussi.ingest_coperti
    registry_key: coperti
    source_drive: ingresso/coperti/
    consumed_by: []  # orphan

  f_chiusura_mensile:
    bq_table: f_chiusura_mensile
    lifecycle: SNAPSHOT
    asse: CASSA
    descrizione: "Snapshot chiusura mese: previsione vs consuntivo + saldo banca"
    pipeline: null  # generato da `hotelops chiudi`
    source_drive: null
    note: "Traccia accuratezza previsioni nel tempo"
    consumed_by: []

  f_ricavi_storici:
    bq_table: f_ricavi_storici
    lifecycle: APPEND
    asse: COMPETENZA
    descrizione: "Riepilogo entrate mensili 2023-2025 per BU"
    loader: core.bq.load.load_ricavi_storici
    consumed_by: [d_coefficienti_stagionalita]

  # ── WIP (schema exists, pipeline in progress) ────────
  f_coefficienti_consumo:
    bq_table: f_coefficienti_consumo
    lifecycle: APPEND
    asse: COMPETENZA
    descrizione: "Coefficienti consumo per prodotto/reparto/mese"
    pipeline: null  # WIP
    status: wip

  f_pms_statistiche:
    bq_table: f_pms_statistiche
    lifecycle: APPEND
    asse: COMPETENZA
    descrizione: "PMS room/occupancy statistics — denominatore per costi per camera-notte"
    pipeline: null  # WIP
    status: wip


# ══════════════════════════════════════════════════════════════════════════════
# LAYER 3: VIEWS
# ══════════════════════════════════════════════════════════════════════════════
# Materializzazioni BQ che servono i verticali. SQL in core/bq/views/.

views:

  v_piano_finanziario_mensile:
    bq_view: v_piano_finanziario_mensile
    asse: CASSA
    audience: Rosa
    descrizione: "Budget vs consuntivo per voce PF, rolling 18 mesi"
    sql: core/bq/views/v_piano_finanziario_mensile.sql
    reads_from:
      facts: [f_movimenti_contabili, f_banche_movimenti, f_budget_mensile, f_piano_finanziario_input]
      dimensions: [d_voci_piano_finanziario]
    note: "Scaffold 28 voci x 18 mesi, poi LEFT JOIN consuntivo + budget + input"

  v_piano_finanziario_consuntivo:
    bq_view: v_piano_finanziario_consuntivo
    asse: CASSA
    descrizione: "Consuntivo per voce PF via d_voci LIKE patterns"
    sql: core/bq/views/v_piano_finanziario_consuntivo.sql
    reads_from:
      facts: [f_movimenti_contabili, f_banche_movimenti]
      dimensions: [d_voci_piano_finanziario]
    join_strategy: "d_voci.cod_conto_pattern LIKE on f_movimenti.codice_conto"

  v_budget_vs_consuntivo:
    bq_view: v_budget_vs_consuntivo
    asse: COMPETENZA
    audience: Gasparotto
    descrizione: "Budget vs actuals per cod_conto x mese — FULL OUTER JOIN"
    sql: core/bq/views/v_budget_vs_consuntivo.sql
    note: "ROW_NUMBER dedup per fonte priority — elimina double-counting budget"
    reads_from:
      facts: [f_movimenti_contabili, f_budget_mensile]
      dimensions: [d_categorie_conti]

  v_cashflow_mensile:
    bq_view: v_cashflow_mensile
    asse: CASSA
    descrizione: "Cashflow mensile aggregato da movimenti bancari"
    sql: core/bq/views/v_cashflow_mensile.sql
    reads_from:
      facts: [f_banche_movimenti]

  v_previsione_cassa:
    bq_view: v_previsione_cassa
    asse: [CASSA, IMPEGNO]
    audience: [Rosa, Gasparotto]
    descrizione: "Cash forward rolling 12 mesi, semaforo stato_liquidita"
    sql: core/bq/views/v_previsione_cassa.sql
    reads_from:
      facts: [f_saldi_banca_snapshot, f_partite_aperte_fornitori]
      views: [v_piano_finanziario_mensile]

  v_pl_movimenti:
    bq_view: v_pl_movimenti
    asse: COMPETENZA
    descrizione: "P&L: ricavi - costi per categoria CE"
    sql: core/bq/views/v_pl_movimenti.sql
    reads_from:
      facts: [f_movimenti_contabili]
      dimensions: [d_categorie_conti]

  v_incassi_per_canale:
    bq_view: v_incassi_per_canale
    asse: CASSA
    descrizione: "Entrate bancarie per canale: BONIFICO, CARTE, CONTANTI, ALTRO"
    sql: core/bq/views/v_incassi_per_canale.sql
    reads_from:
      facts: [f_banche_movimenti]

  # ── Looker Studio views ─────────────────────────────────────────────────
  v_condges_budget_consuntivo:
    bq_view: v_condges_budget_consuntivo
    asse: [COMPETENZA, CASSA]
    audience: [Gasparotto, Rosa]
    descrizione: "Looker: Budget vs consuntivo per codice conto — dual CE/PF labels"
    sql: core/bq/views/v_condges_budget_consuntivo.sql
    reads_from:
      facts: [f_budget_mensile, f_movimenti_contabili]
      dimensions: [d_categorie_conti, d_voci_piano_finanziario]
    naming_systems: [piano_finanziario, controllo_gestione]
    note: "Espone voce_pf + categoria_ce sullo stesso codice conto"

  v_condges_pf_mensile:
    bq_view: v_condges_pf_mensile
    asse: CASSA
    audience: Rosa
    descrizione: "Looker: Piano Finanziario 28 voci con labels + DATE column"
    sql: core/bq/views/v_condges_pf_mensile.sql
    reads_from:
      views: [v_piano_finanziario_mensile]
      dimensions: [d_voci_piano_finanziario]
    naming_systems: [piano_finanziario]

  v_condges_cashflow:
    bq_view: v_condges_cashflow
    asse: CASSA
    audience: [Rosa, Gasparotto]
    descrizione: "Looker: Cashflow actuals + 12m proiezione + semaforo liquidita'"
    sql: core/bq/views/v_condges_cashflow.sql
    reads_from:
      views: [v_cashflow_mensile, v_previsione_cassa]

  v_economato_consumi:
    bq_view: v_economato_consumi
    asse: COMPETENZA
    audience: Mario
    descrizione: "Looker: Consumi per reparto/prodotto + YoY + costo per coperto"
    sql: core/bq/views/v_economato_consumi.sql
    reads_from:
      facts: [f_consumi_economato, f_coperti_giornalieri]

  v_economato_pareto:
    bq_view: v_economato_pareto
    asse: COMPETENZA
    audience: Mario
    descrizione: "Looker: ABC analysis — fascia A/B/C top referenze per reparto"
    sql: core/bq/views/v_economato_pareto.sql
    reads_from:
      facts: [f_consumi_economato]


# ══════════════════════════════════════════════════════════════════════════════
# DOMAINS (overlay — referenzia layer 0-3, non ridefinisce)
# ══════════════════════════════════════════════════════════════════════════════
# Chi usa cosa. Ogni dominio e' un punto di vista sul data model.

domains:

  tesoreria:
    asse: CASSA
    owner: Rosa
    naming_system: piano_finanziario
    domanda: "Quanto cash ho, quanto ne arriva, quanto ne esce?"
    views: [v_piano_finanziario_mensile, v_previsione_cassa, v_cashflow_mensile, v_incassi_per_canale]
    views_looker: [v_condges_pf_mensile, v_condges_cashflow, v_condges_budget_consuntivo]
    facts: [f_banche_movimenti, f_piano_finanziario_input, f_saldi_banca_snapshot]
    cli: [hotelops pf, hotelops saldo, hotelops chiudi, hotelops previsione]
    app: condges/app.py

  controllo_gestione:
    asse: COMPETENZA
    owner: Gasparotto
    naming_system: controllo_gestione
    domanda: "Budget vs consuntivo — dove sto sforando?"
    views: [v_budget_vs_consuntivo, v_pl_movimenti]
    views_looker: [v_condges_budget_consuntivo]
    facts: [f_movimenti_contabili, f_budget_mensile]
    cli: [hotelops bva]

  economato:
    asse: COMPETENZA
    owner: Mario
    domanda: "Quanto consumo per reparto? Cosa ordino? Quali prodotti pesano di piu'?"
    views_looker: [v_economato_consumi, v_economato_pareto]
    facts: [f_consumi_economato, f_coperti_giornalieri]
    note: "Streamlit ordering app (magazzino + presenze + fabbisogno) e' progetto separato"

  impegni:
    asse: IMPEGNO
    domanda: "Quanto devo pagare e quando?"
    views: [v_previsione_cassa]
    facts: [f_partite_aperte_fornitori]

  operativo:
    descrizione: "Dati operativi caricati ma non ancora collegati a views"
    status: orphan
    facts: [f_accodamenti, f_bilancino]
    note: "f_consumi_economato e f_coperti_giornalieri ora serviti dal dominio economato"


