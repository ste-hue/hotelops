security_observations:
  - id: SEC-001
    title: "Stale public Worker hotelops-hub serves internal launcher + KPI freshness data"
    resolution: "RESOLVED 2026-07-15 (HAR-03): assets archived in docs/attic/hotelops-hub-worker-2026-06-18/, Worker deleted, 404 verified"
    severity: medium
    detail: "Believed deleted per STATUS.md (06-16/06-20 cleanups) but live at hotelops-hub.ste-dellapietra.workers.dev with no auth; exposes app inventory (apps/tiles), freshness semaphores and monthly review average frozen at 2026-06-18. Low data sensitivity but undocumented public surface + org naming."
    evidence: ["curl 200", "workers_list created 2026-06-18"]
  - id: SEC-002
    title: "Cloud Run hub runs as default compute SA with project-level roles/editor"
    resolution: "MITIGATED 2026-07-15 (HAR-02): hub now runs as hotelops-hub@ (scoped). Residual: roles/editor still on default compute SA during soak — remove after write-path click-through"
    severity: high
    detail: "942784312622-compute@developer.gserviceaccount.com holds roles/editor (plus bigquery.dataViewer/jobUser, cloudbuild.builds.builder). The IAP-gated hub is a write surface; a compromise of the app yields broad project control. Known in STATUS.md 06-20 ('SA = default compute con roles/editor')."
    evidence: ["gcloud projects get-iam-policy"]
  - id: SEC-003
    title: "mutui-tracker fully public: group loan amortization data + industrial-plan scenario world-readable"
    resolution: "RESOLVED 2026-07-15 (HAR-04, owner-approved): moved to mutui.panorama-host.com behind Cloudflare Access (168h); workers.dev disabled (404); hub page updated + redeployed"
    severity: medium
    detail: "GET / and GET /api/scenario are unauthenticated. Writes are correctly gated by ADMIN_TOKEN (timing-safe). Exposure appears tacitly accepted (linked from hub for family/directors) but no decision record was found."
    evidence: ["curl 200 on both paths", "src/worker.js"]
  - id: SEC-004
    title: "IAP allowlist broader than documented"
    severity: low
    detail: "README describes a per-email allowlist; actual policy grants iap.httpsResourceAccessor to the entire domain:panoramagroup.it (plus 3 users). Mitigated by roles.py fail-closed grants (unknown email → zero apps), but edge and app layers now disagree about who 'enters'."
    evidence: ["gcloud iap web get-iam-policy", "verticals/hub/README.md §Modello accessi"]
  - id: SEC-005
    title: "Single-copy sources: reception-control-tower and bilancini have no git remote"
    resolution: "RESOLVED 2026-07-15 (HAR-01): pushed to private GitHub repos ste-hue/reception-control-tower + ste-hue/bilancini-worker (histories secret-scanned clean before push)"
    severity: medium
    detail: "Both production(-bound) Workers live only on the laptop (panorama_apps/*, local git without origin). Laptop loss = source loss; deployed Worker code would be the only surviving copy."
    evidence: ["git remote -v empty in both repos"]
  - id: SEC-006
    title: "Plaintext credentials on developer machine (not in repo)"
    severity: medium
    detail: ".env at hotelops repo root (names: APIFY_API_TOKEN, ANTHROPIC_API_KEY, GMAIL_USER, GMAIL_APP_PASSWORD; gitignored, untracked — verified), SA key files ~/.config/hotelops/drive-audit-key.json and workspace-controller.json (the latter with domain-wide delegation for Gmail/Drive impersonation), app-mutui/.dev.vars (ADMIN_TOKEN). No committed secret values found in tracked files."
    evidence: ["git status (only scratchpad/ untracked)", "workspace/auth.py + config.py", "ingest/drive_fetch.py:8"]
  - id: SEC-007
    title: "drive-audit@ SA holds iam.serviceAccountTokenCreator at project level"
    severity: low
    detail: "Combined with domain-wide delegation usage patterns, broader than needed; also storage.objectAdmin + bigquery.dataEditor at project (not dataset) level for both job SAs."
    evidence: ["gcloud projects get-iam-policy"]
  - id: SEC-008
    title: "Repo/docs reference retired or wrong URLs"
    severity: info
    detail: "verticals/hub/publish/ (wrangler.toml, site/apps.json) and several docs still reference hotelops-vetrina (404) and the legacy run.app alias; risk of accidental redeploy of the retired Worker via npx wrangler deploy in that directory."
    evidence: ["wrangler.toml", "apps.json", "curl 404"]
