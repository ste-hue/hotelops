  }
  const contrattoVuoto = (c) => !(c.totale || 0) && !(c.quote || []).length && !(c.anticipo_pct || 0) && !(c.ritenuta_pct || 0) && (c.sal_n || 1) === 1;
  const pattiDi = (F) => (((stato.scenario.fornitori || {})[String(F || "").trim()] || {}).patti) || null;
  const selSocV = (val) => `<select data-vf="societa"><option value="" ${val ? "" : "selected"}>società…</option>${SOC.map((s) => `<option ${s === val ? "selected" : ""}>${s}</option>`).join("")}</select>`;
  function renderFornitori() {
    const sc = stato.scenario;
    sc.fornitori = sc.fornitori || {};
    const righe = fornitoriDelloScenario(sc);
    const html = righe.map((f) => { const k = `v:${f.id}`; return `<details class="leva" data-k="${k}" data-v="${esc(f.id)}" ${aperte.has(k) ? "open" : ""}>
      <summary><span class="nome">${esc(f.nome)}</span>${f.codice ? `<span class="badge" title="${esc(nomeEsolver(f.codice) || "codice Esolver")}">Esolver ${esc(f.codice)}</span>` : f.proposto ? chipStato("da_verificare", `in anagrafica Esolver: ${f.proposto.nome}`, `Esolver? ${f.proposto.codice}`) : chipStato("non_registrato", "nessun codice Esolver: scrivilo o scegli dall'anagrafica", "senza codice")}${f.societa ? `<span class="badge">${esc(f.societa)}</span>` : ""}
        <span class="num tot">${fmt(f.lordo, false)} €</span><span class="piccolo num">${f.n ? `${f.n} ${f.n === 1 ? "pagamento" : "pagamenti"} in ${f.progetti.length} ${f.progetti.length === 1 ? "progetto" : "progetti"} · ${f.primo === f.ultimo ? meseIt(f.primo) : `${meseIt(f.primo)} – ${meseIt(f.ultimo)}`}${f.lordoAcceso !== f.lordo ? ` · ${fmt(f.lordoAcceso, false)} nei progetti accesi` : ""}` : "nessun pagamento nello scenario"}${f.documenti ? ` · ${f.documenti} doc.` : ""}</span>
        ${f.drive_url ? `<a class="doc" href="${esc(f.drive_url)}" target="_blank" rel="noopener">Drive</a>` : ""}<button type="button" class="mini apri-leva" data-apri-foglio aria-label="apri">apri ›</button></summary>
      <div class="corpo">
        <div class="riga"><input type="text" class="nome" style="flex:1 1 160px" data-vf="nome" value="${esc(f.nome)}" placeholder="nome del fornitore">
          <label class="piccolo">Esolver <input type="text" class="n" style="width:80px" data-vf="codice_esolver" value="${esc(f.codice || "")}" list="lista-esolver" placeholder="codice"></label>
          ${f.proposto && !f.codice ? `<button type="button" class="mini" data-vf-usa="${esc(f.proposto.codice)}" title="${esc(f.proposto.nome)}">usa ${esc(f.proposto.codice)} · ${esc(f.proposto.nome)}</button>` : ""}
          ${selSocV(f.societa)}</div>
        <div class="riga"><label class="piccolo" style="flex:1 1 220px;display:flex;gap:6px;align-items:center">cartella Drive <input type="url" class="nome" style="flex:1 1 160px" data-vf="drive_url" value="${esc(f.drive_url)}" placeholder="https://drive.google.com/…"></label></div>
        <div class="piccolo">${f.progetti.length ? `nei progetti: ${f.progetti.map(esc).join(" · ")}` : "non ancora in un pagamento: scrivi il suo id in «fornitore» dentro un pagamento"}</div>
        <div class="riga"><span class="piccolo"><strong>patti abituali</strong> · ${f.patti ? `${esc(riassuntoPatti(f.patti))} <button type="button" class="mini" data-vf-dimentica title="dimentica i patti abituali">× dimentica</button>` : "nessuno: in un progetto, dentro «Come paghi …», premi «ricorda come patti abituali»"}</span></div>
        <div class="nota">il nome è il nostro, il codice aggancia Esolver${f.codice && nomeEsolver(f.codice) ? ` (${esc(nomeEsolver(f.codice))})` : ""} · id nei pagamenti: <code>${esc(f.id)}</code></div>
      </div></details>`; }).join("");
    const ana = D.fornitori || [];
    el("fornitori").innerHTML = `${html || '<div class="nota">nessun fornitore: compare qui chi è scritto in «fornitore» dentro un pagamento</div>'}
      <datalist id="lista-esolver">${ana.map((f) => `<option value="${esc(f.codice)}">${esc(f.nome)}${f.societa ? ` · ${esc(f.societa)}` : ""}</option>`).join("")}</datalist>
      <datalist id="lista-fornitori-id">${righe.map((f) => `<option value="${esc(f.id)}">${esc(f.nome)}</option>`).join("")}</datalist>
      <datalist id="lista-esolver-nomi">${ana.map((f) => `<option value="${esc(f.nome)}">${esc(f.codice)}${f.societa ? ` · ${esc(f.societa)}` : ""}</option>`).join("")}</datalist>
      <div class="strumenti"><input type="text" id="nuovo-v" class="nome" style="width:220px" placeholder="nuovo fornitore: nome" list="lista-esolver-nomi"><button id="aggiungi-v">+ fornitore</button>
        <span class="piccolo">${ana.length ? `anagrafica Esolver: ${ana.length} fornitori` : "anagrafica Esolver non caricata in questa pagina"}</span></div>`;
  }

  // Le sostituzioni dello scenario raggruppate per (società, voce), nell'ordine dei mesi.
  function gruppiCorrezioni(sc) {
    const per = new Map();
    for (const r of sc.manuali || []) {
      if (r.origine !== MOTORE.SOSTITUZIONE) continue;
      const k = `${r.societa}|${r.voce_id}`;
      if (!per.has(k)) per.set(k, { societa: r.societa, voce_id: r.voce_id, direzione: r.direzione, righe: [] });
      per.get(k).righe.push(r);
    }
    for (const g of per.values()) g.righe.sort((a, b) => a.mese.localeCompare(b.mese));
    return [...per.values()].sort((a, b) => `${a.societa}${a.voce_id}`.localeCompare(`${b.societa}${b.voce_id}`));
  }
  const importoDi = (r) => (r.importo_cent !== undefined ? r.importo_cent : r.importo);
  const pfDi = (soc, voce, mese) => D.pf.filter((r) => r.societa === soc && r.voce_id === voce && r.mese === mese).reduce((s, r) => s + r.importo, 0);

  // Dividi una rata: metà va al mese dopo (si somma se c'è già una rata), il resto dei centesimi resta dov'era.
  function dividiRata(mesi, m) {
    const v = mesi[m];
    const dopo = D.mesi[D.mesi.indexOf(m) + 1];
    if (!v || !dopo) return false;
    const meta = Math.floor(v / 2);
    mesi[m] = v - meta;
    mesi[dopo] = (mesi[dopo] || 0) + meta;
    return true;
  }
  // Unisci una rata con la successiva di questo pagamento: tutto nel mese più vicino.
  function unisciRata(mesi, m) {
    const chiavi = Object.keys(mesi).sort();
    const dopo = chiavi[chiavi.indexOf(m) + 1];
    if (!dopo) return false;
    mesi[m] = (mesi[m] || 0) + (mesi[dopo] || 0);
    delete mesi[dopo];
    return true;
  }
  function leggiMesi(root, pref, mesi, dopo = ricalcola) {
    root.querySelectorAll(`input[data-${pref}]`).forEach((inp) => {
      inp.onchange = () => { const v = euroDa(inp); if (v === null) return; if (v) mesi[inp.dataset[pref]] = v; else delete mesi[inp.dataset[pref]]; dopo(); };
    });
    const camel = pref.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
    root.querySelectorAll(`button[data-${pref}-dividi]`).forEach((b) => { b.onclick = (e) => { e.preventDefault(); if (dividiRata(mesi, b.dataset[`${camel}Dividi`])) dopo(); }; });
    root.querySelectorAll(`button[data-${pref}-unisci]`).forEach((b) => { b.onclick = (e) => { e.preventDefault(); if (unisciRata(mesi, b.dataset[`${camel}Unisci`])) dopo(); }; });
    const nuovo = root.querySelector(`select[data-${pref}-nuovo]`);
    if (nuovo) nuovo.onchange = () => { if (nuovo.value) { mesi[nuovo.value] = 0; renderLeve(); } };
  }

  function collegaLeve() {
    const sc = stato.scenario;
    const tutte = (pre, aperto) => { document.querySelectorAll(`details.leva[data-k^="${pre}"]`).forEach((d) => { d.open = aperto; }); renderLeve(); };
    document.querySelectorAll("button[data-apri]").forEach((b) => { b.onclick = () => tutte(`${b.dataset.apri}:`, true); });
    document.querySelectorAll("button[data-chiudi]").forEach((b) => { b.onclick = () => tutte(`${b.dataset.chiudi}:`, false); });
    // progetti
    el("progetti").querySelectorAll("details.leva[data-p]").forEach((div) => {
      const p = sc.progetti[parseInt(div.dataset.p, 10)];
      div.querySelector("input[data-acceso]").onchange = (e) => { p.acceso = e.target.checked; ricalcola(); };
      div.querySelectorAll(".corpo > .riga [data-campo]").forEach((inp) => {
        inp.onchange = () => {
          const v = inp.value.trim();
          // un progetto con una sola macro col suo nome (scenario /1): la macro segue il nome
          const sola = p.livelli.macro.length === 1 && p.livelli.macro[0].nome === p.nome ? p.livelli.macro[0] : null;
          if (inp.dataset.campo === "drive_url" && !v) delete p.drive_url; else p[inp.dataset.campo] = inp.dataset.campo === "drive_url" ? v : inp.value;
          if (sola && inp.dataset.campo === "nome") sola.nome = p.nome;
          aggiornaProgetto(p);
        };
      });
      div.querySelector("button[data-elimina-p]").onclick = () => { sc.progetti.splice(sc.progetti.indexOf(p), 1); ricalcola(); };
      div.querySelectorAll(".contratto").forEach((box) => collegaContratto(box, p, p.contratti[+box.dataset.c]));
      div.querySelector("button[data-aggiungi-c]").onclick = () => {
        p.contratti = p.contratti || [];
        // una sottovoce sola di un fornitore che non ha ancora patti: i patti nascono dai suoi mesi e restano legati a lei
        const usati = new Set(p.contratti.map((c) => String(c.fornitore).trim()));
        const voci = p.livelli.macro.flatMap((m) => m.voci || []);
        const v = voci.find((x) => x.fornitore_id && !usati.has(x.fornitore_id) && voci.filter((y) => y.fornitore_id === x.fornitore_id).length === 1);
        p.contratti.push(v ? { ...FORMATO.contrattoDaPagamenti(p.pagamenti.filter((g) => g.voce_id === v.id), v.fornitore_id, D.mesi), voce_id: v.id }
          : { fornitore: "", totale: 0, aliquota_iva: 22, stato: "contratto", modo: "sal", anticipo_pct: 0, anticipo_mese: D.mesi[0], ritenuta_pct: 0,
              svincolo_mese: D.mesi[D.mesi.length - 1], sal_modo: "n", sal_n: 1, sal_ogni: 0, sal_da: D.mesi[0], sal_passo: 1, quote: [] });
        mostraPatti(p, p.contratti[p.contratti.length - 1]);
        renderLeve();
      };
      collegaLivelli(div, p);
    });
    el("aggiungi-p").onclick = () => { const id = `P${Date.now().toString(36)}`; sc.progetti.push({ id, nome: "Nuovo progetto", societa: "INTUR", acceso: true, stato: "ipotesi", pagamenti: [], contratti: [], livelli: { budget_netto: null, mesi_budget: null, aliquota_iva: 22, macro: [] } }); aperte.add(`p:${id}`); ricalcola(); };
    // finanziamenti
    el("finanziamenti").querySelectorAll("details.leva[data-f]").forEach((div) => {
      const i = parseInt(div.dataset.f, 10);
      const f = sc.finanziamenti[i];
      div.querySelectorAll(".corpo > .riga [data-campo]").forEach((inp) => { inp.onchange = () => { f[inp.dataset.campo] = inp.value; ricalcola(); }; });
      div.querySelector("button[data-elimina-f]").onclick = () => { sc.finanziamenti.splice(i, 1); ricalcola(); };
      leggiMesi(div, "erog", f.erogazioni);
      leggiMesi(div, "rata", f.rate);
      collegaTranche(div.querySelector(".riquadro.tranche"), f);
      collegaRate(div.querySelector(".rate-f .come"), () => f.rate, (m) => { f.rate = m; }, 0);
      div.querySelectorAll(".documenti .riga[data-doc]").forEach((r) => {
        const d = f.documenti[parseInt(r.dataset.doc, 10)];
        r.querySelector("input[data-doc-titolo]").onchange = (e) => { d.titolo = e.target.value.trim(); ricalcola(); };
        r.querySelector("input[data-doc-url]").onchange = (e) => { d.url = e.target.value.trim(); ricalcola(); };
        r.querySelector("button[data-elimina-doc]").onclick = () => { f.documenti.splice(f.documenti.indexOf(d), 1); if (!f.documenti.length) delete f.documenti; ricalcola(); };
      });
      div.querySelector(".documenti button[data-aggiungi-doc]").onclick = () => { f.documenti = f.documenti || []; f.documenti.push({ titolo: "", url: "" }); aperte.add(`f:${f.id}`); renderLeve(); };
    });
    el("aggiungi-f").onclick = () => { const id = `F${Date.now().toString(36)}`; sc.finanziamenti.push({ id, nome: "Nuovo finanziamento", societa: "INTUR", erogazioni: {}, rate: {}, stato: "da verificare" }); aperte.add(`f:${id}`); ricalcola(); };
    // fornitori
    el("fornitori").querySelectorAll("details.leva[data-v]").forEach((div) => {
      const id = div.dataset.v;
      sc.fornitori = sc.fornitori || {};
      const f = () => (sc.fornitori[id] = sc.fornitori[id] || {});
      div.querySelectorAll("[data-vf]").forEach((inp) => {
        inp.onchange = () => {
          const v = inp.value.trim(), campo = inp.dataset.vf;
          if (v) f()[campo] = campo === "codice_esolver" && /^\d+$/.test(v) ? parseInt(v, 10) : v;
          else { delete f()[campo]; if (!Object.keys(f()).length) delete sc.fornitori[id]; }
          ricalcola();
        };
      });
      const dim = div.querySelector("button[data-vf-dimentica]");
      if (dim) dim.onclick = () => { delete f().patti; if (!Object.keys(f()).length) delete sc.fornitori[id]; ricalcola(); };
      const usa = div.querySelector("button[data-vf-usa]");
      if (usa) usa.onclick = () => {
        const c = parseInt(usa.dataset.vfUsa, 10), a = (D.fornitori || []).find((x) => x.codice === c);
        f().codice_esolver = c;
        if (a && !f().nome) f().nome = a.nome;
        if (a && a.societa && !f().societa) f().societa = a.societa;
        ricalcola();
      };
    });
    el("aggiungi-v").onclick = () => {
      const nome = el("nuovo-v").value.trim();
      if (!nome) { el("nuovo-v").focus(); return; }
      const id = nome.toUpperCase().replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 24) || `F${Date.now().toString(36)}`;
      sc.fornitori = sc.fornitori || {};
      sc.fornitori[id] = sc.fornitori[id] || { nome };
      const r = riconosci(nome);
      if (r && !sc.fornitori[id].codice_esolver) { sc.fornitori[id].codice_esolver = r.codice; if (r.societa) sc.fornitori[id].societa = sc.fornitori[id].societa || r.societa; }
      aperte.add(`v:${id}`);
      ricalcola();
    };
    // voci del PF corrette
    const gruppi = gruppiCorrezioni(sc);
    const scrivi = (r, campo, v) => { r[campo] = v; if (campo === "importo") delete r.importo_cent; };
    el("correzioni").querySelectorAll("details.leva[data-c]").forEach((div) => {
      const g = gruppi[parseInt(div.dataset.c, 10)];
      div.querySelectorAll(".corpo > .riga[data-cr]").forEach((riga) => {
        const r = g.righe[parseInt(riga.dataset.cr, 10)];
        riga.querySelector("select.sel-corr-mese").onchange = (e) => { scrivi(r, "mese", e.target.value); ricalcola(); };
        riga.querySelector("input[data-corr-importo]").onchange = (e) => { const v = euroDa(e.target); if (v === null) return; scrivi(r, "importo", v); ricalcola(); };
        riga.querySelector("button[data-elimina-cr]").onclick = () => { sc.manuali.splice(sc.manuali.indexOf(r), 1); ricalcola(); };
      });
      div.querySelector("button[data-aggiungi-cr]").onclick = () => {
        const usati = new Set(g.righe.map((r) => r.mese));
        const mese = D.mesi.find((m) => !usati.has(m)) || D.mesi[D.mesi.length - 1];
        sc.manuali.push({ societa: g.societa, voce_id: g.voce_id, mese, importo: pfDi(g.societa, g.voce_id, mese), direzione: g.direzione, origine: MOTORE.SOSTITUZIONE });
        ricalcola();
      };
      div.querySelector("button[data-elimina-c]").onclick = () => { sc.manuali = sc.manuali.filter((r) => !g.righe.includes(r)); ricalcola(); };
    });
    el("aggiungi-c").onclick = () => {
      const [socScelta, voce, dir] = el("corr-voce").value.split("|");
      const mese = D.mesi.find((m) => pfDi(socScelta, voce, m) > 0) || D.mesi[0];
      sc.manuali = sc.manuali || [];
      sc.manuali.push({ societa: socScelta, voce_id: voce, mese, importo: pfDi(socScelta, voce, mese), direzione: dir, origine: MOTORE.SOSTITUZIONE });
      aperte.add(`c:${socScelta}:${voce}`);
      ricalcola();
    };
  }

  function renderLimiti() {
    const extra = [];
    if (ris.non_riconciliati.length) extra.push(`Nello scenario corrente ${ris.non_riconciliati.length} fatti non trovano un pagamento di progetto dello stesso fornitore nello scenario; contano comunque come uscita.`);
    for (const p of stato.scenario.progetti) for (const g of p.pagamenti) if (/verificare/i.test(g.nome) || /verificare/i.test(g.stato)) extra.push(`${p.nome}: ${g.nome} — ${p.acceso ? "conta in cassa" : "spento"}, da verificare.`);
    el("limiti").innerHTML = `<ul>${D.limiti.concat(extra).map((l) => `<li>${esc(l)}</li>`).join("")}</ul>`;
  }

  // ── calendario dei pagamenti: una riga per leva, una colonna per mese; le rate si trascinano ──
  const breve = (v) => { const e = Math.abs(v) / 100; return (v < 0 ? "−" : "") + (e >= 1e6 ? `${pctIt(Math.round(e / 1e5) / 10)}M` : e >= 1000 ? `${Math.round(e / 1000)}k` : `${Math.round(e)}`); };
  // Le righe del calendario: per ogni riga, dove stanno i mesi (in netto) e come si leggono in cassa.
  function righeCalendario() {
    const sc = stato.scenario, out = [];
    sc.progetti.forEach((p, pi) => p.pagamenti.forEach((g, gi) => out.push({
      id: `p:${pi}:${gi}`, gruppo: `${p.nome} · ${p.societa}`, nome: g.nome, spento: !p.acceso, tipo: "uscita",
      mesi: () => g.mesi, scrivi: (m) => scriviMesiDerivati(p, g, m), lordo: (v) => MOTORE.iva(v, g.aliquota_iva), soc: p.societa,
    })));
    sc.finanziamenti.forEach((f, fi) => {
      out.push({ id: `e:${fi}`, gruppo: `Finanziamenti · ${f.societa}`, nome: `${f.nome} · erogazioni`, tipo: "entrata",
        mesi: () => f.erogazioni, scrivi: (m) => { f.erogazioni = m; }, lordo: (v) => v, soc: f.societa });
      out.push({ id: `r:${fi}`, gruppo: `Finanziamenti · ${f.societa}`, nome: `${f.nome} · rate`, tipo: "uscita",
        mesi: () => f.rate, scrivi: (m) => { f.rate = m; }, lordo: (v) => v, soc: f.societa });
    });
    return out;
  }
  function renderCalendario() {
    const righe = righeCalendario();
    const canone = {};
    const flCan = stato.scenario.canone ? (() => { try { return MOTORE.flussiCanone(stato.scenario.canone, D.mesi); } catch (e) { return []; } })()
      : D.intercompany.filter((f) => f.nome.startsWith("Fitto Hotel") && f.stato === "pf");
    for (const f of flCan) canone[f.mese] = (canone[f.mese] || 0) + f.importo;
    const max = Math.max(1, ...righe.flatMap((r) => Object.values(r.mesi()).map((v) => r.lordo(v))));
    const intens = (v) => `${Math.round(14 + 56 * Math.sqrt(Math.min(1, v / max)))}%`;
    const testa = `<tr><th class="voce"></th>${D.mesi.map((m) => `<th class="${IPO.has(m) ? "ipo" : ""}">${meseIt(m)}</th>`).join("")}</tr>`;
    let gruppo = "";
    const corpo = righe.map((r) => {
      const g = r.gruppo !== gruppo ? `<tr class="gruppo"><td class="voce" colspan="${D.mesi.length + 1}">${esc(r.gruppo)}</td></tr>` : "";
      gruppo = r.gruppo;
      const mesi = r.mesi();
      const celle = D.mesi.map((m) => {
        const v = mesi[m];
        const chip = v ? `<button type="button" class="chip ${r.tipo === "entrata" ? "entrata" : ""}" style="--a:${intens(r.lordo(v))}" data-r="${r.id}" data-m="${m}"
          title="${esc(r.nome)} · ${meseIt(m)} · ${fmt(r.lordo(v))} € ${r.tipo === "entrata" ? "in entrata" : "in uscita"}. Trascina in un altro mese, oppure frecce ← →" aria-label="${esc(r.nome)}, ${meseIt(m)}, ${fmt(r.lordo(v), false)} euro">${breve(r.lordo(v))}</button>` : "";
        return `<td class="${IPO.has(m) ? "ipo" : ""}" data-r="${r.id}" data-m="${m}">${chip}</td>`;
      }).join("");
      return `${g}<tr class="${r.spento ? "spento" : ""}"><td class="voce" title="${esc(r.nome)}">${esc(r.nome)}</td>${celle}</tr>`;
    }).join("");
    const rigaCanone = `<tr class="gruppo"><td class="voce" colspan="${D.mesi.length + 1}">Canone Fitto Hotel · ORTI → INTUR</td></tr>
      <tr><td class="voce">${stato.scenario.canone ? "scaletta dello scenario" : "come nel PF"}<small>si cambia dal riquadro del canone</small></td>${D.mesi.map((m) => `<td class="${IPO.has(m) ? "ipo" : ""}">${canone[m] ? `<span class="chip fisso" title="${fmt(canone[m])} € lordo">${breve(canone[m])}</span>` : ""}</td>`).join("")}</tr>`;
    const piede = SOC.map((soc, k) => {
      const usc = D.mesi.map((m) => righe.filter((r) => r.soc === soc && r.tipo === "uscita" && !r.spento).reduce((t, r) => t + (r.mesi()[m] ? r.lordo(r.mesi()[m]) : 0), 0));
      const fin = D.mesi.map((m) => (ris.righe.find((x) => x.societa === soc && x.mese === m) || {}).fin);
      const mm = ris.minimi[soc].mese;
      return `<tr class="tot ${k === 0 ? "primo" : ""}"><td class="voce">${soc} · leve in uscita</td>${usc.map((v, i) => `<td class="${IPO.has(D.mesi[i]) ? "ipo" : ""}">${v ? breve(v) : ""}</td>`).join("")}</tr>
        <tr class="tot"><td class="voce">${soc} · saldo di fine mese</td>${fin.map((v, i) => { const m = D.mesi[i]; return IPO.has(m) ? `<td class="ipo" title="senza PF: non è un saldo">—</td>` : `<td class="${m === mm ? "min" : ""}" title="${fmt(v)} €${m === mm ? " · minimo" : ""}">${breve(v)}</td>`; }).join("")}</tr>`;
    }).join("");
    el("calendario").innerHTML = `<div class="cal-testa"><div><strong>Calendario dei pagamenti</strong> <span class="piccolo">lordo in cassa · trascina una rata in un altro mese, o usa le frecce</span></div></div>
      <div class="cal-wrap"><table class="cal"><thead>${testa}</thead><tbody>${corpo || `<tr><td class="voce" colspan="${D.mesi.length + 1}">nessuna leva nello scenario</td></tr>`}${rigaCanone}${piede}</tbody></table></div>`;
    collegaCalendario(righe);
  }
  let toastTimer = null;
  function avvisa(testo, annulla) {
    const t = el("toast");
    t.innerHTML = `<span>${esc(testo)}</span>${annulla ? '<button type="button">annulla</button>' : ""}`;
    t.hidden = false;
    if (annulla) t.querySelector("button").onclick = () => { annulla(); t.hidden = true; };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
  }
  function muovi(riga, da, a) {
    if (da === a) return;
    const prima = { ...riga.mesi() };
    const minPrima = Object.fromEntries(SOC.map((x) => [x, ris.minimi[x].saldo]));
    const v = riga.lordo(prima[da]);
    riga.scrivi(FORMATO.spostaRata(prima, da, a));
    ricalcola();
    const eff = SOC.map((x) => { const d = ris.minimi[x].saldo - minPrima[x]; return d ? `minimo ${x} ${segno(d, false)}` : ""; }).filter(Boolean).join(" · ") || "minimi invariati";
    avvisa(`${riga.nome}: ${fmt(v, false)} € da ${meseIt(da)} a ${meseIt(a)} · ${eff}`, () => { riga.scrivi(prima); ricalcola(); });
  }
  function collegaCalendario(righe) {
    const perId = Object.fromEntries(righe.map((r) => [r.id, r]));
    const box = el("calendario");
    box.querySelectorAll(".chip[data-r]").forEach((chip) => {
      const riga = perId[chip.dataset.r], da = chip.dataset.m;
      chip.onkeydown = (e) => {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        e.preventDefault();
        const i = D.mesi.indexOf(da) + (e.key === "ArrowLeft" ? -1 : 1);
        if (i < 0 || i >= D.mesi.length) return;
        muovi(riga, da, D.mesi[i]);
        const nuovo = el("calendario").querySelector(`.chip[data-r="${riga.id}"][data-m="${D.mesi[i]}"]`);
        if (nuovo) nuovo.focus();
      };
      chip.onpointerdown = (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        // Niente cattura e niente preventDefault qui: finché il dito non si è mosso di SOGLIA_PRESA px
        // non si sa se vuole trascinare la rata o scorrere la pagina. touch-action: pan-y lascia lo
        // scorrimento verticale al browser, che in quel caso manda pointercancel e noi puliamo.
        const x0 = e.clientX, y0 = e.clientY, id = e.pointerId;
        const r0 = chip.getBoundingClientRect();
        const presaX = x0 - r0.left, presaY = y0 - r0.top;   // dove l'ha presa: la pillola resta lì sotto il dito
        let fantasma = null, bersaglio = null, celle = [];
        const posiziona = (x, y) => { fantasma.style.transform = `translate(${x - presaX}px, ${y - presaY}px) scale(1.08)`; };
        const inizia = () => {
          try { chip.setPointerCapture(id); } catch (err) { /* senza cattura il trascinamento funziona lo stesso */ }
          fantasma = chip.cloneNode(true);
          fantasma.classList.remove("preso", "in-volo");
          fantasma.classList.add("fantasma");
          fantasma.style.width = `${r0.width}px`;
          fantasma.style.transformOrigin = `${presaX}px ${presaY}px`;
          document.body.appendChild(fantasma);
          chip.classList.add("preso");
          celle = [...box.querySelectorAll(`td[data-r="${riga.id}"]`)];
          celle.forEach((td) => td.classList.add("puo"));
        };
        const pulisci = () => {
          chip.onpointermove = chip.onpointerup = chip.onpointercancel = null;
          chip.classList.remove("preso");
          celle.forEach((td) => td.classList.remove("puo", "bersaglio"));
        };
        // Il fantasma vola da dove lo lasci alla cella dove atterra, o torna da dove è partito:
        // breve, smorzato, senza rimbalzo, così l'occhio segue la rata invece di perderla.
        const vola = (f, aRect, dopo) => {
          if (ridotto() || !f.animate) { f.remove(); if (dopo) dopo(); return; }
          const fr = f.getBoundingClientRect();
          f.style.transformOrigin = "0 0";
          const da = `translate(${fr.left}px, ${fr.top}px) scale(${fr.width / r0.width})`;
          const a = `translate(${aRect.left}px, ${aRect.top}px) scale(1)`;
          f.style.transform = da;
          const anim = f.animate([{ transform: da }, { transform: a }], { duration: 240, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
          anim.onfinish = anim.oncancel = () => { f.remove(); if (dopo) dopo(); };
        };
        chip.onpointermove = (ev) => {
          if (!fantasma) {
            const dx = ev.clientX - x0, dy = ev.clientY - y0;
            if (Math.hypot(dx, dy) < SOGLIA_PRESA) return;
            if (Math.abs(dy) > Math.abs(dx)) { pulisci(); return; }   // voleva scorrere, non trascinare
            inizia();
          }
          ev.preventDefault();
          posiziona(ev.clientX, ev.clientY);
          const sotto = document.elementFromPoint(ev.clientX, ev.clientY);
          const td = sotto && sotto.closest(`td[data-r="${riga.id}"]`);
          if (td !== bersaglio) { if (bersaglio) bersaglio.classList.remove("bersaglio"); bersaglio = td; if (td) td.classList.add("bersaglio"); }
        };
        chip.onpointercancel = () => { pulisci(); if (fantasma) fantasma.remove(); };
        chip.onpointerup = () => {
          const f = fantasma, dest = bersaglio;
          pulisci();
          if (!f) return;                                   // un tocco, non un trascinamento
          if (dest && dest.dataset.m !== da) {
            const a = dest.dataset.m;
            muovi(riga, da, a);                             // ridisegna: la rata nuova è già nella cella di arrivo
            const nuovo = el("calendario").querySelector(`.chip[data-r="${riga.id}"][data-m="${a}"]`);
            if (!nuovo) { f.remove(); return; }
            nuovo.scrollIntoView({ block: "nearest", inline: "nearest" });
            nuovo.classList.add("in-volo");
            vola(f, nuovo.getBoundingClientRect(), () => nuovo.classList.remove("in-volo"));
          } else {
            vola(f, chip.getBoundingClientRect());          // niente bersaglio: torna da dove è partita
          }
        };
      };
    });
  }

  function render(opts = {}) {
    sincronizzaAperte();
    renderMinimi();
    renderGrafici();
    renderTabelle();
    renderConsolidato();
    renderLeve();
    renderCalendario();
    renderLimiti();
    if (opts.canoneLeggero) aggiornaCanoneInfo(); else renderCanone();
    riassunti();
    applicaVista();
  }

  // ── Vista «Scenario a tutto schermo» ──
  // Uno stato, una classe sul body, lo stesso DOM. La lista mostra cosa c'è; una leva aperta alla volta è il
  // foglio (telefono) o il pannello a destra (desktop). Il foglio entra dal basso ed esce dal basso; si chiude
  // tirandolo giù — decide la velocità, non la posizione — toccando lo sfondo, o con ✕.
  const vista = { attiva: false, seg: "progetti", apertaK: null, blocchiPrima: null, scroll: 0 };
  const SEGMENTI = ["progetti", "finanziamenti", "correzioni", "fornitori", "calendario", "scenario"];
  const largo = () => window.matchMedia("(min-width: 900px)").matches;
  function misuraVista() {
    const h1 = el("leve-top").getBoundingClientRect().height;
    const barra = el("barra-minimi");
    const h2 = barra.hidden && !vista.attiva ? 0 : barra.getBoundingClientRect().height;
    const seg = el("leve-seg");
    seg.style.top = `${h1 + h2}px`;
    const h3 = seg.getBoundingClientRect().height;
    document.documentElement.style.setProperty("--leve-h1", `${h1}px`);
    document.documentElement.style.setProperty("--leve-top-h", `${h1 + h2 + h3}px`);
  }
  function entraVista(seg) {
    if (!vista.attiva) {
      vista.blocchiPrima = blocchi().map((d) => [d.dataset.blocco, d.open]);
      vista.attiva = true;
      document.body.classList.add("vista-leve");
      el("leve-top").hidden = false;
      el("leve-seg").hidden = false;
      blocchi().forEach((d) => { if (d.dataset.blocco === "leve" || d.dataset.blocco === "calendario") d.open = true; });
      window.scrollTo(0, 0);
    }
    scegliSegmento(SEGMENTI.includes(seg) ? seg : vista.seg, false);
    misuraVista();
    applicaVista();
  }
  function esciVista() {
    if (!vista.attiva) return;
    chiudiFoglio(false);
    vista.attiva = false;
    document.body.classList.remove("vista-leve");
    document.body.removeAttribute("data-seg");
    el("leve-top").hidden = true;
    el("leve-seg").hidden = true;
    (vista.blocchiPrima || []).forEach(([k, open]) => { const d = document.querySelector(`details.blocco[data-blocco="${k}"]`); if (d) d.open = open; });
    salvaBlocchi();
    if (location.hash.startsWith("#leve")) history.replaceState(null, "", location.pathname + location.search);
    el("minimi").scrollIntoView({ behavior: "auto", block: "start" });
  }
  function scegliSegmento(seg, chiudi = true) {
    vista.seg = seg;
    document.body.dataset.seg = seg;
    el("leve-seg").querySelectorAll("button[data-seg]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.seg === seg)));
    if (chiudi) chiudiFoglio(false);
    history.replaceState(null, "", `#leve/${seg}`);
    window.scrollTo(0, 0);
  }
  // Il foglio: una leva sola. Dopo ogni render si riapplica, perché la lista è ridisegnata da capo.
  function apriFoglio(d, anima = true) {
    const k = d.dataset.k;
    document.querySelectorAll("details.leva.aperta").forEach((x) => { if (x !== d) { x.classList.remove("aperta"); x.open = false; aperte.delete(x.dataset.k); x.querySelector(".chiudi-foglio")?.remove(); } });
    vista.apertaK = k;
    d.open = true;
    aperte.add(k);
    d.classList.add("aperta");
    const s = d.querySelector(":scope > summary");
    if (s && !s.querySelector(".chiudi-foglio")) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chiudi-foglio"; b.textContent = "✕"; b.setAttribute("aria-label", "chiudi");
      b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); chiudiFoglio(true); };
      s.appendChild(b);
    }
    el("leve-scrim").hidden = false;
    if (anima && !ridotto() && !largo() && d.animate) d.animate([{ transform: "translateY(100%)" }, { transform: "translateY(0)" }], { duration: 280, easing: "cubic-bezier(.2,.8,.2,1)" });
    else if (anima && ridotto() && d.animate) d.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: "ease" });
  }
  function chiudiFoglio(anima = true, daY = 0) {
    const d = document.querySelector("details.leva.aperta");
    vista.apertaK = null;
    el("leve-scrim").hidden = true;
    if (!d) return;
    const fine = () => { d.classList.remove("aperta"); d.open = false; aperte.delete(d.dataset.k); d.querySelector(".chiudi-foglio")?.remove(); d.style.transform = ""; };
    if (anima && !ridotto() && !largo() && d.animate) {
      const h = d.getBoundingClientRect().height || 400;
      const a = d.animate([{ transform: `translateY(${daY}px)` }, { transform: `translateY(${h}px)` }], { duration: Math.max(120, 240 * (1 - daY / h)), easing: "cubic-bezier(.4,0,1,1)" });
      a.onfinish = fine; a.oncancel = fine;
    } else if (anima && ridotto() && d.animate) {
      const a = d.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, easing: "ease" });
      a.onfinish = fine; a.oncancel = fine;
    } else fine();
  }
  // Tirare giù il foglio: 1:1 col dito, resistenza verso l'alto, rilascio deciso dalla velocità.
  function collegaTrascinaFoglio(s, d) {
    if (s.dataset.trascina) return;
    s.dataset.trascina = "1";
    let p0 = null, y0 = 0, storia = [], preso = false;
    s.addEventListener("pointerdown", (e) => {
      if (largo() || e.target.closest("button, input, select, a")) return;
      p0 = e.pointerId; y0 = e.clientY; storia = [[e.clientY, performance.now()]]; preso = false;
    });
    s.addEventListener("pointermove", (e) => {
      if (p0 !== e.pointerId) return;
      const dy = e.clientY - y0;
      if (!preso) { if (Math.abs(dy) < SOGLIA_PRESA) return; preso = true; s.setPointerCapture(p0); }
      storia.push([e.clientY, performance.now()]); if (storia.length > 6) storia.shift();
      const y = dy >= 0 ? dy : -(Math.abs(dy) * 60) / (60 + Math.abs(dy));  // sotto 1:1, sopra elastico
      d.style.transform = `translateY(${y}px)`;
      e.preventDefault();
    });
    const fine = (e) => {
      if (p0 !== e.pointerId) return;
      const dy = e.clientY - y0;
      p0 = null;
      if (!preso) return;
      const [[ya, ta]] = storia, [yb, tb] = storia[storia.length - 1];
      const v = tb > ta ? ((yb - ya) / (tb - ta)) * 1000 : 0;  // px/s
      const h = d.getBoundingClientRect().height || 400;
      if (v > 500 || (dy > h * 0.35 && v > -200)) { chiudiFoglio(true, Math.max(0, dy)); return; }
      if (!ridotto() && d.animate) { const a = d.animate([{ transform: `translateY(${Math.max(0, dy)}px)` }, { transform: "translateY(0)" }], { duration: 220, easing: "cubic-bezier(.2,.8,.2,1)" }); a.onfinish = () => { d.style.transform = ""; }; }
      else d.style.transform = "";
    };
    s.addEventListener("pointerup", fine);
    s.addEventListener("pointercancel", fine);
  }
  function applicaVista() {
    const titolo = el("leve-titolo");
    if (titolo) titolo.textContent = stato.nome || "Scenario";
    if (!vista.attiva) return;
    document.querySelectorAll("#progetti details.leva, #finanziamenti details.leva, #correzioni details.leva, #fornitori details.leva").forEach((d) => {
      const s = d.querySelector(":scope > summary");
      if (!s || s.dataset.vista) return;
      s.dataset.vista = "1";
      // In vista il riepilogo non apre/chiude la tendina: apre il foglio. Il click dopo un trascinamento non conta.
      s.addEventListener("click", (e) => {
        if (!vista.attiva) return;
        const apri = e.target.closest("button[data-apri-foglio]");
        if (!apri && e.target.closest("input, select, button, label, a")) return;
        e.preventDefault();
        if (d.classList.contains("aperta")) return;
        apriFoglio(d, true);
      });
      collegaTrascinaFoglio(s, d);
    });
    if (vista.apertaK) {
      const d = document.querySelector(`details.leva[data-k="${vista.apertaK}"]`);
      if (d && !d.classList.contains("aperta")) { const sc = vista.scroll; apriFoglio(d, false); d.scrollTop = sc; }
      else if (!d) chiudiFoglio(false);
    }
    misuraVista();
  }
  // Dentro una leva, un pagamento aperto alla volta: aprirne uno chiude gli altri.
  document.addEventListener("toggle", (e) => {
    const d = e.target;
    if (!(d instanceof HTMLDetailsElement) || !d.classList.contains("sotto") || !d.open) return;
    const leva = d.closest("details.leva");
    if (!leva) return;
    leva.querySelectorAll("details.sotto[open]").forEach((x) => { if (x !== d) { x.open = false; aperte.delete(x.dataset.k); } });
  }, true);
  document.addEventListener("scroll", () => { const d = document.querySelector("details.leva.aperta"); if (d) vista.scroll = d.scrollTop; }, true);
  el("apri-leve").onclick = (e) => { e.preventDefault(); e.stopPropagation(); entraVista(vista.seg); };
  el("esci-leve").onclick = esciVista;
  el("leve-salva").onclick = () => esporta();
  el("leve-seg").querySelectorAll("button[data-seg]").forEach((b) => { b.onclick = () => scegliSegmento(b.dataset.seg); });
  el("leve-scrim").onclick = () => chiudiFoglio(true);
  window.addEventListener("resize", () => { if (vista.attiva) misuraVista(); });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape" && vista.attiva && document.querySelector("details.leva.aperta")) chiudiFoglio(true); });
  if (location.hash.startsWith("#leve")) setTimeout(() => entraVista(location.hash.split("/")[1]), 0);

  // Blocchi apribili: chiusi danno il quadro (titolo + una riga), aperti il dettaglio.
  // Quali sono aperti è una comodità di chi guarda: resta nel suo browser, se il browser lo permette.
  const CHIAVE_BLOCCHI = "cdg-cassa-blocchi";
  function blocchi() { return [...document.querySelectorAll("details.blocco")]; }
  function salvaBlocchi() {
    try { localStorage.setItem(CHIAVE_BLOCCHI, JSON.stringify(blocchi().filter((d) => d.open).map((d) => d.dataset.blocco))); } catch (e) { /* senza memoria va bene lo stesso */ }
  }
  function collegaBlocchi() {
    let aperti = [];
    try { aperti = JSON.parse(localStorage.getItem(CHIAVE_BLOCCHI) || "[]"); } catch (e) { aperti = []; }
    blocchi().forEach((d) => { d.open = aperti.includes(d.dataset.blocco); d.addEventListener("toggle", salvaBlocchi); });
    el("apri-tutto").onclick = () => { blocchi().forEach((d) => { if (!d.hidden) d.open = true; }); };
    el("chiudi-tutto").onclick = () => { blocchi().forEach((d) => { d.open = false; }); };
  }
  function riassunti() {
    const sc = stato.scenario;
    const som = (k, t) => { el(`som-${k}`).textContent = t; };
    som("canone", `${fmt(lordoSlider(), false)} € lordo l'anno · ${sc.canone ? "scaletta dello scenario" : "come nel PF"}`);
    const righe = righeCalendario();
    som("calendario", `${righe.length} righe da trascinare, ${meseIt(D.mesi[0])} – ${meseIt(D.mesi[D.mesi.length - 1])}`);
    som("saldo", `${SOC.join(" e ")}, scenario contro solo PF`);
    const accesi = sc.progetti.filter((p) => p.acceso).length;
    const nCorr = gruppiCorrezioni(sc).length;
    som("leve", `«${stato.nome}» · ${accesi} progetti accesi su ${sc.progetti.length} · ${sc.finanziamenti.length} finanziamenti${nCorr ? ` · ${nCorr === 1 ? "una voce del PF corretta" : `${nCorr} voci del PF corrette`}` : ""}`);
    som("tabelle", `${SOC.join(" e ")}: entrate, uscite e leve per mese`);
    som("consolidato", "le due società insieme, intercompany tolto");
    const fb = document.querySelector('details.blocco[data-blocco="fatti"]');
    fb.hidden = !D.fatti.length;
    som("fatti", `${D.fatti.length} pagamenti già fatti`);
    som("limiti", `${el("limiti").querySelectorAll("li").length} cose che la pagina non sa`);
  }

  renderTesta();
  renderFonti();
  renderScenario();
  collegaBlocchi();
  ricalcola();
  proponiBozza();
  // La barra dei minimi compare solo quando la card è uscita dallo schermo verso l'alto.
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([e]) => {
      el("barra-minimi").hidden = e.isIntersecting || e.boundingClientRect.top > 0;
    }, { threshold: 0 }).observe(el("minimi"));
  }
})();
</script>
</body>
</html>
