    const fatti = p.pagamenti.filter((g) => F && g.fornitore_id === F).reduce((t, g) => t + somma(g.mesi), 0);
    const diff = fatti - (c.totale || 0);
    // Verifica mese per mese: i pagamenti verso F seguono i patti scritti qui sopra?
    const perMese = (lista) => { const o = {}; for (const g of lista) for (const [m, v] of Object.entries(g.mesi)) o[m] = (o[m] || 0) + v; return JSON.stringify(Object.entries(o).filter(([, v]) => v).sort()); };
    let seguono = false;
    try { seguono = perMese(FORMATO.pagamentiDaContratto(c, D.mesi)) === perMese(p.pagamenti.filter((g) => g.fornitore_id === F)); } catch (e) { seguono = false; }
    const verifica = !F ? "" : seguono
      ? `<span class="ok-t">✓ i pagamenti verso ${esc(F)} seguono questi patti: ${fmt(c.totale, false)} netto</span>`
      : diff !== 0
        ? `<span class="warn-t">i pagamenti verso ${esc(F)} fanno ${fmt(fatti, false)}: ${diff < 0 ? "mancano" : "avanzano"} ${fmt(Math.abs(diff), false)}. Premi «Genera».</span>`
        : `<span class="warn-t">il totale torna, ma le rate verso ${esc(F)} non seguono ancora questi patti. Premi «Genera».</span>`;
    const iva = [0, 10, 22].includes(c.aliquota_iva) ? [0, 10, 22] : [0, 10, 22, c.aliquota_iva].sort((a, b) => a - b);
    const patti = c.modo === "percentuali"
      ? `<div class="riga">${(c.quote || []).map((q, qi) => `<span class="quota"><input type="text" class="n" data-q-pct="${qi}" value="${pctIt(q.pct)}">% a ${selMeseA(q.mese, `data-q-mese="${qi}"`)}<button class="mini" data-q-togli="${qi}" title="togli quota">×</button></span>`).join("")}
          <button class="mini" data-q-aggiungi>+ quota</button></div>`
      : `<div class="riga">anticipo <input type="text" class="n" data-cc-pct="anticipo_pct" value="${pctIt(c.anticipo_pct)}">% a ${selMeseA(c.anticipo_mese, 'data-cc="anticipo_mese"')}
          · ritenuta <input type="text" class="n" data-cc-pct="ritenuta_pct" value="${pctIt(c.ritenuta_pct)}">% svincolata a ${selMeseA(c.svincolo_mese, 'data-cc="svincolo_mese"')}</div>
        <div class="riga">SAL <select data-cc="sal_modo"><option value="n" ${c.sal_modo !== "ogni" ? "selected" : ""}>in rate uguali</option><option value="ogni" ${c.sal_modo === "ogni" ? "selected" : ""}>uno ogni … € di lavori</option></select>
          ${c.sal_modo === "ogni" ? `ogni <input type="text" class="eur" data-cc-eur="sal_ogni" value="${fmt(c.sal_ogni || 0)}">` : `<input type="text" class="n" data-cc-int="sal_n" value="${c.sal_n || 1}"> SAL`}
          <select data-cc-int="sal_passo">${PASSI.map(([x, e]) => `<option value="${x}" ${x === (c.sal_passo || 1) ? "selected" : ""}>${e}</option>`).join("")}</select>
          dal ${selMeseA(c.sal_da, 'data-cc="sal_da"')}</div>`;
    return `<div class="contratto" data-c="${ci}">
      <div class="c-testa"><strong>Contratto ${esc(F || "nuovo")}</strong><span class="piccolo">${esc(riassuntoContratto(c))}</span></div>
      <div class="riga">fornitore <input type="text" class="n" style="width:110px" data-cc="fornitore" value="${esc(F)}">
        totale <input type="text" class="eur" data-cc-eur="totale" value="${fmt(c.totale || 0)}"> netto
        <select data-cc-int="aliquota_iva">${iva.map((a) => `<option value="${a}" ${a === c.aliquota_iva ? "selected" : ""}>IVA ${a}%</option>`).join("")}</select>
        <select data-cc="modo"><option value="sal" ${c.modo !== "percentuali" ? "selected" : ""}>anticipo + SAL + ritenuta</option><option value="percentuali" ${c.modo === "percentuali" ? "selected" : ""}>a percentuali</option></select></div>
      ${patti}
      <div class="riga"><button class="primario" data-genera>Genera i pagamenti</button> ${verifica} <span class="errore-r" data-errore-c></span></div>
      <div class="riga"><span class="nota">«Genera» sostituisce i pagamenti di questo progetto verso ${esc(F || "il fornitore")}; gli altri restano.</span> <button class="mini" data-togli-c>togli il contratto</button></div>
    </div>`;
  }
  function collegaContratto(root, p, c) {
    const sc = p.contratti;
    root.querySelectorAll("[data-cc]").forEach((x) => { x.onchange = () => { c[x.dataset.cc] = x.value; renderLeve(); }; });
    root.querySelectorAll("[data-cc-int]").forEach((x) => { x.onchange = () => { c[x.dataset.ccInt] = parseInt(x.value, 10) || 0; renderLeve(); }; });
    root.querySelectorAll("[data-cc-eur]").forEach((x) => { x.onchange = () => { const v = euroDa(x); if (v === null) return; c[x.dataset.ccEur] = v; renderLeve(); }; });
    const pct = (x) => { const v = Number(String(x.value).replace(",", ".")); const ok = x.value.trim() !== "" && v >= 0 && v <= 100; x.classList.toggle("invalid", !ok); return ok ? v : null; };
    root.querySelectorAll("[data-cc-pct]").forEach((x) => { x.onchange = () => { const v = pct(x); if (v === null) return; c[x.dataset.ccPct] = v; renderLeve(); }; });
    root.querySelectorAll("[data-q-pct]").forEach((x) => { x.onchange = () => { const v = pct(x); if (v === null) return; c.quote[+x.dataset.qPct].pct = v; renderLeve(); }; });
    root.querySelectorAll("[data-q-mese]").forEach((x) => { x.onchange = () => { c.quote[+x.dataset.qMese].mese = x.value; renderLeve(); }; });
    root.querySelectorAll("[data-q-togli]").forEach((x) => { x.onclick = () => { c.quote.splice(+x.dataset.qTogli, 1); renderLeve(); }; });
    const qa = root.querySelector("[data-q-aggiungi]");
    if (qa) qa.onclick = () => { c.quote = c.quote || []; c.quote.push({ pct: 0, mese: (c.quote[c.quote.length - 1] || {}).mese || D.mesi[0] }); renderLeve(); };
    root.querySelector("[data-togli-c]").onclick = () => { sc.splice(sc.indexOf(c), 1); renderLeve(); };
    root.querySelector("[data-genera]").onclick = () => {
      try {
        const nuovi = FORMATO.pagamentiDaContratto(c, D.mesi);
        const F = String(c.fornitore).trim();
        const i = p.pagamenti.findIndex((g) => g.fornitore_id === F);
        const altri = p.pagamenti.filter((g) => g.fornitore_id !== F);
        altri.splice(i < 0 ? altri.length : i, 0, ...nuovi);
        p.pagamenti = altri;
        ricalcola();
      } catch (e) { root.querySelector("[data-errore-c]").textContent = e.message; }
    };
  }
  function collegaRate(root, leggi, scrivi, aliquota) {
    const err = root.querySelector("[data-errore-spalma]");
    const prova = (fn) => { try { scrivi(fn()); ricalcola(); } catch (e) { err.textContent = e.message; } };
    // Una rata sola è una tantum: la cadenza non ha senso e non si mostra; «prima rata» diventa «mese».
    const nIn = root.querySelector("input[data-spalma-n]"), passoSel = root.querySelector("select[data-spalma-passo]"), quando = root.querySelector("[data-spalma-quando]");
    const aggiornaCadenza = () => { const uno = !(parseInt(nIn.value, 10) > 1); passoSel.hidden = uno; if (quando) quando.textContent = uno ? "mese" : "prima rata"; };
    nIn.oninput = aggiornaCadenza;
    root.querySelector("button[data-spalma]").onclick = () => {
      const t = euroDa(root.querySelector("input[data-spalma-tot]"));
      if (t === null) return;
      const base = root.querySelector("select[data-spalma-base]");
      const tot = base && base.value === "lordo" ? FORMATO.nettoDaLordo(t, aliquota) : t;
      const n = parseInt(root.querySelector("input[data-spalma-n]").value, 10);
      const passo = parseInt(root.querySelector("select[data-spalma-passo]").value, 10);
      prova(() => FORMATO.spalma(tot, root.querySelector("select.sel-spalma-da").value, n, passo, D.mesi));
    };
    root.querySelectorAll("button[data-sposta]").forEach((b) => { b.onclick = () => prova(() => FORMATO.sposta(leggi(), parseInt(b.dataset.sposta, 10), D.mesi)); });
  }
  const selSoc = (val) => `<select data-campo="societa">${SOC.map((s) => `<option ${s === val ? "selected" : ""}>${s}</option>`).join("")}</select>`;
  // L'aliquota del pagamento entra tra le opzioni se non è tra le tre standard: la select non mente mai.
  const selIva = (val) => `<select data-campo="aliquota_iva">${([0, 10, 22].includes(val) ? [0, 10, 22] : [0, 10, 22, val].sort((a, b) => a - b)).map((a) => `<option value="${a}" ${a === val ? "selected" : ""}>IVA ${a}%</option>`).join("")}</select>`;

  function grigliaMesi(mesi, pref) {
    const chiavi = Object.keys(mesi).sort();
    const liberi = D.mesi.filter((m) => !(m in mesi));
    return `<div class="mesi">${chiavi.map((m) => `<label>${meseIt(m)}${IPO.has(m) ? " ·" : ""}<input type="text" class="eur" data-${pref}="${m}" value="${fmt(mesi[m], true)}"></label>`).join("")}
      ${liberi.length ? `<label>+ mese<select data-${pref}-nuovo><option value="">…</option>${liberi.map((m) => `<option value="${m}">${meseIt(m)}${IPO.has(m) ? " (senza PF)" : ""}</option>`).join("")}</select></label>` : ""}</div>`;
  }

  // Peso di una leva: di quanto cambia il minimo della sua società togliendola (o accendendola).
  function peso(variante, soc, acceso) {
    const r = calcolaSicuro(variante);
    if (!r) return "";
    const fine = (x) => x.righe.filter((q) => q.societa === soc)[D.mesi.length - 1].fin;
    const d = acceso ? ris.minimi[soc].saldo - r.minimi[soc].saldo : r.minimi[soc].saldo - ris.minimi[soc].saldo;
    const df = acceso ? fine(ris) - fine(r) : fine(r) - fine(ris);
    const pre = acceso ? "" : "se acceso: ";
    if (!d) return `<span class="peso ${df < 0 ? "neg" : ""}">${pre}non muove il minimo ${soc}${df ? `, a ${meseIt(ULTIMO)} ${segno(df, false)}` : ""}</span>`;
    return `<span class="peso ${d < 0 ? "neg" : ""}">${pre}${acceso ? "pesa " : ""}${segno(d, false)} sul minimo ${soc}</span>`;
  }

  function renderLeve() {
    sincronizzaAperte();
    const sc = stato.scenario;
    const progetti = sc.progetti.map((p, i) => {
      const k = `p:${p.id}`;
      const netto = p.pagamenti.reduce((s, g) => s + somma(g.mesi), 0);
      const lordo = p.pagamenti.reduce((s, g) => s + Object.values(g.mesi).reduce((a, b) => a + MOTORE.iva(b, g.aliquota_iva), 0), 0);
      const tuttiMesi = Object.assign({}, ...p.pagamenti.map((g) => g.mesi));
      const variante = copia(sc); variante.progetti[i].acceso = !p.acceso;
      return `<details class="leva ${p.acceso ? "" : "spento"}" data-k="${k}" data-p="${i}" ${aperte.has(k) ? "open" : ""}>
      <summary><label class="sw" onclick="event.stopPropagation()" title="${p.acceso ? "acceso: conta in cassa" : "spento: non conta"}"><input type="checkbox" data-acceso ${p.acceso ? "checked" : ""} aria-label="accendi ${esc(p.nome)}"></label>
        <span class="nome">${esc(p.nome)}</span>
        <span class="badge">${esc(p.societa)}</span><span class="badge ${badgeStato(p.stato)}">${statoIt(p.stato)}</span>
        <span class="num tot">${fmt(lordo, false)} €</span><span class="piccolo num">lordo in cassa · netto ${fmt(netto, false)} · ${periodoDi(tuttiMesi)}</span>
        ${peso(variante, p.societa, p.acceso)}</summary>
      <div class="corpo">
        <div class="riga"><input type="text" class="nome" style="flex:1 1 140px;font-weight:600" data-campo="nome" value="${esc(p.nome)}">
          ${selSoc(p.societa)} <input type="text" class="n" style="width:110px" data-campo="stato" value="${esc(p.stato)}" title="stato">
          <button data-elimina-p title="elimina progetto">× elimina</button></div>
        ${(p.contratti || []).map((c, ci) => bloccoContratto(p, c, ci)).join("")}
        ${p.pagamenti.map((g, j) => { const kg = `g:${p.id}:${j}`; return `<div class="pag" data-g="${j}">
          <div class="pag-testa"><span class="pag-nome">${esc(g.nome)}</span>${g.fornitore_id ? `<span class="badge">${esc(g.fornitore_id)}</span>` : ""}
            <span class="num pag-tot">${fmt(Object.values(g.mesi).reduce((a, b) => a + MOTORE.iva(b, g.aliquota_iva), 0), false)} €</span></div>
          <div class="frase">${esc(comeSiPaga(g.mesi, g.aliquota_iva))}</div>
          <details class="sotto" data-k="${kg}" ${aperte.has(kg) ? "open" : ""}><summary>modifica nome, IVA e rate</summary>
            <div class="riga"><input type="text" class="nome" style="flex:1 1 140px" data-campo="nome" value="${esc(g.nome)}"> ${selIva(g.aliquota_iva)}
              <input type="text" class="n" style="width:90px" data-campo="stato" value="${esc(g.stato)}" title="stato">
              <input type="text" class="n" style="width:90px" data-campo="fornitore_id" value="${esc(g.fornitore_id || "")}" placeholder="fornitore" title="fornitore_id (riconcilia i fatti)">
              <button data-elimina-g title="elimina pagamento">× elimina</button></div>
            ${bloccoRate(g.mesi, g.aliquota_iva)}
            ${grigliaMesi(g.mesi, "mese")}
          </details>
          ${p.acceso ? "" : '<div class="nota">non conta finché il progetto è spento</div>'}
        </div>`; }).join("")}
        <div class="riga"><button data-aggiungi-g>+ pagamento</button><button data-aggiungi-c>+ contratto</button></div>
      </div></details>`;
    }).join("");
    el("progetti").innerHTML = `${progetti || '<div class="nota">nessun progetto nello scenario</div>'}
      <div class="strumenti"><button id="aggiungi-p">+ progetto</button><button class="mini" data-apri="p">apri tutto</button><button class="mini" data-chiudi="p">chiudi tutto</button></div>`;

    const finanz = sc.finanziamenti.map((f, i) => {
      const k = `f:${f.id}`;
      const variante = copia(sc); variante.finanziamenti.splice(i, 1);
      return `<details class="leva" data-k="${k}" data-f="${i}" ${aperte.has(k) ? "open" : ""}>
      <summary><span class="nome">${esc(f.nome)}</span><span class="badge">${esc(f.societa)}</span><span class="badge ${badgeStato(f.stato)}">${statoIt(f.stato)}</span>
        <span class="num tot">${fmt(somma(f.erogazioni), false)} €</span><span class="piccolo num">erogato ${periodoDi(f.erogazioni)} · rate ${Object.keys(f.rate).length ? `${fmt(somma(f.rate), false)} (${periodoDi(f.rate)})` : "nessuna nell'orizzonte"}</span>
        ${peso(variante, f.societa, true)}</summary>
      <div class="corpo">
        <div class="riga"><input type="text" class="nome" style="flex:1 1 140px;font-weight:600" data-campo="nome" value="${esc(f.nome)}"> ${selSoc(f.societa)}
          <input type="text" class="n" style="width:110px" data-campo="stato" value="${esc(f.stato)}" title="stato">
          <button data-elimina-f title="elimina">× elimina</button></div>
        <div class="piccolo">erogazioni</div>${grigliaMesi(f.erogazioni, "erog")}
        <div class="piccolo"><strong>rate di rimborso</strong></div><div class="frase">${esc(comeSiPaga(f.rate, null))}</div><div class="rate-f">${bloccoRate(f.rate, null)}</div>${grigliaMesi(f.rate, "rata")}
        <div class="nota">al posto delle righe «finanziamenti» del PF di ${esc(f.societa)}</div>
      </div></details>`;
    }).join("");
    el("finanziamenti").innerHTML = `${finanz || '<div class="nota">nessun finanziamento nello scenario</div>'}
      <div class="strumenti"><button id="aggiungi-f">+ finanziamento</button><button class="mini" data-apri="f">apri tutto</button><button class="mini" data-chiudi="f">chiudi tutto</button></div>`;

    // Voci del PF corrette: «questa voce, in quel mese, secondo Rosa vale X». Una riga manuale con
    // origine «sostituzione» per (società, voce, mese); qui si raggruppano per società e voce.
    // Non sono progetti e non si aggiungono al PF: prendono il posto della voce PF di quel mese.
    const gruppi = gruppiCorrezioni(sc);
    const corr = gruppi.map((g, i) => {
      const k = `c:${g.societa}:${g.voce_id}`;
      const variante = copia(sc); variante.manuali = variante.manuali.filter((r) => !(r.origine === MOTORE.SOSTITUZIONE && r.societa === g.societa && r.voce_id === g.voce_id));
      const totale = g.righe.reduce((s, r) => s + importoDi(r), 0);
      const nelPf = g.righe.reduce((s, r) => s + pfDi(g.societa, g.voce_id, r.mese), 0);
      return `<details class="leva" data-k="${k}" data-c="${i}" ${aperte.has(k) ? "open" : ""}>
      <summary><span class="nome">${esc(etichetta(g.voce_id))}</span><span class="badge">${esc(g.societa)}</span><span class="badge warn">secondo lo scenario</span>
        <span class="num tot">${fmt(totale, false)} €</span><span class="piccolo num">al posto di ${fmt(nelPf, false)} nel PF · ${g.righe.length === 1 ? "un mese" : `${g.righe.length} mesi`} · ${periodoDi(Object.fromEntries(g.righe.map((r) => [r.mese, 1])))}</span>
        ${peso(variante, g.societa, true)}</summary>
      <div class="corpo">
        ${g.righe.map((r, j) => `<div class="riga" data-cr="${j}"><label class="piccolo">mese ${selMesi(r.mese, "sel-corr-mese")}</label>
          <label class="piccolo">vale <input type="text" class="eur" data-corr-importo value="${fmt(importoDi(r))}"></label>
          <span class="piccolo num">nel PF: ${fmt(pfDi(g.societa, g.voce_id, r.mese), false)}</span>
          <button class="mini" data-elimina-cr title="togli questo mese">×</button></div>`).join("")}
        <div class="riga"><button data-aggiungi-cr>+ mese</button><button data-elimina-c title="togli la correzione">× togli tutta la correzione</button></div>
        <div class="nota">al posto della voce del PF in questi mesi</div>
      </div></details>`;
    }).join("");
    const vociPf = [...new Set(D.pf.map((r) => `${r.societa}|${r.voce_id}|${r.direzione}`))].sort();
    el("correzioni").innerHTML = `${corr || '<div class="nota">nessuna voce corretta: il PF vale così com\'è</div>'}
      <div class="strumenti"><label class="piccolo">voce del PF <select id="corr-voce">${vociPf.map((v) => { const [s, voce, dir] = v.split("|"); return `<option value="${esc(v)}">${esc(s)} · ${esc(etichetta(voce))} (${dir === "E" ? "entrata" : "uscita"})</option>`; }).join("")}</select></label>
        <button id="aggiungi-c">+ correzione</button></div>`;
    collegaLeve();
  }

  // Le sostituzioni dello scenario raggruppate per (società, voce), nell'ordine dei mesi.
  function gruppiCorrezioni(sc) {
    const per = new Map();
    for (const r of sc.manuali || []) {
      if (r.origine !== MOTORE.SOSTITUZIONE) continue;
      const k = `${r.societa}|${r.voce_id}`;
      if (!per.has(k)) per.set(k, { societa: r.societa, voce_id: r.voce_id, direzione: r.direzione, righe: [] });
      per.get(k).righe.push(r);
    }
    for (const g of per.values()) g.righe.sort((a, b) => a.mese.localeCompare(b.mese));
    return [...per.values()].sort((a, b) => `${a.societa}${a.voce_id}`.localeCompare(`${b.societa}${b.voce_id}`));
  }
  const importoDi = (r) => (r.importo_cent !== undefined ? r.importo_cent : r.importo);
  const pfDi = (soc, voce, mese) => D.pf.filter((r) => r.societa === soc && r.voce_id === voce && r.mese === mese).reduce((s, r) => s + r.importo, 0);

  function leggiMesi(root, pref, mesi) {
    root.querySelectorAll(`input[data-${pref}]`).forEach((inp) => {
      inp.onchange = () => { const v = euroDa(inp); if (v === null) return; if (v) mesi[inp.dataset[pref]] = v; else delete mesi[inp.dataset[pref]]; ricalcola(); };
    });
    const nuovo = root.querySelector(`select[data-${pref}-nuovo]`);
    if (nuovo) nuovo.onchange = () => { if (nuovo.value) { mesi[nuovo.value] = 0; renderLeve(); } };
  }

  function collegaLeve() {
    const sc = stato.scenario;
    const tutte = (pre, aperto) => { document.querySelectorAll(`details.leva[data-k^="${pre}"]`).forEach((d) => { d.open = aperto; }); renderLeve(); };
    document.querySelectorAll("button[data-apri]").forEach((b) => { b.onclick = () => tutte(`${b.dataset.apri}:`, true); });
    document.querySelectorAll("button[data-chiudi]").forEach((b) => { b.onclick = () => tutte(`${b.dataset.chiudi}:`, false); });
    // progetti
    el("progetti").querySelectorAll("details.leva[data-p]").forEach((div) => {
      const p = sc.progetti[parseInt(div.dataset.p, 10)];
      div.querySelector("input[data-acceso]").onchange = (e) => { p.acceso = e.target.checked; ricalcola(); };
      div.querySelectorAll(".corpo > .riga [data-campo]").forEach((inp) => {
        inp.onchange = () => { p[inp.dataset.campo] = inp.value; ricalcola(); };
      });
      div.querySelector("button[data-elimina-p]").onclick = () => { sc.progetti.splice(sc.progetti.indexOf(p), 1); ricalcola(); };
      div.querySelectorAll(".contratto").forEach((box) => collegaContratto(box, p, p.contratti[+box.dataset.c]));
      div.querySelector("button[data-aggiungi-c]").onclick = () => {
        p.contratti = p.contratti || [];
        const usati = new Set(p.contratti.map((c) => String(c.fornitore).trim()));
        const F = (p.pagamenti.find((g) => g.fornitore_id && !usati.has(g.fornitore_id)) || {}).fornitore_id;
        p.contratti.push(F ? FORMATO.contrattoDaPagamenti(p.pagamenti, F, D.mesi)
          : { fornitore: "", totale: 0, aliquota_iva: 22, stato: "contratto", modo: "sal", anticipo_pct: 0, anticipo_mese: D.mesi[0], ritenuta_pct: 0,
              svincolo_mese: D.mesi[D.mesi.length - 1], sal_modo: "n", sal_n: 1, sal_ogni: 0, sal_da: D.mesi[0], sal_passo: 1, quote: [] });
        renderLeve();
      };
      div.querySelector("button[data-aggiungi-g]").onclick = () => { p.pagamenti.push({ nome: "Nuovo pagamento", mesi: {}, aliquota_iva: 22, stato: "ipotesi", fornitore_id: null }); renderLeve(); };
      div.querySelectorAll(".pag").forEach((pg) => {
        const g = p.pagamenti[parseInt(pg.dataset.g, 10)];
        pg.querySelectorAll(".sotto > .riga [data-campo]").forEach((inp) => {
          inp.onchange = () => {
            const v = inp.value;
            g[inp.dataset.campo] = inp.dataset.campo === "aliquota_iva" ? parseInt(v, 10) : inp.dataset.campo === "fornitore_id" ? (v || null) : v;
            ricalcola();
          };
        });
        pg.querySelector("button[data-elimina-g]").onclick = () => { p.pagamenti.splice(p.pagamenti.indexOf(g), 1); ricalcola(); };
        leggiMesi(pg, "mese", g.mesi);
        collegaRate(pg.querySelector(".come"), () => g.mesi, (m) => { g.mesi = m; }, g.aliquota_iva);
      });
    });
    el("aggiungi-p").onclick = () => { const id = `P${Date.now().toString(36)}`; sc.progetti.push({ id, nome: "Nuovo progetto", societa: "INTUR", acceso: true, stato: "ipotesi", pagamenti: [{ nome: "Pagamento", mesi: {}, aliquota_iva: 22, stato: "ipotesi", fornitore_id: null }] }); aperte.add(`p:${id}`); ricalcola(); };
    // finanziamenti
    el("finanziamenti").querySelectorAll("details.leva[data-f]").forEach((div) => {
      const i = parseInt(div.dataset.f, 10);
      const f = sc.finanziamenti[i];
      div.querySelectorAll(".corpo > .riga [data-campo]").forEach((inp) => { inp.onchange = () => { f[inp.dataset.campo] = inp.value; ricalcola(); }; });
      div.querySelector("button[data-elimina-f]").onclick = () => { sc.finanziamenti.splice(i, 1); ricalcola(); };
      leggiMesi(div, "erog", f.erogazioni);
      leggiMesi(div, "rata", f.rate);
      collegaRate(div.querySelector(".rate-f .come"), () => f.rate, (m) => { f.rate = m; }, 0);
    });
    el("aggiungi-f").onclick = () => { const id = `F${Date.now().toString(36)}`; sc.finanziamenti.push({ id, nome: "Nuovo finanziamento", societa: "INTUR", erogazioni: {}, rate: {}, stato: "da verificare" }); aperte.add(`f:${id}`); ricalcola(); };
    // voci del PF corrette
    const gruppi = gruppiCorrezioni(sc);
    const scrivi = (r, campo, v) => { r[campo] = v; if (campo === "importo") delete r.importo_cent; };
    el("correzioni").querySelectorAll("details.leva[data-c]").forEach((div) => {
      const g = gruppi[parseInt(div.dataset.c, 10)];
      div.querySelectorAll(".corpo > .riga[data-cr]").forEach((riga) => {
        const r = g.righe[parseInt(riga.dataset.cr, 10)];
        riga.querySelector("select.sel-corr-mese").onchange = (e) => { scrivi(r, "mese", e.target.value); ricalcola(); };
        riga.querySelector("input[data-corr-importo]").onchange = (e) => { const v = euroDa(e.target); if (v === null) return; scrivi(r, "importo", v); ricalcola(); };
        riga.querySelector("button[data-elimina-cr]").onclick = () => { sc.manuali.splice(sc.manuali.indexOf(r), 1); ricalcola(); };
      });
      div.querySelector("button[data-aggiungi-cr]").onclick = () => {
        const usati = new Set(g.righe.map((r) => r.mese));
        const mese = D.mesi.find((m) => !usati.has(m)) || D.mesi[D.mesi.length - 1];
        sc.manuali.push({ societa: g.societa, voce_id: g.voce_id, mese, importo: pfDi(g.societa, g.voce_id, mese), direzione: g.direzione, origine: MOTORE.SOSTITUZIONE });
        ricalcola();
      };
      div.querySelector("button[data-elimina-c]").onclick = () => { sc.manuali = sc.manuali.filter((r) => !g.righe.includes(r)); ricalcola(); };
    });
    el("aggiungi-c").onclick = () => {
      const [socScelta, voce, dir] = el("corr-voce").value.split("|");
      const mese = D.mesi.find((m) => pfDi(socScelta, voce, m) > 0) || D.mesi[0];
      sc.manuali = sc.manuali || [];
      sc.manuali.push({ societa: socScelta, voce_id: voce, mese, importo: pfDi(socScelta, voce, mese), direzione: dir, origine: MOTORE.SOSTITUZIONE });
      aperte.add(`c:${socScelta}:${voce}`);
      ricalcola();
    };
  }

  function renderLimiti() {
    const extra = [];
    if (ris.non_riconciliati.length) extra.push(`Nello scenario corrente ${ris.non_riconciliati.length} fatti non trovano un pagamento di progetto dello stesso fornitore nello scenario; contano comunque come uscita.`);
    for (const p of stato.scenario.progetti) for (const g of p.pagamenti) if (/verificare/i.test(g.nome) || /verificare/i.test(g.stato)) extra.push(`${p.nome}: ${g.nome} — ${p.acceso ? "conta in cassa" : "spento"}, da verificare.`);
    el("limiti").innerHTML = `<ul>${D.limiti.concat(extra).map((l) => `<li>${esc(l)}</li>`).join("")}</ul>`;
  }

  // ── calendario dei pagamenti: una riga per leva, una colonna per mese; le rate si trascinano ──
  const breve = (v) => { const e = Math.abs(v) / 100; return (v < 0 ? "−" : "") + (e >= 1e6 ? `${pctIt(Math.round(e / 1e5) / 10)}M` : e >= 1000 ? `${Math.round(e / 1000)}k` : `${Math.round(e)}`); };
  // Le righe del calendario: per ogni riga, dove stanno i mesi (in netto) e come si leggono in cassa.
  function righeCalendario() {
    const sc = stato.scenario, out = [];
    sc.progetti.forEach((p, pi) => p.pagamenti.forEach((g, gi) => out.push({
      id: `p:${pi}:${gi}`, gruppo: `${p.nome} · ${p.societa}`, nome: g.nome, spento: !p.acceso, tipo: "uscita",
      mesi: () => g.mesi, scrivi: (m) => { g.mesi = m; }, lordo: (v) => MOTORE.iva(v, g.aliquota_iva), soc: p.societa,
    })));
    sc.finanziamenti.forEach((f, fi) => {
      out.push({ id: `e:${fi}`, gruppo: `Finanziamenti · ${f.societa}`, nome: `${f.nome} · erogazioni`, tipo: "entrata",
        mesi: () => f.erogazioni, scrivi: (m) => { f.erogazioni = m; }, lordo: (v) => v, soc: f.societa });
      out.push({ id: `r:${fi}`, gruppo: `Finanziamenti · ${f.societa}`, nome: `${f.nome} · rate`, tipo: "uscita",
        mesi: () => f.rate, scrivi: (m) => { f.rate = m; }, lordo: (v) => v, soc: f.societa });
    });
    return out;
  }
  function renderCalendario() {
    const righe = righeCalendario();
    const canone = {};
    const flCan = stato.scenario.canone ? (() => { try { return MOTORE.flussiCanone(stato.scenario.canone, D.mesi); } catch (e) { return []; } })()
      : D.intercompany.filter((f) => f.nome.startsWith("Fitto Hotel") && f.stato === "pf");
    for (const f of flCan) canone[f.mese] = (canone[f.mese] || 0) + f.importo;
    const max = Math.max(1, ...righe.flatMap((r) => Object.values(r.mesi()).map((v) => r.lordo(v))));
    const intens = (v) => `${Math.round(14 + 56 * Math.sqrt(Math.min(1, v / max)))}%`;
    const testa = `<tr><th class="voce"></th>${D.mesi.map((m) => `<th class="${IPO.has(m) ? "ipo" : ""}">${meseIt(m)}</th>`).join("")}</tr>`;
    let gruppo = "";
    const corpo = righe.map((r) => {
      const g = r.gruppo !== gruppo ? `<tr class="gruppo"><td class="voce" colspan="${D.mesi.length + 1}">${esc(r.gruppo)}</td></tr>` : "";
      gruppo = r.gruppo;
      const mesi = r.mesi();
      const celle = D.mesi.map((m) => {
        const v = mesi[m];
        const chip = v ? `<button type="button" class="chip ${r.tipo === "entrata" ? "entrata" : ""}" style="--a:${intens(r.lordo(v))}" data-r="${r.id}" data-m="${m}"
          title="${esc(r.nome)} · ${meseIt(m)} · ${fmt(r.lordo(v))} € ${r.tipo === "entrata" ? "in entrata" : "in uscita"}. Trascina in un altro mese, oppure frecce ← →" aria-label="${esc(r.nome)}, ${meseIt(m)}, ${fmt(r.lordo(v), false)} euro">${breve(r.lordo(v))}</button>` : "";
        return `<td class="${IPO.has(m) ? "ipo" : ""}" data-r="${r.id}" data-m="${m}">${chip}</td>`;
      }).join("");
      return `${g}<tr class="${r.spento ? "spento" : ""}"><td class="voce" title="${esc(r.nome)}">${esc(r.nome)}</td>${celle}</tr>`;
    }).join("");
    const rigaCanone = `<tr class="gruppo"><td class="voce" colspan="${D.mesi.length + 1}">Canone Fitto Hotel · ORTI → INTUR</td></tr>
      <tr><td class="voce">${stato.scenario.canone ? "scaletta dello scenario" : "come nel PF"}<small>si cambia dal riquadro del canone</small></td>${D.mesi.map((m) => `<td class="${IPO.has(m) ? "ipo" : ""}">${canone[m] ? `<span class="chip fisso" title="${fmt(canone[m])} € lordo">${breve(canone[m])}</span>` : ""}</td>`).join("")}</tr>`;
    const piede = SOC.map((soc, k) => {
      const usc = D.mesi.map((m) => righe.filter((r) => r.soc === soc && r.tipo === "uscita" && !r.spento).reduce((t, r) => t + (r.mesi()[m] ? r.lordo(r.mesi()[m]) : 0), 0));
      const fin = D.mesi.map((m) => (ris.righe.find((x) => x.societa === soc && x.mese === m) || {}).fin);
      const mm = ris.minimi[soc].mese;
      return `<tr class="tot ${k === 0 ? "primo" : ""}"><td class="voce">${soc} · leve in uscita</td>${usc.map((v, i) => `<td class="${IPO.has(D.mesi[i]) ? "ipo" : ""}">${v ? breve(v) : ""}</td>`).join("")}</tr>
        <tr class="tot"><td class="voce">${soc} · saldo di fine mese</td>${fin.map((v, i) => { const m = D.mesi[i]; return IPO.has(m) ? `<td class="ipo" title="senza PF: non è un saldo">—</td>` : `<td class="${m === mm ? "min" : ""}" title="${fmt(v)} €${m === mm ? " · minimo" : ""}">${breve(v)}</td>`; }).join("")}</tr>`;
    }).join("");
    el("calendario").innerHTML = `<div class="cal-testa"><div><strong>Calendario dei pagamenti</strong> <span class="piccolo">lordo in cassa · trascina una rata in un altro mese, o usa le frecce</span></div></div>
      <div class="cal-wrap"><table class="cal"><thead>${testa}</thead><tbody>${corpo || `<tr><td class="voce" colspan="${D.mesi.length + 1}">nessuna leva nello scenario</td></tr>`}${rigaCanone}${piede}</tbody></table></div>`;
    collegaCalendario(righe);
  }
  let toastTimer = null;
  function avvisa(testo, annulla) {
    const t = el("toast");
    t.innerHTML = `<span>${esc(testo)}</span>${annulla ? '<button type="button">annulla</button>' : ""}`;
    t.hidden = false;
    if (annulla) t.querySelector("button").onclick = () => { annulla(); t.hidden = true; };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
  }
  function muovi(riga, da, a) {
    if (da === a) return;
    const prima = { ...riga.mesi() };
    const minPrima = Object.fromEntries(SOC.map((x) => [x, ris.minimi[x].saldo]));
    const v = riga.lordo(prima[da]);
    riga.scrivi(FORMATO.spostaRata(prima, da, a));
    ricalcola();
    const eff = SOC.map((x) => { const d = ris.minimi[x].saldo - minPrima[x]; return d ? `minimo ${x} ${segno(d, false)}` : ""; }).filter(Boolean).join(" · ") || "minimi invariati";
    avvisa(`${riga.nome}: ${fmt(v, false)} € da ${meseIt(da)} a ${meseIt(a)} · ${eff}`, () => { riga.scrivi(prima); ricalcola(); });
  }
  function collegaCalendario(righe) {
    const perId = Object.fromEntries(righe.map((r) => [r.id, r]));
    const box = el("calendario");
    box.querySelectorAll(".chip[data-r]").forEach((chip) => {
      const riga = perId[chip.dataset.r], da = chip.dataset.m;
      chip.onkeydown = (e) => {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        e.preventDefault();
        const i = D.mesi.indexOf(da) + (e.key === "ArrowLeft" ? -1 : 1);
        if (i < 0 || i >= D.mesi.length) return;
        muovi(riga, da, D.mesi[i]);
        const nuovo = el("calendario").querySelector(`.chip[data-r="${riga.id}"][data-m="${D.mesi[i]}"]`);
        if (nuovo) nuovo.focus();
      };
      chip.onpointerdown = (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        // Niente cattura e niente preventDefault qui: finché il dito non si è mosso di SOGLIA_PRESA px
        // non si sa se vuole trascinare la rata o scorrere la pagina. touch-action: pan-y lascia lo
        // scorrimento verticale al browser, che in quel caso manda pointercancel e noi puliamo.
        const x0 = e.clientX, y0 = e.clientY, id = e.pointerId;
        const r0 = chip.getBoundingClientRect();
        const presaX = x0 - r0.left, presaY = y0 - r0.top;   // dove l'ha presa: la pillola resta lì sotto il dito
        let fantasma = null, bersaglio = null, celle = [];
        const posiziona = (x, y) => { fantasma.style.transform = `translate(${x - presaX}px, ${y - presaY}px) scale(1.08)`; };
        const inizia = () => {
          try { chip.setPointerCapture(id); } catch (err) { /* senza cattura il trascinamento funziona lo stesso */ }
          fantasma = chip.cloneNode(true);
          fantasma.classList.remove("preso", "in-volo");
          fantasma.classList.add("fantasma");
          fantasma.style.width = `${r0.width}px`;
          fantasma.style.transformOrigin = `${presaX}px ${presaY}px`;
          document.body.appendChild(fantasma);
          chip.classList.add("preso");
          celle = [...box.querySelectorAll(`td[data-r="${riga.id}"]`)];
          celle.forEach((td) => td.classList.add("puo"));
        };
        const pulisci = () => {
          chip.onpointermove = chip.onpointerup = chip.onpointercancel = null;
          chip.classList.remove("preso");
          celle.forEach((td) => td.classList.remove("puo", "bersaglio"));
        };
        // Il fantasma vola da dove lo lasci alla cella dove atterra, o torna da dove è partito:
        // breve, smorzato, senza rimbalzo, così l'occhio segue la rata invece di perderla.
        const vola = (f, aRect, dopo) => {
          if (ridotto() || !f.animate) { f.remove(); if (dopo) dopo(); return; }
          const fr = f.getBoundingClientRect();
          f.style.transformOrigin = "0 0";
          const da = `translate(${fr.left}px, ${fr.top}px) scale(${fr.width / r0.width})`;
          const a = `translate(${aRect.left}px, ${aRect.top}px) scale(1)`;
          f.style.transform = da;
          const anim = f.animate([{ transform: da }, { transform: a }], { duration: 240, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" });
          anim.onfinish = anim.oncancel = () => { f.remove(); if (dopo) dopo(); };
        };
        chip.onpointermove = (ev) => {
          if (!fantasma) {
            const dx = ev.clientX - x0, dy = ev.clientY - y0;
            if (Math.hypot(dx, dy) < SOGLIA_PRESA) return;
            if (Math.abs(dy) > Math.abs(dx)) { pulisci(); return; }   // voleva scorrere, non trascinare
            inizia();
          }
          ev.preventDefault();
          posiziona(ev.clientX, ev.clientY);
          const sotto = document.elementFromPoint(ev.clientX, ev.clientY);
          const td = sotto && sotto.closest(`td[data-r="${riga.id}"]`);
          if (td !== bersaglio) { if (bersaglio) bersaglio.classList.remove("bersaglio"); bersaglio = td; if (td) td.classList.add("bersaglio"); }
        };
        chip.onpointercancel = () => { pulisci(); if (fantasma) fantasma.remove(); };
        chip.onpointerup = () => {
          const f = fantasma, dest = bersaglio;
          pulisci();
          if (!f) return;                                   // un tocco, non un trascinamento
          if (dest && dest.dataset.m !== da) {
            const a = dest.dataset.m;
            muovi(riga, da, a);                             // ridisegna: la rata nuova è già nella cella di arrivo
            const nuovo = el("calendario").querySelector(`.chip[data-r="${riga.id}"][data-m="${a}"]`);
            if (!nuovo) { f.remove(); return; }
            nuovo.scrollIntoView({ block: "nearest", inline: "nearest" });
            nuovo.classList.add("in-volo");
            vola(f, nuovo.getBoundingClientRect(), () => nuovo.classList.remove("in-volo"));
          } else {
            vola(f, chip.getBoundingClientRect());          // niente bersaglio: torna da dove è partita
          }
        };
      };
    });
  }

  function render(opts = {}) {
    sincronizzaAperte();
    renderMinimi();
    renderGrafici();
    renderTabelle();
    renderConsolidato();
    renderLeve();
    renderCalendario();
    renderLimiti();
    if (opts.canoneLeggero) aggiornaCanoneInfo(); else renderCanone();
    riassunti();
  }

  // Blocchi apribili: chiusi danno il quadro (titolo + una riga), aperti il dettaglio.
  // Quali sono aperti è una comodità di chi guarda: resta nel suo browser, se il browser lo permette.
  const CHIAVE_BLOCCHI = "cdg-cassa-blocchi";
  function blocchi() { return [...document.querySelectorAll("details.blocco")]; }
  function salvaBlocchi() {
    try { localStorage.setItem(CHIAVE_BLOCCHI, JSON.stringify(blocchi().filter((d) => d.open).map((d) => d.dataset.blocco))); } catch (e) { /* senza memoria va bene lo stesso */ }
  }
  function collegaBlocchi() {
    let aperti = [];
    try { aperti = JSON.parse(localStorage.getItem(CHIAVE_BLOCCHI) || "[]"); } catch (e) { aperti = []; }
    blocchi().forEach((d) => { d.open = aperti.includes(d.dataset.blocco); d.addEventListener("toggle", salvaBlocchi); });
    el("apri-tutto").onclick = () => { blocchi().forEach((d) => { if (!d.hidden) d.open = true; }); };
    el("chiudi-tutto").onclick = () => { blocchi().forEach((d) => { d.open = false; }); };
  }
  function riassunti() {
    const sc = stato.scenario;
    const som = (k, t) => { el(`som-${k}`).textContent = t; };
    som("canone", `${fmt(lordoSlider(), false)} € lordo l'anno · ${sc.canone ? "scaletta dello scenario" : "come nel PF"}`);
    const righe = righeCalendario();
    som("calendario", `${righe.length} righe da trascinare, ${meseIt(D.mesi[0])} – ${meseIt(D.mesi[D.mesi.length - 1])}`);
    som("saldo", `${SOC.join(" e ")}, scenario contro solo PF`);
    const accesi = sc.progetti.filter((p) => p.acceso).length;
    const nCorr = gruppiCorrezioni(sc).length;
    som("leve", `«${stato.nome}» · ${accesi} progetti accesi su ${sc.progetti.length} · ${sc.finanziamenti.length} finanziamenti${nCorr ? ` · ${nCorr === 1 ? "una voce del PF corretta" : `${nCorr} voci del PF corrette`}` : ""}`);
    som("tabelle", `${SOC.join(" e ")}: entrate, uscite e leve per mese`);
    som("consolidato", "le due società insieme, intercompany tolto");
    const fb = document.querySelector('details.blocco[data-blocco="fatti"]');
    fb.hidden = !D.fatti.length;
    som("fatti", `${D.fatti.length} pagamenti già fatti`);
    som("limiti", `${el("limiti").querySelectorAll("li").length} cose che la pagina non sa`);
  }

  renderTesta();
  renderFonti();
  renderScenario();
  collegaBlocchi();
  ricalcola();
  // La barra dei minimi compare solo quando la card è uscita dallo schermo verso l'alto.
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(([e]) => {
      el("barra-minimi").hidden = e.isIntersecting || e.boundingClientRect.top > 0;
    }, { threshold: 0 }).observe(el("minimi"));
  }
})();
</script>
