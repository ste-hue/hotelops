<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cassa · CdG</title>
<style>
:root{
  --bg:#faf9f6; --card:#ffffff; --ink:#1d1c1a; --muted:#6d6a64; --line:#e5e2db; --soft:#f1efe9;
  --accent:#1d5c87; --ok:#3f6b58; --warn:#a86400; --bad:#b3261e; --warn-bg:#fbf1dd; --bad-bg:#fbe6e3; --ok-bg:#e4efe9;
  --ipo:#ebe9e3; --base-line:#8d8a83;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151513; --card:#1d1d1a; --ink:#ecebe6; --muted:#9c988f; --line:#32312d; --soft:#252521;
  --accent:#7db7e0; --ok:#86b8a0; --warn:#e2a64a; --bad:#f08a80; --warn-bg:#3a2e17; --bad-bg:#3d201d; --ok-bg:#1f3a2e;
  --ipo:#23231f; --base-line:#7a776f;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow-x:hidden}
main{max-width:1180px;margin:0 auto;padding:22px 16px 56px}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0}
h2{font-size:16px;font-weight:620;margin:22px 0 8px}
h3{font-size:14px;font-weight:620;margin:12px 0 6px}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)}
.griglia{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:22px;align-items:start}
@media (max-width:900px){.griglia{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;overflow-x:auto}
.invalid{border-color:var(--bad);background:var(--bad-bg)}
.errore{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:13px}
.minimi{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:560px){.minimi{grid-template-columns:1fr}}
.minimi .saldo{font-size:26px;font-weight:650;margin:2px 0}
.minimi .delta{font-size:13px;color:var(--muted)}
.minimi ul{margin:6px 0 0;padding-left:16px;font-size:13px}
.badge{display:inline-block;white-space:nowrap;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--muted);margin-left:4px;vertical-align:middle}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.conti{margin:8px 0 0;font-size:12px;color:var(--muted)}
.conti div{margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
tr.ipo td{background:var(--ipo)}
tr.mese{cursor:pointer}
tr.mese:hover td{background:var(--soft)}
tr.dett td{background:var(--soft);text-align:left;font-size:12px;padding:6px 8px 8px}
tr.dett ul{margin:0;padding-left:16px;columns:2;column-gap:18px}
@media (max-width:560px){th.ini,td.ini{display:none} table{font-size:12px} tr.dett ul{columns:1}}
svg.graf{width:100%;height:auto;display:block;margin-top:8px}
.leg{font-size:12px;color:var(--muted);margin-top:4px}
.leg span{display:inline-block;margin-right:12px}
.leg i{display:inline-block;width:18px;border-top:2px solid var(--accent);vertical-align:middle;margin-right:4px}
.leg i.base{border-top:2px dashed var(--base-line)}
.leg i.ipo{width:12px;height:10px;border:0;background:var(--ipo);border-radius:2px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
button{cursor:pointer;background:var(--soft)}
button.primario{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input.eur{width:110px;text-align:right}
input.n{width:56px;text-align:right}
input.nome{width:100%}
.leva{border-top:1px solid var(--line);padding:10px 0}
.leva:first-of-type{border-top:0}
.leva.spento{color:var(--muted)}
.leva.spento .pag{opacity:.75}
.leva header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.leva header .nome{flex:1 1 160px;font-weight:600}
.leva .riga{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px;font-size:13px}
.pag{margin:8px 0 0 0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
.pag .mesi{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pag .mesi label{font-size:11px;color:var(--muted);display:flex;flex-direction:column}
.pag .mesi input{width:92px;text-align:right;font-size:12px;padding:3px 5px}
.nota{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px}
.limiti{margin-top:18px;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--ink)}
.limiti h2{margin:0 0 6px;color:var(--warn)}
.limiti ul{margin:0;padding-left:18px;font-size:13px}
.piccolo{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.canone{margin-top:14px;border-color:var(--accent)}
.canone .testa{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between}
.canone .grande{font-size:22px;font-weight:650}
.canone .slider{display:flex;gap:10px;align-items:center;margin-top:8px}
.canone .slider input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);padding:0;border:0;background:transparent}
.canone .slider input[type=range]:disabled{opacity:.4}
.canone details{margin-top:8px}
.canone details .riga{margin-top:8px}
button.mini{font-size:12px;padding:2px 7px}
.strumenti{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:13px}
details.leva{border-top:1px solid var(--line);padding:6px 0}
details.leva:first-of-type{border-top:0}
details.leva summary{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;list-style:none;color:var(--ink);font-size:13px;padding:4px 0 4px 18px;position:relative}
details.leva summary::-webkit-details-marker{display:none}
details.leva summary::before{content:"";position:absolute;left:4px;top:11px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;width:6px;height:6px;transform:rotate(-45deg);transition:transform .15s}
details.leva[open] summary::before{transform:rotate(45deg);top:9px}
details.leva summary .nome{font-weight:600;flex:1 1 140px}
details.leva summary .tot{font-weight:600}
details.leva summary .peso{color:var(--muted)}
details.leva summary .peso.neg{color:var(--bad)}
details.leva summary .sw{display:inline-flex;align-items:center}
details.leva.spento summary .nome,details.leva.spento summary .tot{color:var(--muted);font-weight:500}
details.leva .corpo{padding:4px 0 6px 18px}
.minimi .oltre{font-size:12px;color:var(--muted);margin-top:4px}
.fonti{margin-top:16px;font-size:13px;color:var(--muted)}
.fonti summary{font-weight:600;color:var(--ink)}
.fonti ul{margin:6px 0 0;padding-left:18px}
.fonti li{margin-top:3px}
td.vuoto{color:var(--muted)}
.leg i.eff{width:12px;height:10px;border:0;background:var(--accent);opacity:.35;border-radius:2px}
</style>
</head>
<body>
<main>
<header>
  <h1>Cassa · ORTI e INTUR</h1>
  <p class="sub" id="sub"></p>
</header>
<div id="errore" class="errore" hidden></div>

<section class="minimi" id="minimi"></section>

<section class="card canone" id="canone"></section>

<div class="griglia">
  <div>
    <div id="grafici"></div>
  </div>
  <aside>
    <div class="card" id="scenario"></div>
    <h2>Progetti</h2>
    <div class="card" id="progetti"></div>
    <h2>Finanziamenti</h2>
    <div class="card" id="finanziamenti"></div>
  </aside>
</div>

<div id="tabelle"></div>

<div class="card" id="consolidato"></div>
<div id="fatti"></div>

<section class="limiti" id="limiti"></section>
<details class="fonti" id="fonti"></details>
</main>

<script type="application/json" id="dati">__DATA__</script>

<script id="motore">
// Porting di verticals/condges/cassa_motore.py: stessa sequenza di `calcola`,
// interi (centesimi) ovunque. Nessun formato, nessun round.
const MOTORE = (() => {
  const ORIGINI = ["pf", "canone", "finanziamento", "progetto", "manuale", "fatto"];
  const SOCIETA = ["ORTI", "INTUR"];

  function iva(netto, aliquota) {
    return Math.floor((netto * (100 + aliquota) + 50) / 100);
  }

  function distribuisci(totale, da, n, mesi) {
    if (n < 1) throw new Error(`numero rate non valido: ${n}`);
    const i = mesi.indexOf(da);
    if (i < 0 || i + n > mesi.length) throw new Error(`oltre l'orizzonte: ${n} rate da ${da}`);
    // Math.floor = `//` di Python (coincide con trunc per importi positivi).
    const quota = Math.floor(totale / n);
    const out = {};
    for (let k = 0; k < n - 1; k++) out[mesi[i + k]] = quota;
    out[mesi[i + n - 1]] = totale - quota * (n - 1);
    return out;
  }

  function flussiCanone(s, mesi) {
    const out = [];
    const anni = Object.keys(s.netto_per_anno).map(Number).sort((a, b) => a - b);
    for (const anno of anni) {
      const netto = s.netto_per_anno[anno];
      const cal = Object.entries(s.calendario || {})
        .filter(([m]) => m.slice(0, 4) === String(anno))
        .sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
      let lordi;
      if (cal.length) {
        lordi = cal.map(([m, v]) => [m, iva(v, s.aliquota_iva)]);
      } else {
        const da = `${anno}-${s.da_mese.slice(5)}`;
        if (!mesi.includes(da)) continue;
        lordi = Object.entries(distribuisci(iva(netto, s.aliquota_iva), da, s.rate_n, mesi));
      }
      for (const [m, v] of lordi) {
        if (mesi.includes(m)) out.push({ nome: "Fitto Hotel (canone)", da: "ORTI", a: "INTUR", mese: m, importo: v, stato: "scenario" });
      }
    }
    return out;
  }

  function riconcilia(progetti, fatti) {
    progetti = JSON.parse(JSON.stringify(progetti));
    const perId = {};
    for (const p of progetti) perId[p.id] = p;
    const nonRic = [];
    for (const f of fatti) {
      const p = perId[f.progetto_id];
      const slot = [];
      for (const pag of (p ? p.pagamenti : [])) {
        if (f.fornitore_id != null && pag.fornitore_id === f.fornitore_id) {
          for (const m of Object.keys(pag.mesi)) slot.push({ m, pag });
        }
      }
      slot.sort((a, b) => (a.m < b.m ? -1 : a.m > b.m ? 1 : 0));
      if (!slot.length) { nonRic.push(f); continue; }
      let resto = f.importo;
      for (const { m, pag } of slot) {
        if (resto <= 0) break;
        const lordo = iva(pag.mesi[m], pag.aliquota_iva);
        const presa = Math.min(resto, lordo);
        resto -= presa;
        const k = 100 + pag.aliquota_iva;
        pag.mesi[m] = presa === lordo ? 0 : Math.floor(((lordo - presa) * 100 + Math.floor(k / 2)) / k);
      }
    }
    return [progetti, nonRic];
  }

  function zero() {
    const o = {};
    for (const k of ORIGINI) o[k] = 0;
    return o;
  }

  function somma(o) {
    let s = 0;
    for (const k of ORIGINI) s += o[k];
    return s;
  }

  function movimenti(inp, societa, mese) {
    const ent = zero(), usc = zero();
    const sc = inp.scenario;
    const add = (r) => {
      if (r.societa === societa && r.mese === mese) (r.direzione === "E" ? ent : usc)[r.origine] += r.importo;
    };
    for (const r of inp.pf) add(r);
    for (const r of sc.manuali) add(r);
    for (const f of inp.intercompany) {
      if (f.mese !== mese) continue;
      if (f.stato === "una_gamba") {
        if (SOCIETA.includes(f.da)) {
          if (f.da === societa) usc.canone += f.importo;
        } else if (f.a === societa) ent.canone += f.importo;
        continue;
      }
      if (f.a === societa) ent.canone += f.importo;
      if (f.da === societa) usc.canone += f.importo;
    }
    for (const fin of sc.finanziamenti) {
      if (fin.societa === societa) {
        ent.finanziamento += fin.erogazioni[mese] || 0;
        usc.finanziamento += fin.rate[mese] || 0;
      }
    }
    for (const p of sc.progetti) {
      if (p.acceso && p.societa === societa) {
        for (const pag of p.pagamenti) usc.progetto += iva(pag.mesi[mese] || 0, pag.aliquota_iva);
      }
    }
    for (const f of inp.fatti) {
      if (f.societa === societa && f.mese === mese) usc.fatto += f.importo;
    }
    return [ent, usc];
  }

  // Scenario = la parte `scenario` del documento cdg-cassa-scenario/1 (manuali con importo_cent).
  function normalizza(scenario) {
    const sc = JSON.parse(JSON.stringify(scenario));
    sc.progetti = sc.progetti || [];
    sc.finanziamenti = sc.finanziamenti || [];
    sc.canone = sc.canone || null;
    sc.soglia = sc.soglia || 0;
    sc.manuali = (sc.manuali || []).map((r) => ({
      societa: r.societa, voce_id: r.voce_id, mese: r.mese,
      importo: r.importo_cent !== undefined ? r.importo_cent : r.importo,
      direzione: r.direzione, origine: r.origine,
    }));
    return sc;
  }

  function calcola(payload, scenario) {
    const sc = normalizza(scenario);
    const conFin = new Set(sc.finanziamenti.map((f) => f.societa));
    const pf = payload.pf.filter((r) => !(r.voce_id === "ENTRATE_FINANZIAMENTI" && conFin.has(r.societa)));
    let interc = payload.intercompany;
    if (sc.canone) {
      const nuovi = flussiCanone(sc.canone, payload.mesi);
      const anni = new Set(nuovi.map((f) => f.mese.slice(0, 4)));
      interc = interc.filter((f) => !(f.nome.startsWith("Fitto Hotel") && anni.has(f.mese.slice(0, 4)))).concat(nuovi);
    }
    const [progetti, nonRic] = riconcilia(sc.progetti, payload.fatti);
    const ipo = new Set(payload.mesi_ipotetici);
    const inp = { mesi: payload.mesi, ancore: payload.ancore, pf, intercompany: interc, fatti: payload.fatti, scenario: { ...sc, progetti } };

    const righe = [];
    for (const soc of SOCIETA) {
      let saldo = inp.ancore[soc].saldo;
      for (const mese of inp.mesi) {
        const [ent, usc] = movimenti(inp, soc, mese);
        const fin = saldo + somma(ent) - somma(usc);
        righe.push({ mese, societa: soc, ini: saldo, entrate: ent, uscite: usc, fin });
        saldo = fin;
      }
    }

    const primoMin = (rs) => rs.reduce((m, r) => (r.fin < m.fin ? r : m));
    const minimi = {};
    for (const soc of SOCIETA) {
      const mie = righe.filter((r) => r.societa === soc);
      const pfR = mie.filter((r) => !ipo.has(r.mese));
      const coda = mie.filter((r) => ipo.has(r.mese));
      const m = primoMin(pfR.length ? pfR : coda);
      const c = coda.length ? primoMin(coda) : null;
      minimi[soc] = {
        mese: m.mese, saldo: m.fin,
        sotto_soglia: pfR.filter((r) => r.fin < sc.soglia).map((r) => r.mese),
        coda_mese: c ? c.mese : null, coda_saldo: c ? c.fin : null,
      };
    }

    const consolidato = [];
    for (const mese of inp.mesi) {
      const fl = inp.intercompany.filter((f) => f.mese === mese && SOCIETA.includes(f.da) && SOCIETA.includes(f.a));
      const flTutti = inp.intercompany.filter((f) => f.mese === mese);
      consolidato.push({
        mese,
        saldo: righe.filter((r) => r.mese === mese).reduce((s, r) => s + r.fin, 0),
        intercompany_nettato: fl.filter((f) => f.stato !== "una_gamba").reduce((s, f) => s + f.importo, 0),
        residuo: flTutti.filter((f) => f.stato === "una_gamba").reduce((s, f) => s + f.importo, 0),
      });
    }
    return { righe, minimi, consolidato, non_riconciliati: nonRic };
  }

  return { ORIGINI, SOCIETA, calcola, distribuisci, iva, flussiCanone, riconcilia, normalizza };
})();
if (typeof module !== "undefined") module.exports = MOTORE;
</script>

<script id="formato">
// Formato e lettura degli importi: l'euro esiste solo qui, dentro e fuori centesimi interi.
const FORMATO = (() => {
  function fmt(cent, conCent = true) {
    const neg = cent < 0;
    const a = Math.abs(cent);
    const e = Math.floor(a / 100), c = a % 100;
    const s = String(e).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "−" : "") + s + (conCent ? "," + String(c).padStart(2, "0") : "");
  }
  // "1.234,56" / "1234.56" / "1.234" -> centesimi; "" -> 0; testo non valido -> null.
  function parseEuro(txt) {
    let s = String(txt || "").replace(/[\s€]/g, "");
    if (!s) return 0;
    const neg = /^[-−]/.test(s);
    s = s.replace(/^[-−]/, "");
    const lc = s.lastIndexOf(","), lp = s.lastIndexOf(".");
    const sep = Math.max(lc, lp);
    let intero = s, dec = "";
    if (sep >= 0) {
      const coda = s.slice(sep + 1);
      // Con entrambi i separatori l'ultimo è il decimale; con uno solo, 3 cifre dopo = migliaia.
      if ((lc >= 0 && lp >= 0) || coda.length <= 2) { dec = coda; intero = s.slice(0, sep); }
    }
    intero = intero.replace(/[.,]/g, "");
    if (!/^\d+$/.test(intero) || !/^\d{0,2}$/.test(dec)) return null;
    const cent = parseInt(intero, 10) * 100 + parseInt((dec + "00").slice(0, 2), 10);
    return neg ? -cent : cent;
  }
  function calendarioTesto(cal) {
    return Object.entries(cal || {})
      .sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0))
      .map(([m, v]) => `${m}=${fmt(v)}`).join("; ");
  }
  // "2027-03=200.000,00; 2027-06=300.000,00" -> {mese: cent}; {} se vuoto; null se una parte non è valida.
  function calendarioParse(txt) {
    const cal = {};
    for (const parte of String(txt || "").split(";")) {
      if (!parte.trim()) continue;
      const [m, v] = parte.split("=").map((s) => (s || "").trim());
      const cent = parseEuro(v);
      if (!/^\d{4}-\d{2}$/.test(m) || cent === null) return null;
      cal[m] = cent;
    }
    return cal;
  }
  // Lordo IVA inclusa -> netto, in centesimi interi (inverso di iva(): netto*(100+al)/100 arrotondato).
  function nettoDaLordo(lordo, aliquota) {
    const k = 100 + aliquota;
    return Math.floor((lordo * 100 + Math.floor(k / 2)) / k);
  }
  return { fmt, parseEuro, calendarioTesto, calendarioParse, nettoDaLordo };
})();
if (typeof module !== "undefined") module.exports = FORMATO;
</script>

<script id="app">
(() => {
  const D = JSON.parse(document.getElementById("dati").textContent);
  const SOC = MOTORE.SOCIETA;
  const IPO = new Set(D.mesi_ipotetici);
  const MESI_PF = D.mesi.filter((m) => !IPO.has(m));
  const ULTIMO_PF = MESI_PF[MESI_PF.length - 1];
  const ULTIMO = D.mesi[D.mesi.length - 1];
  const MESI_IT = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
  const { fmt, parseEuro, calendarioTesto, calendarioParse, nettoDaLordo } = FORMATO;
  // Legge un campo euro: null = non valido (campo marcato, stato invariato).
  const euroDa = (inp) => { const v = parseEuro(inp.value); inp.classList.toggle("invalid", v === null); return v; };
  // Nome del PF senza il prefisso del file temporaneo del promote (solo a video: `base` resta com'è).
  const nomeFile = (s) => String(s).replace(/^hotelops_raw_.*?(?=[A-Z]{2,}_)/, "");
  const meseIt = (m) => `${MESI_IT[parseInt(m.slice(5), 10) - 1]} ${m.slice(2, 4)}`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const copia = (o) => JSON.parse(JSON.stringify(o));
  const el = (id) => document.getElementById(id);
  const etichetta = (v) => v.replace(/^(ENTRATE|USCITE)_/, "").toLowerCase().replace(/_/g, " ");
  const oraDi = (iso) => (iso ? String(iso).replace("T", " ").slice(0, 16) : "");
  const segno = (v, conCent = true) => (v > 0 ? "+" : "") + fmt(v, conCent);
  const somma = (o) => Object.values(o).reduce((a, b) => a + b, 0);
  const periodoDi = (mesi) => { const k = Object.keys(mesi).sort(); return k.length ? (k.length === 1 ? meseIt(k[0]) : `${meseIt(k[0])} – ${meseIt(k[k.length - 1])}`) : "nessun mese"; };
  const badgeStato = (s) => (/contratto|tua/.test(s) ? "ok" : /verificare|decidere/.test(s) ? "warn" : /fuori/.test(s) ? "bad" : "");
  const statoIt = (s) => esc(String(s).replace(/_/g, " "));
  const dataIt = (iso) => (/^\d{4}-\d{2}-\d{2}/.test(String(iso)) ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : esc(iso));

  // ── stato ──
  let stato = { nome: D.seme.nome, scenario: copia(D.seme.scenario) };
  let ris = null;
  const aperti = new Set();   // righe della tabella aperte (società|mese)
  const aperte = new Set();   // tendine aperte: "canone", "p:<id>", "f:<id>"

  function mostraErrore(msg) {
    const e = el("errore");
    e.textContent = msg;
    e.hidden = !msg;
  }

  function calcolaSicuro(scenario) {
    try { return MOTORE.calcola(D, scenario); } catch (e) { return null; }
  }

  function ricalcola(opts = {}) {
    try {
      ris = MOTORE.calcola(D, stato.scenario);
    } catch (e) {
      mostraErrore(`Scenario non calcolabile: ${e.message}`);
      return;
    }
    mostraErrore("");
    render(opts);
  }

  const vuoto = () => ({ nome: "Nessuna leva", scenario: { nome: "Nessuna leva", soglia: 0, canone: null, progetti: [], finanziamenti: [], manuali: [] } });

  // Lo stato aperto/chiuso delle tendine si legge dal DOM prima di ridisegnare:
  // l'evento toggle arriva in ritardo e un re-render in mezzo le richiuderebbe.
  function sincronizzaAperte() {
    document.querySelectorAll("details.leva[data-k], #canone-dett").forEach((d) => {
      const k = d.id === "canone-dett" ? "canone" : d.dataset.k;
      d.open ? aperte.add(k) : aperte.delete(k);
    });
  }

  // Effetto delle leve fuori dal PF: delta a fine orizzonte meno delta all'ultimo mese PF.
  function effettoOltrePF(soc, r = ris) {
    const rs = r.righe.filter((x) => x.societa === soc), bs = D.baseline.righe.filter((x) => x.societa === soc);
    const i = D.mesi.indexOf(ULTIMO_PF), n = D.mesi.length - 1;
    return (rs[n].fin - bs[n].fin) - (rs[i].fin - bs[i].fin);
  }

  // ── testa, fonti e scenari ──
  function renderTesta() {
    const basi = SOC.map((s) => `${s}: ${D.base[s] ? nomeFile(D.base[s].file_sorgente) : "—"}`).join(" · ");
    const anc = Object.values(D.ancore)[0];
    el("sub").textContent = `Ancora al ${anc ? dataIt(anc.data) : "—"} · PF ${basi} · fonti del ${oraDi(D.acquisito_il) || "—"} · pagina del ${oraDi(D.generato_il)}`;
  }

  function renderScenario() {
    const sel = document.createElement("select");
    const tutti = [{ ...D.seme, _k: "seme", _e: `${D.seme.nome} · seme` }, { ...vuoto(), compatibile: true, _k: "vuoto", _e: "Solo PF, nessuna leva" },
      ...D.scenari.map((s, i) => ({ ...s, _k: String(i), _e: `${s.nome} · salvato ${oraDi(s.salvato_il)}` }))];
    el("scenario").innerHTML = `<div class="strumenti" style="margin-top:0"><label class="piccolo">Scenario <select id="sel-scenari"></select></label>
      <input type="text" id="nome-scenario" class="nome" style="width:180px" placeholder="nome scenario">
      <label class="piccolo">Soglia € <input type="text" class="eur" id="soglia"></label>
      <button id="esporta" class="primario">Esporta scenario</button>
      <button id="nessuna">Spegni tutte le leve</button></div>`;
    const s0 = el("sel-scenari");
    for (const s of tutti) {
      const o = document.createElement("option");
      o.value = s._k;
      o.textContent = s._e + (s.compatibile ? "" : " · base diversa");
      s0.appendChild(o);
    }
    s0.onchange = () => {
      const s = s0.value === "seme" ? D.seme : s0.value === "vuoto" ? vuoto() : D.scenari[parseInt(s0.value, 10)];
      stato = { nome: s.nome, scenario: copia(s.scenario) };
      aperti.clear();
      el("nome-scenario").value = stato.nome;
      el("soglia").value = fmt(stato.scenario.soglia || 0, false);
      ricalcola();
    };
    el("nome-scenario").value = stato.nome;
    el("nome-scenario").oninput = (e) => { stato.nome = e.target.value; stato.scenario.nome = e.target.value; };
    el("soglia").value = fmt(stato.scenario.soglia || 0, false);
    el("soglia").onchange = (e) => { const v = euroDa(e.target); if (v === null) return; stato.scenario.soglia = v; ricalcola(); };
    el("esporta").onclick = esporta;
    el("nessuna").onclick = () => { s0.value = "vuoto"; s0.onchange(); };
  }

  function esporta() {
    const doc = { schema: D.schema, nome: stato.nome, salvato_il: new Date().toISOString(), base: D.base, scenario: { ...stato.scenario, nome: stato.nome } };
    const blob = new Blob([JSON.stringify(doc, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `cassa-scenario-${(stato.nome || "scenario").replace(/[^\w.-]+/g, "_")}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function renderFonti() {
    const basi = SOC.map((s) => D.base[s] ? `<li>PF ${s}: <code>${esc(nomeFile(D.base[s].file_sorgente))}</code>, caricato il ${esc(String(D.base[s].data_caricamento).slice(0, 16))}</li>` : `<li>PF ${s}: assente</li>`).join("");
    const ancore = SOC.map((s) => {
      const a = D.ancore[s];
      if (!a) return "";
      const conti = Object.entries(a.conti).map(([banca, c]) => `<li>${esc(banca)} <span class="num">${fmt(c.saldo)}</span> <span class="badge ${c.attestato ? "ok" : "warn"}">${c.attestato ? "attestato" : "dichiarato"}</span> ${esc(c.motivo)}</li>`).join("");
      return `<li>Ancora ${s} al ${dataIt(a.data)}: <span class="num">${fmt(a.saldo)}</span> <span class="badge ${a.attestato ? "ok" : "warn"}">${a.attestato ? "attestata" : "dichiarata"}</span><ul>${conti}</ul></li>`;
    }).join("");
    const nascosti = D.scenari_sostituiti.length ? ` Nascosti perché hanno lo stesso nome del seme: ${D.scenari_sostituiti.map((s) => `${esc(s.nome)} (${oraDi(s.salvato_il)})`).join(", ")}.` : "";
    el("fonti").innerHTML = `<summary>Fonti e versioni</summary><ul>${basi}${ancore}
      <li>Fonti lette da BigQuery il ${oraDi(D.acquisito_il) || "—"} · pagina generata il ${oraDi(D.generato_il)}</li>
      <li>Seme «${esc(D.seme.nome)}» dal file locale, salvato il ${oraDi(D.seme.salvato_il)}${D.seme.compatibile ? "" : " (base PF diversa)"}</li>
      <li>Scenari salvati su BigQuery nel menu: ${D.scenari.length}.${nascosti}</li>
      ${CONTR ? `<li>Contratto del canone: ${esc(CONTR.fonte)}</li>` : ""}
      <li>Canone di riferimento: ${CR.dichiarato ? `${fmt(CR.lordo_annuo, false)} € lordo/anno IVA inclusa (${fmt(CR.netto_annuo, false)} netto) dichiarato il ${esc(CR.dichiarato_il || "—")} — ${esc(CR.fonte)}` : esc(CR.fonte)}</li>
      <li>Mesi senza PF: ${D.mesi_ipotetici.length ? `${meseIt(D.mesi_ipotetici[0])} – ${meseIt(ULTIMO)}` : "nessuno"} (il PF finisce a ${meseIt(ULTIMO_PF)})</li></ul>`;
  }

  // ── canone: lo slider parte dal PF ──
  // Canone di riferimento: l'annuo è DICHIARATO (file canone_dichiarato.json), le rate nell'orizzonte
  // sono quelle del PF. Lo slider muove l'annuo e scala le rate PF nell'orizzonte in proporzione.
  // Slider e campo sono in LORDO IVA inclusa (è cassa); il motore resta in netto + aliquota.
  const CR = D.canone_rif || { dichiarato: false, netto_annuo: 0, lordo_annuo: 0, aliquota_iva: 22, rate_pf: {}, fonte: "", rate_orizzonte: [], netto_pf_orizzonte: 0 };
  const RATE_ORIZ = CR.rate_orizzonte.filter((r) => D.mesi.includes(r.mese));
  const CONTR = CR.contratto || null;   // {rate_mese: {"06": netto, ...}, fonte}
  // Rate del contratto nei mesi dell'orizzonte (anche oltre il PF: lì contano come effetto leve), in netto.
  const rateContratto = (nettoAnnuo) => {
    const cal = {};
    if (!CONTR || !CR.netto_annuo) return cal;
    for (const m of D.mesi) {
      const q = CONTR.rate_mese[m.slice(5, 7)];
      if (q !== undefined) cal[m] = Math.round((q * nettoAnnuo) / CR.netto_annuo);
    }
    return cal;
  };
  const ANNO = RATE_ORIZ.length ? Number(RATE_ORIZ[0].mese.slice(0, 4)) : Number(ULTIMO_PF.slice(0, 4));
  const MAX_SLIDER = Math.max(30000000, Math.ceil((CR.netto_annuo * 2) / 10000000) * 10000000);

  // Netto delle rate PF nell'orizzonte per l'anno di riferimento (base della proporzione).
  const nettoPfAnno = () => RATE_ORIZ.filter((r) => r.mese.slice(0, 4) === String(ANNO)).reduce((s, r) => s + r.netto, 0);
  // Netto nell'orizzonte dello scenario corrente per l'anno di riferimento.
  function nettoScenarioAnno() {
    const c = stato.scenario.canone;
    if (!c) return nettoPfAnno();
    const cal = Object.entries(c.calendario || {}).filter(([m]) => m.slice(0, 4) === String(ANNO) && D.mesi.includes(m));
    if (cal.length) return cal.reduce((s, [, v]) => s + v, 0);
    try {
      const k = 100 + c.aliquota_iva;
      return MOTORE.flussiCanone(c, D.mesi).filter((f) => f.mese.slice(0, 4) === String(ANNO)).reduce((s, f) => s + Math.floor((f.importo * 100 + Math.floor(k / 2)) / k), 0);
    } catch (e) { return 0; }
  }
  // Annuo implicito: netto scenario nell'orizzonte / netto PF nell'orizzonte × annuo dichiarato.
  function nettoSlider() {
    const c = stato.scenario.canone;
    if (!c) return CR.netto_annuo;
    const base = CONTR
      ? Object.entries(rateContratto(CR.netto_annuo)).filter(([m]) => m.slice(0, 4) === String(ANNO)).reduce((s, [, v]) => s + v, 0)
      : nettoPfAnno();
    if (!base || !CR.netto_annuo) return nettoScenarioAnno();
    return Math.round((nettoScenarioAnno() * CR.netto_annuo) / base);
  }
  // Imposta l'annuo: le rate PF dell'anno nell'orizzonte vengono scalate in proporzione (calendario).
  function impostaCanone(nettoAnnuo) {
    const sc = stato.scenario;
    if (CONTR) {
      const cal = rateContratto(nettoAnnuo);
      const perAnno = {};
      for (const [m, v] of Object.entries(cal)) perAnno[m.slice(0, 4)] = (perAnno[m.slice(0, 4)] || 0) + v;
      const primo = Object.keys(cal).sort()[0] || MESI_PF[0];
      if (!sc.canone) {
        sc.canone = { netto_per_anno: perAnno, rate_n: Object.keys(CONTR.rate_mese).length, da_mese: primo, calendario: cal, aliquota_iva: CR.aliquota_iva };
      } else {
        sc.canone.netto_per_anno = { ...sc.canone.netto_per_anno, ...perAnno };
        sc.canone.calendario = { ...(sc.canone.calendario || {}), ...cal };
      }
      return;
    }
    const fattore = CR.netto_annuo ? nettoAnnuo / CR.netto_annuo : 0;
    const rate = RATE_ORIZ.filter((r) => r.mese.slice(0, 4) === String(ANNO));
    const cal = {};
    for (const r of rate) cal[r.mese] = Math.round(r.netto * fattore);
    if (!rate.length) cal[`${ANNO}-${ULTIMO_PF.slice(5)}`] = Math.round(nettoAnnuo / 1);
    const totale = Object.values(cal).reduce((a, b) => a + b, 0);
    if (!sc.canone) {
      sc.canone = { netto_per_anno: { [ANNO]: totale }, rate_n: Math.max(1, rate.length), da_mese: rate.length ? rate[0].mese : MESI_PF[0], calendario: cal, aliquota_iva: CR.aliquota_iva };
    } else {
      sc.canone.netto_per_anno[ANNO] = totale;
      const altri = Object.fromEntries(Object.entries(sc.canone.calendario || {}).filter(([m]) => m.slice(0, 4) !== String(ANNO)));
      sc.canone.calendario = { ...altri, ...cal };
    }
  }
  const calendarioAnno = (c) => !!(c && c.calendario && Object.keys(c.calendario).some((m) => m.slice(0, 4) === String(ANNO)));
  function lordoAnno() {
    const c = stato.scenario.canone;
    if (!c) return RATE_ORIZ.filter((r) => r.mese.slice(0, 4) === String(ANNO)).reduce((s, r) => s + r.lordo, 0);
    try { return MOTORE.flussiCanone(c, D.mesi).filter((f) => f.mese.slice(0, 4) === String(ANNO)).reduce((s, f) => s + f.importo, 0); } catch (e) { return 0; }
  }

  // Aliquota con cui lo slider converte lordo <-> netto: quella dello scenario se c'è, altrimenti il riferimento.
  const aliquotaSlider = () => (stato.scenario.canone ? stato.scenario.canone.aliquota_iva : CR.aliquota_iva);
  const lordoSlider = () => MOTORE.iva(nettoSlider(), aliquotaSlider());
  function renderCanone() {
    const c = stato.scenario.canone;
    const lordo = lordoSlider();
    const MAX_LORDO = MOTORE.iva(MAX_SLIDER, aliquotaSlider());
    const anni = c ? Object.entries(c.netto_per_anno).sort((a, b) => Number(a[0]) - Number(b[0])) : [];
    const dett = c ? `<div class="riga">${anni.map(([a, v]) => `<label class="piccolo">${a} netto € <input type="text" class="eur" data-canone-anno="${a}" value="${fmt(v)}"></label>`).join("")}
          <label class="piccolo">anno <input type="number" class="n" style="width:72px" min="2026" max="2040" data-canone-nuovo-anno value="${Math.max(...anni.map(([a]) => Number(a))) + 1}"></label>
          <button data-canone-aggiungi>+ anno</button></div>
        <div class="riga"><label class="piccolo">rate <input type="text" class="n" id="canone-rate" value="${c.rate_n}"></label>
          <label class="piccolo">da mese ${selMesi(c.da_mese, "sel-canone-da")}</label>
          <label class="piccolo">IVA % <input type="text" class="n" id="canone-iva" value="${c.aliquota_iva}"></label>
          <button data-canone-pf>Torna al canone del PF</button></div>
        <div class="riga"><label class="piccolo" style="flex:1">oppure calendario libero (mese=netto; vince sulle rate per quell'anno)<br>
          <input type="text" class="nome" id="canone-cal" placeholder="2027-03=200.000,00; 2027-06=300.000,00" value="${esc(calendarioTesto(c.calendario))}"></label></div>
        <div class="nota">Il canone è lordo in cassa: esce da ORTI ed entra in INTUR nello stesso mese. Negli anni coperti dalla scaletta sostituisce le righe «Fitto Hotel» del PF.</div>`
      : `<div class="nota">Canone come nel PF: rate nell'orizzonte ${RATE_ORIZ.length ? RATE_ORIZ.map((r) => `${meseIt(r.mese)} ${fmt(r.lordo, false)} lordo`).join(", ") : "nessuna"}. ${CONTR ? ` Il contratto prevede ${Object.keys(CONTR.rate_mese).sort().map((mm) => `30/${mm}`).join(", ")}: <button data-canone-contratto class="mini">applica il calendario del contratto</button>.` : ""} Muovi lo slider, oppure <button data-canone-attiva class="mini">apri la scaletta</button> per anni, rate e calendario.</div>`;
    el("canone").innerHTML = `<div class="testa"><div><strong>Canone Fitto Hotel</strong> <span class="piccolo">ORTI → INTUR · lordo annuo IVA inclusa${CR.dichiarato ? " (dichiarato)" : " (dalle rate PF nell'orizzonte)"}</span></div>
        <div class="grande num" id="canone-val"></div></div>
      <div class="slider"><input type="range" id="canone-slider" min="0" max="${MAX_LORDO}" step="100000" value="${Math.min(Math.max(lordo, 0), MAX_LORDO)}" aria-label="Canone lordo annuo IVA inclusa">
        <input type="text" class="eur" id="canone-num" value="${fmt(lordo, false)}" aria-label="Canone lordo annuo IVA inclusa in euro"></div>
      <div class="piccolo" id="canone-info"></div>
      <details id="canone-dett" ${aperte.has("canone") ? "open" : ""}><summary>Scaletta pluriennale e scadenze</summary>${dett}</details>`;
    const slider = el("canone-slider"), num = el("canone-num");
    slider.oninput = () => { const l = parseInt(slider.value, 10); impostaCanone(nettoDaLordo(l, aliquotaSlider())); num.value = fmt(l, false); ricalcola({ canoneLeggero: true }); };
    slider.onchange = () => ricalcola();
    num.onchange = () => { const v = euroDa(num); if (v === null || v < 0) return; impostaCanone(nettoDaLordo(v, aliquotaSlider())); ricalcola(); };
    const box = el("canone");
    const contr = box.querySelector("button[data-canone-contratto]");
    if (contr) contr.onclick = () => { impostaCanone(CR.netto_annuo); ricalcola(); };
    const att = box.querySelector("button[data-canone-attiva]");
    if (att) att.onclick = () => { if (!stato.scenario.canone) impostaCanone(CR.netto_annuo); el("canone-dett").open = true; ricalcola(); };
    if (c) {
      box.querySelectorAll("input[data-canone-anno]").forEach((inp) => { inp.onchange = () => { const v = euroDa(inp); if (v === null) return; c.netto_per_anno[inp.dataset.canoneAnno] = v; ricalcola(); }; });
      box.querySelector("button[data-canone-aggiungi]").onclick = () => {
        const inp = box.querySelector("input[data-canone-nuovo-anno]");
        const a = inp.value.trim();
        const ok = /^\d{4}$/.test(a) && +a >= 2026 && +a <= 2040 && !(a in c.netto_per_anno);
        inp.classList.toggle("invalid", !ok);
        if (ok) { c.netto_per_anno[a] = 0; ricalcola(); }
      };
      el("canone-rate").onchange = (e) => { c.rate_n = parseInt(e.target.value, 10) || 1; ricalcola(); };
      el("canone-iva").onchange = (e) => { c.aliquota_iva = parseInt(e.target.value, 10) || 0; ricalcola(); };
      box.querySelector("select.sel-canone-da").onchange = (e) => { c.da_mese = e.target.value; ricalcola(); };
      el("canone-cal").onchange = (e) => {
        const cal = calendarioParse(e.target.value);
        e.target.classList.toggle("invalid", cal === null);
        if (cal === null) return;
        c.calendario = Object.keys(cal).length ? cal : null;
        ricalcola();
      };
      box.querySelector("button[data-canone-pf]").onclick = () => { stato.scenario.canone = null; ricalcola(); };
    }
    aggiornaCanoneInfo();
  }

  function aggiornaCanoneInfo() {
    const c = stato.scenario.canone;
    const netto = nettoSlider();
    el("canone-val").textContent = `${fmt(lordoSlider(), false)} €`;
    const parti = [`netto annuo ${fmt(netto, false)} € (IVA ${aliquotaSlider()}%)`];
    if (CR.dichiarato) parti.push(`annuo dichiarato ${fmt(CR.netto_annuo, false)} netto (${fmt(CR.lordo_annuo, false)} lordo) il ${CR.dichiarato_il || "—"}`);
    else parti.push("nessun annuo dichiarato: la base è la somma delle rate PF nell'orizzonte");
    const ratePf = Object.entries(CR.rate_pf || {}).sort().map(([m, v]) => `${meseIt(m)} ${fmt(v, false)}`).join(", ");
    if (CONTR) parti.push(`contratto: rate il ${Object.keys(CONTR.rate_mese).sort().map((mm) => `30/${mm}`).join(", ")} da ${fmt(Object.values(CONTR.rate_mese)[0], false)} netto`);
    if (ratePf) parti.push(`rate nel PF: ${ratePf}`);
    if (c) parti.push(`IVA ${c.aliquota_iva}%`); else parti.push("come nel PF");
    // Il canone mese per mese: esce da ORTI ed entra in INTUR nello stesso mese. Si dice sempre,
    // perché il minimo di ORTI può stare in un mese diverso e non muoversi anche se il canone cambia.
    const pfFl = D.intercompany.filter((f) => f.nome.startsWith("Fitto Hotel") && f.stato === "pf");
    const fuori = Object.keys(CR.rate_pf || {}).filter((m) => !D.mesi.includes(m));
    const scFl = c ? MOTORE.flussiCanone(c, D.mesi) : pfFl;
    const perMese = {};
    for (const f of scFl) perMese[f.mese] = (perMese[f.mese] || 0) + f.importo;
    const pfPerMese = {};
    for (const f of pfFl) pfPerMese[f.mese] = (pfPerMese[f.mese] || 0) + f.importo;
    const mesiCan = Object.keys(perMese).sort();
    const esce = mesiCan.length ? mesiCan.map((m) => `${meseIt(m)} ${fmt(perMese[m], false)}`).join(", ") : "nessun mese nell'orizzonte";
    const diffMesi = [...new Set([...Object.keys(perMese), ...Object.keys(pfPerMese)])].sort().filter((m) => (perMese[m] || 0) !== (pfPerMese[m] || 0));
    const vsPF = diffMesi.length ? `<br>rispetto al PF: ${diffMesi.map((m) => `${meseIt(m)} ORTI ${segno(-((perMese[m] || 0) - (pfPerMese[m] || 0)), false)} · INTUR ${segno((perMese[m] || 0) - (pfPerMese[m] || 0), false)}`).join(", ")}` : "";
    const eff = SOC.map((s) => `${s} ${segno(ris.minimi[s].saldo - D.baseline.minimi[s].saldo, false)}`).join(" · ");
    el("canone-info").innerHTML = `${parti.join(" · ")}<br>esce da ORTI ed entra in INTUR nell'orizzonte (lordo): ${esce}${fuori.length ? ` · fuori orizzonte: ${fuori.map(meseIt).join(", ")}` : ""}${vsPF}<br>effetto di tutte le leve sui minimi: ${eff}`;
  }

  // ── voci di un mese (dettaglio e "tre voci più grandi") ──
  function vociMese(soc, mese) {
    const sc = stato.scenario;
    const voci = { E: {}, U: {} };
    const add = (dir, nome, imp) => { if (imp) voci[dir][nome] = (voci[dir][nome] || 0) + imp; };
    const conFin = new Set(sc.finanziamenti.map((f) => f.societa));
    for (const r of D.pf) {
      if (r.societa === soc && r.mese === mese && !(r.voce_id === "ENTRATE_FINANZIAMENTI" && conFin.has(soc))) add(r.direzione, etichetta(r.voce_id), r.importo);
    }
    let interc = D.intercompany;
    if (sc.canone) {
      const nuovi = MOTORE.flussiCanone(sc.canone, D.mesi);
      const anni = new Set(nuovi.map((f) => f.mese.slice(0, 4)));
      interc = interc.filter((f) => !(f.nome.startsWith("Fitto Hotel") && anni.has(f.mese.slice(0, 4)))).concat(nuovi);
    }
    for (const f of interc) {
      if (f.mese !== mese) continue;
      const tag = f.stato === "una_gamba" ? " (una gamba)" : f.stato === "scenario" ? " (scaletta)" : "";
      if (f.stato === "una_gamba") {
        if (SOC.includes(f.da)) { if (f.da === soc) add("U", f.nome + tag, f.importo); }
        else if (f.a === soc) add("E", f.nome + tag, f.importo);
        continue;
      }
      if (f.a === soc) add("E", f.nome + tag, f.importo);
      if (f.da === soc) add("U", f.nome + tag, f.importo);
    }
    for (const r of (sc.manuali || [])) if (r.societa === soc && r.mese === mese) add(r.direzione, `${etichetta(r.voce_id)} (manuale)`, r.importo_cent !== undefined ? r.importo_cent : r.importo);
    for (const f of sc.finanziamenti) {
      if (f.societa !== soc) continue;
      add("E", `${f.nome} · erogazione`, f.erogazioni[mese] || 0);
      add("U", `${f.nome} · rata`, f.rate[mese] || 0);
    }
    const [progetti] = MOTORE.riconcilia(sc.progetti, D.fatti);
    for (const p of progetti) {
      if (!p.acceso || p.societa !== soc) continue;
      for (const g of p.pagamenti) add("U", `${p.nome}: ${g.nome}`, MOTORE.iva(g.mesi[mese] || 0, g.aliquota_iva));
    }
    for (const f of D.fatti) if (f.societa === soc && f.mese === mese) add("U", `${f.progetto_id} · ${f.fornitore_id || "fatto"} (registrato)`, f.importo);
    return voci;
  }

  // ── minimi ──
  function renderMinimi() {
    const box = el("minimi");
    box.innerHTML = "";
    for (const soc of SOC) {
      const m = ris.minimi[soc], b = D.baseline.minimi[soc], a = D.ancore[soc];
      const delta = m.saldo - b.saldo;
      const usc = Object.entries(vociMese(soc, m.mese).U).sort((x, y) => y[1] - x[1]).slice(0, 3);
      const sotto = m.sotto_soglia.length ? `<div class="piccolo">${stato.scenario.soglia ? `sotto la soglia di ${fmt(stato.scenario.soglia, false)}` : "sotto zero"}: ${m.sotto_soglia.map(meseIt).join(", ")}</div>` : "";
      const eff = IPO.size ? effettoOltrePF(soc) : 0;
      const oltre = IPO.size ? `<div class="oltre">oltre ${meseIt(ULTIMO_PF)}, senza PF: ${eff ? `leve ${segno(eff)} entro ${meseIt(ULTIMO)}` : "nessuna leva"}</div>` : "";
      box.insertAdjacentHTML("beforeend", `<div class="card">
        <div><strong>${soc}</strong> · minimo a ${meseIt(m.mese)} <span class="badge ${a.attestato ? "ok" : "warn"}" title="vedi Fonti e versioni">ancora ${a.attestato ? "attestata" : "dichiarata"}</span></div>
        <div class="saldo num ${m.saldo < 0 ? "neg" : ""}">${fmt(m.saldo)} €</div>
        <div class="delta num">${delta === 0 ? "come con il solo PF" : `${segno(delta)} rispetto al solo PF`} · solo PF: minimo ${fmt(b.saldo)} a ${meseIt(b.mese)}</div>
        ${sotto}
        <ul>${usc.map(([n, v]) => `<li>${esc(n)} <span class="num">${fmt(v)}</span></li>`).join("") || "<li>nessuna uscita nel mese</li>"}</ul>
        ${oltre}
      </div>`);
    }
  }

  // ── grafico SVG: linee nei mesi PF, barre dell'effetto leve nei mesi senza PF ──
  function grafico(soc) {
    const W = 640, H = 230, L = 62, R = 10, T = 12, B = 34;
    const n = D.mesi.length;
    const sce = ris.righe.filter((r) => r.societa === soc).map((r) => r.fin);
    const bas = D.baseline.righe.filter((r) => r.societa === soc).map((r) => r.fin);
    const nPF = MESI_PF.length;
    const dPF = sce[nPF - 1] - bas[nPF - 1];
    const eff = D.mesi.map((m, i) => (IPO.has(m) ? (sce[i] - bas[i]) - dPF : 0));
    const tutti = sce.slice(0, nPF).concat(bas.slice(0, nPF), eff.slice(nPF), [0]);
    let lo = Math.min(...tutti), hi = Math.max(...tutti);
    if (hi === lo) hi = lo + 100;
    const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
    const x = (i) => L + (n === 1 ? 0 : (i * (W - L - R)) / (n - 1));
    const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    const path = (vals) => vals.slice(0, nPF).map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const dx = n > 1 ? x(1) - x(0) : 20;
    const i0 = nPF < n ? nPF : -1;
    const coda = i0 >= 0 ? `<rect x="${(x(i0) - dx / 2).toFixed(1)}" y="${T}" width="${(W - R - x(i0) + dx / 2).toFixed(1)}" height="${H - T - B}" fill="var(--ipo)"/>
      <text x="${(x(i0) - dx / 2 + 4).toFixed(1)}" y="${T + 11}" font-size="10" fill="var(--muted)">senza PF · solo leve dopo ${meseIt(ULTIMO_PF)}</text>` : "";
    const barre = i0 >= 0 ? D.mesi.slice(nPF).map((m, k) => { const i = nPF + k, v = eff[i]; if (!v) return ""; const y0 = y(0), y1 = y(v); return `<rect x="${(x(i) - dx * 0.3).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${(dx * 0.6).toFixed(1)}" height="${Math.max(1, Math.abs(y1 - y0)).toFixed(1)}" fill="${v < 0 ? "var(--bad)" : "var(--accent)"}" opacity="0.35"><title>${meseIt(m)}: leve dopo ${meseIt(ULTIMO_PF)} ${segno(v)} € (nessun saldo previsto)</title></rect>`; }).join("") : "";
    const passo = n > 12 ? 2 : 1;
    const assi = D.mesi.map((m, i) => (i % passo ? "" : `<text x="${x(i).toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="10" fill="var(--muted)">${meseIt(m)}</text>`)).join("");
    const griglia = [lo + pad, (lo + hi) / 2, hi - pad].map((v) => `<text x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" class="num">${fmt(Math.round(v / 100) * 100, false)}</text>`).join("");
    const punti = sce.slice(0, nPF).map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${v < 0 ? "var(--bad)" : "var(--accent)"}"><title>${meseIt(D.mesi[i])}: ${fmt(v)} € (solo PF ${fmt(bas[i])})</title></circle>`).join("");
    return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo ${soc}">
      ${coda}
      <line x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      ${griglia}${barre}
      <path d="${path(bas)}" fill="none" stroke="var(--base-line)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="${path(sce)}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${punti}${assi}
    </svg>`;
  }

  function renderGrafici() {
    el("grafici").innerHTML = SOC.map((soc) => `<h2>${soc} · saldo di fine mese</h2><div class="card">${grafico(soc)}
      <div class="leg"><span><i></i>scenario</span><span><i class="base"></i>solo PF, nessuna leva</span>${IPO.size ? `<span><i class="eff"></i>oltre il PF: effetto cumulato delle leve dopo ${meseIt(ULTIMO_PF)}, non un saldo</span>` : ""}</div></div>`).join("");
  }

  // ── tabelle per società ──
  function renderTabelle() {
    const box = el("tabelle");
    box.innerHTML = "";
    for (const soc of SOC) {
      const righe = ris.righe.filter((r) => r.societa === soc);
      const basi = D.baseline.righe.filter((r) => r.societa === soc);
      const iPF = MESI_PF.length - 1;
      const dPF = righe[iPF].fin - basi[iPF].fin;
      const corpo = righe.map((r, i) => {
        const k = `${soc}|${r.mese}`;
        const ipo = IPO.has(r.mese);
        const ent = somma(r.entrate), usc = somma(r.uscite);
        const d = ipo ? (r.fin - basi[i].fin) - dPF : r.fin - basi[i].fin;
        let dett = "";
        if (aperti.has(k)) {
          const v = vociMese(soc, r.mese);
          const lista = (o, segno) => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([n, x]) => `<li>${segno} ${esc(n)} <span class="num">${fmt(x)}</span></li>`).join("");
          dett = `<tr class="dett"><td colspan="5">${ipo ? '<div class="nota">mese senza PF: contano solo le leve dello scenario</div>' : ""}<ul>${lista(v.E, "+") + lista(v.U, "−") || "<li>nessun movimento</li>"}</ul></td></tr>`;
        }
        const finale = ipo
          ? `<td class="num ${d < 0 ? "neg" : ""}">${d ? `<span class="piccolo">leve</span> ${segno(d)}` : "—"}</td>`
          : `<td class="num ${r.fin < 0 ? "neg" : ""}">${fmt(r.fin)}${d ? `<br><span class="piccolo num">${segno(d)}</span>` : ""}</td>`;
        return `<tr class="mese ${ipo ? "ipo" : ""}" data-k="${k}">
          <td>${meseIt(r.mese)}${ipo ? ' <span class="badge">senza PF</span>' : ""}</td>
          <td class="num ini ${ipo ? "vuoto" : ""}">${ipo ? "—" : fmt(r.ini)}</td><td class="num ${ipo && !ent ? "vuoto" : ""}">${ipo && !ent ? "—" : fmt(ent)}</td><td class="num ${ipo && !usc ? "vuoto" : ""}">${ipo && !usc ? "—" : fmt(usc)}</td>
          ${finale}</tr>${dett}`;
      }).join("");
      box.insertAdjacentHTML("beforeend", `<h2>${soc} · mese per mese <span class="piccolo">(tocca un mese per le voci)</span></h2>
        <div class="card" style="padding:4px 8px"><table><thead><tr><th>mese</th><th class="ini">iniziale</th><th>entrate</th><th>uscite</th><th>finale</th></tr></thead><tbody>${corpo}</tbody></table>
        ${IPO.size ? `<div class="nota">Da ${meseIt(D.mesi_ipotetici[0])} il PF non c'è: nessun saldo, solo l'effetto cumulato delle leve dopo ${meseIt(ULTIMO_PF)} rispetto al solo PF.</div>` : ""}</div>`);
    }
    box.querySelectorAll("tr.mese").forEach((tr) => {
      tr.onclick = () => { const k = tr.dataset.k; aperti.has(k) ? aperti.delete(k) : aperti.add(k); renderTabelle(); };
    });
  }

  function renderConsolidato() {
    const righe = ris.consolidato.map((c) => { const ipo = IPO.has(c.mese); return `<tr class="${ipo ? "ipo" : ""}"><td>${meseIt(c.mese)}${ipo ? ' <span class="badge">senza PF</span>' : ""}</td><td class="num ${ipo ? "vuoto" : c.saldo < 0 ? "neg" : ""}">${ipo ? "—" : fmt(c.saldo)}</td><td class="num">${fmt(c.intercompany_nettato)}</td><td class="num ${c.residuo ? "neg" : ""}">${fmt(c.residuo)}</td></tr>`; }).join("");
    el("consolidato").innerHTML = `<table><thead><tr><th>mese</th><th>saldo gruppo</th><th>intercompany nettato</th><th>residuo (una gamba)</th></tr></thead><tbody>${righe}</tbody></table>
      <div class="nota">Il residuo è un flusso intercompany presente su una sola società: resta lì, non si inventa la contropartita.</div>`;
    const nr = ris.non_riconciliati;
    el("fatti").innerHTML = D.fatti.length ? `<h2>Fatti (pagamenti registrati)</h2><div class="card"><table><thead><tr><th>mese</th><th>società</th><th>progetto · fornitore</th><th>importo</th><th>stato</th></tr></thead><tbody>${
      D.fatti.map((f) => { const n = nr.some((x) => x.evento_id === f.evento_id); return `<tr><td>${meseIt(f.mese)}</td><td>${esc(f.societa)}</td><td>${esc(f.progetto_id)} · ${esc(f.fornitore_id || "—")}</td><td class="num">${fmt(f.importo)}</td><td><span class="badge ${n ? "bad" : "ok"}">${n ? "non riconciliato" : "riconciliato"}</span></td></tr>`; }).join("")
    }</tbody></table><div class="nota">Un fatto riconciliato riduce il pagamento previsto dello stesso fornitore (dal mese più vecchio); gli altri impegni del progetto non si muovono.</div></div>` : "";
  }

  // ── leve: progetti e finanziamenti a tendina ──
  const selMesi = (val, cls = "") => `<select class="${cls}">${D.mesi.map((m) => `<option value="${m}" ${m === val ? "selected" : ""}>${meseIt(m)}</option>`).join("")}</select>`;
  const selSoc = (val) => `<select data-campo="societa">${SOC.map((s) => `<option ${s === val ? "selected" : ""}>${s}</option>`).join("")}</select>`;
  // L'aliquota del pagamento entra tra le opzioni se non è tra le tre standard: la select non mente mai.
  const selIva = (val) => `<select data-campo="aliquota_iva">${([0, 10, 22].includes(val) ? [0, 10, 22] : [0, 10, 22, val].sort((a, b) => a - b)).map((a) => `<option value="${a}" ${a === val ? "selected" : ""}>IVA ${a}%</option>`).join("")}</select>`;

  function grigliaMesi(mesi, pref) {
    const chiavi = Object.keys(mesi).sort();
    const liberi = D.mesi.filter((m) => !(m in mesi));
    return `<div class="mesi">${chiavi.map((m) => `<label>${meseIt(m)}${IPO.has(m) ? " ·" : ""}<input type="text" class="eur" data-${pref}="${m}" value="${fmt(mesi[m], true)}"></label>`).join("")}
      ${liberi.length ? `<label>+ mese<select data-${pref}-nuovo><option value="">…</option>${liberi.map((m) => `<option value="${m}">${meseIt(m)}${IPO.has(m) ? " (senza PF)" : ""}</option>`).join("")}</select></label>` : ""}</div>`;
  }

  // Peso di una leva: di quanto cambia il minimo della sua società togliendola (o accendendola).
  function peso(variante, soc, acceso) {
    const r = calcolaSicuro(variante);
    if (!r) return "";
    const fine = (x) => x.righe.filter((q) => q.societa === soc)[D.mesi.length - 1].fin;
    const d = acceso ? ris.minimi[soc].saldo - r.minimi[soc].saldo : r.minimi[soc].saldo - ris.minimi[soc].saldo;
    const df = acceso ? fine(ris) - fine(r) : fine(r) - fine(ris);
    const pre = acceso ? "" : "se acceso: ";
    if (!d) return `<span class="peso ${df < 0 ? "neg" : ""}">${pre}non muove il minimo ${soc}${df ? `, a ${meseIt(ULTIMO)} ${segno(df, false)}` : ""}</span>`;
    return `<span class="peso ${d < 0 ? "neg" : ""}">${pre}${acceso ? "pesa " : ""}${segno(d, false)} sul minimo ${soc}</span>`;
  }

  function renderLeve() {
    sincronizzaAperte();
    const sc = stato.scenario;
    const progetti = sc.progetti.map((p, i) => {
      const k = `p:${p.id}`;
      const netto = p.pagamenti.reduce((s, g) => s + somma(g.mesi), 0);
      const lordo = p.pagamenti.reduce((s, g) => s + Object.values(g.mesi).reduce((a, b) => a + MOTORE.iva(b, g.aliquota_iva), 0), 0);
      const tuttiMesi = Object.assign({}, ...p.pagamenti.map((g) => g.mesi));
      const variante = copia(sc); variante.progetti[i].acceso = !p.acceso;
      return `<details class="leva ${p.acceso ? "" : "spento"}" data-k="${k}" data-p="${i}" ${aperte.has(k) ? "open" : ""}>
      <summary><label class="sw" onclick="event.stopPropagation()" title="${p.acceso ? "acceso: conta in cassa" : "spento: non conta"}"><input type="checkbox" data-acceso ${p.acceso ? "checked" : ""} aria-label="accendi ${esc(p.nome)}"></label>
        <span class="nome">${esc(p.nome)}</span>
        <span class="badge">${esc(p.societa)}</span><span class="badge ${badgeStato(p.stato)}">${statoIt(p.stato)}</span>
        <span class="num tot">${fmt(lordo, false)} €</span><span class="piccolo num">lordo in cassa · netto ${fmt(netto, false)} · ${periodoDi(tuttiMesi)}</span>
        ${peso(variante, p.societa, p.acceso)}</summary>
      <div class="corpo">
        <div class="riga"><input type="text" class="nome" style="flex:1 1 140px;font-weight:600" data-campo="nome" value="${esc(p.nome)}">
          ${selSoc(p.societa)} <input type="text" class="n" style="width:110px" data-campo="stato" value="${esc(p.stato)}" title="stato">
          <button data-elimina-p title="elimina progetto">× elimina</button></div>
        ${p.pagamenti.map((g, j) => `<div class="pag" data-g="${j}">
          <div class="riga"><input type="text" class="nome" style="flex:1 1 140px" data-campo="nome" value="${esc(g.nome)}"> ${selIva(g.aliquota_iva)}
            <input type="text" class="n" style="width:90px" data-campo="stato" value="${esc(g.stato)}" title="stato">
            <input type="text" class="n" style="width:90px" data-campo="fornitore_id" value="${esc(g.fornitore_id || "")}" placeholder="fornitore" title="fornitore_id (riconcilia i fatti)">
            <button data-elimina-g title="elimina pagamento">×</button></div>
          <div class="piccolo num">netto ${fmt(somma(g.mesi))} · lordo ${fmt(Object.values(g.mesi).reduce((a, b) => a + MOTORE.iva(b, g.aliquota_iva), 0))}</div>
          ${grigliaMesi(g.mesi, "mese")}
          <div class="riga"><span class="piccolo">spalma</span> <input type="text" class="eur" data-spalma-tot placeholder="totale netto €"> <span class="piccolo">da</span> ${selMesi(Object.keys(g.mesi).sort()[0] || D.mesi[0], "sel-spalma-da")} <span class="piccolo">in</span> <input type="text" class="n" data-spalma-n value="${Math.max(1, Object.keys(g.mesi).length)}"> <button data-spalma>Spalma</button> <span class="nota" data-errore-spalma></span></div>
          ${p.acceso ? "" : '<div class="nota">non conta finché il progetto è spento</div>'}
        </div>`).join("")}
        <div class="riga"><button data-aggiungi-g>+ pagamento</button></div>
      </div></details>`;
    }).join("");
    el("progetti").innerHTML = `${progetti || '<div class="nota">nessun progetto nello scenario</div>'}
      <div class="strumenti"><button id="aggiungi-p">+ progetto</button><button class="mini" data-apri="p">apri tutto</button><button class="mini" data-chiudi="p">chiudi tutto</button></div>`;

    const finanz = sc.finanziamenti.map((f, i) => {
      const k = `f:${f.id}`;
      const variante = copia(sc); variante.finanziamenti.splice(i, 1);
      return `<details class="leva" data-k="${k}" data-f="${i}" ${aperte.has(k) ? "open" : ""}>
      <summary><span class="nome">${esc(f.nome)}</span><span class="badge">${esc(f.societa)}</span><span class="badge ${badgeStato(f.stato)}">${statoIt(f.stato)}</span>
        <span class="num tot">${fmt(somma(f.erogazioni), false)} €</span><span class="piccolo num">erogato ${periodoDi(f.erogazioni)} · rate ${Object.keys(f.rate).length ? `${fmt(somma(f.rate), false)} (${periodoDi(f.rate)})` : "nessuna nell'orizzonte"}</span>
        ${peso(variante, f.societa, true)}</summary>
      <div class="corpo">

        <div class="piccolo">rate</div>${grigliaMesi(f.rate, "rata")}

      </div></details>`;
    }).join("");
    el("finanziamenti").innerHTML = `${finanz || '<div class="nota">nessun finanziamento nello scenario</div>'}
      <div class="strumenti"><button id="aggiungi-f">+ finanziamento</button><button class="mini" data-apri="f">apri tutto</button><button class="mini" data-chiudi="f">chiudi tutto</button></div>`;
    collegaLeve();
  }

  function leggiMesi(root, pref, mesi) {
    root.querySelectorAll(`input[data-${pref}]`).forEach((inp) => {
      inp.onchange = () => { const v = euroDa(inp); if (v === null) return; if (v) mesi[inp.dataset[pref]] = v; else delete mesi[inp.dataset[pref]]; ricalcola(); };
    });
    const nuovo = root.querySelector(`select[data-${pref}-nuovo]`);
    if (nuovo) nuovo.onchange = () => { if (nuovo.value) { mesi[nuovo.value] = 0; renderLeve(); } };
  }

  function collegaLeve() {
    const sc = stato.scenario;
    const tutte = (pre, aperto) => { document.querySelectorAll(`details.leva[data-k^="${pre}"]`).forEach((d) => { d.open = aperto; }); renderLeve(); };
    document.querySelectorAll("button[data-apri]").forEach((b) => { b.onclick = () => tutte(`${b.dataset.apri}:`, true); });
    document.querySelectorAll("button[data-chiudi]").forEach((b) => { b.onclick = () => tutte(`${b.dataset.chiudi}:`, false); });
    // progetti
    el("progetti").querySelectorAll("details.leva[data-p]").forEach((div) => {
      const p = sc.progetti[parseInt(div.dataset.p, 10)];
      div.querySelector("input[data-acceso]").onchange = (e) => { p.acceso = e.target.checked; ricalcola(); };
      div.querySelectorAll(".corpo > .riga [data-campo]").forEach((inp) => {
        inp.onchange = () => { p[inp.dataset.campo] = inp.value; ricalcola(); };
      });
      div.querySelector("button[data-elimina-p]").onclick = () => { sc.progetti.splice(sc.progetti.indexOf(p), 1); ricalcola(); };
      div.querySelector("button[data-aggiungi-g]").onclick = () => { p.pagamenti.push({ nome: "Nuovo pagamento", mesi: {}, aliquota_iva: 22, stato: "ipotesi", fornitore_id: null }); renderLeve(); };
      div.querySelectorAll(".pag").forEach((pg) => {
        const g = p.pagamenti[parseInt(pg.dataset.g, 10)];
        pg.querySelectorAll(":scope > .riga [data-campo]").forEach((inp) => {
          inp.onchange = () => {
            const v = inp.value;
            g[inp.dataset.campo] = inp.dataset.campo === "aliquota_iva" ? parseInt(v, 10) : inp.dataset.campo === "fornitore_id" ? (v || null) : v;
            ricalcola();
          };
        });
        pg.querySelector("button[data-elimina-g]").onclick = () => { p.pagamenti.splice(p.pagamenti.indexOf(g), 1); ricalcola(); };
        leggiMesi(pg, "mese", g.mesi);
        pg.querySelector("button[data-spalma]").onclick = () => {
          const campoTot = pg.querySelector("input[data-spalma-tot]");
          const letto = euroDa(campoTot);
          if (letto === null) return;
          const tot = letto || somma(g.mesi);
          const da = pg.querySelector("select.sel-spalma-da").value;
          const n = parseInt(pg.querySelector("input[data-spalma-n]").value, 10) || 1;
          try { g.mesi = MOTORE.distribuisci(tot, da, n, D.mesi); ricalcola(); } catch (e) { pg.querySelector("[data-errore-spalma]").textContent = e.message; }
        };
      });
    });
    el("aggiungi-p").onclick = () => { const id = `P${Date.now().toString(36)}`; sc.progetti.push({ id, nome: "Nuovo progetto", societa: "INTUR", acceso: true, stato: "ipotesi", pagamenti: [{ nome: "Pagamento", mesi: {}, aliquota_iva: 22, stato: "ipotesi", fornitore_id: null }] }); aperte.add(`p:${id}`); ricalcola(); };
    // finanziamenti
    el("finanziamenti").querySelectorAll("details.leva[data-f]").forEach((div) => {
      const i = parseInt(div.dataset.f, 10);
      const f = sc.finanziamenti[i];
      div.querySelectorAll(".corpo > .riga [data-campo]").forEach((inp) => { inp.onchange = () => { f[inp.dataset.campo] = inp.value; ricalcola(); }; });
      div.querySelector("button[data-elimina-f]").onclick = () => { sc.finanziamenti.splice(i, 1); ricalcola(); };
      leggiMesi(div, "erog", f.erogazioni);
      leggiMesi(div, "rata", f.rate);
    });
    el("aggiungi-f").onclick = () => { const id = `F${Date.now().toString(36)}`; sc.finanziamenti.push({ id, nome: "Nuovo finanziamento", societa: "INTUR", erogazioni: {}, rate: {}, stato: "da verificare" }); aperte.add(`f:${id}`); ricalcola(); };
  }

  function renderLimiti() {
    const extra = [];
    if (ris.non_riconciliati.length) extra.push(`Nello scenario corrente ${ris.non_riconciliati.length} fatti non trovano un pagamento di progetto dello stesso fornitore nello scenario; contano comunque come uscita.`);
    for (const p of stato.scenario.progetti) for (const g of p.pagamenti) if (/verificare/i.test(g.nome) || /verificare/i.test(g.stato)) extra.push(`${p.nome}: ${g.nome} — ${p.acceso ? "conta in cassa" : "spento"}, da verificare.`);
    el("limiti").innerHTML = `<h2>Limiti di questa pagina</h2><ul>${D.limiti.concat(extra).map((l) => `<li>${esc(l)}</li>`).join("")}</ul>`;
  }

  function render(opts = {}) {
    sincronizzaAperte();
    renderMinimi();
    renderGrafici();
    renderTabelle();
    renderConsolidato();
    renderLeve();
    renderLimiti();
    if (opts.canoneLeggero) aggiornaCanoneInfo(); else renderCanone();
  }

  renderTesta();
  renderFonti();
  renderScenario();
  ricalcola();
})();
</script>
</body>
</html>
