  }
  function collegaRate(root, leggi, scrivi, aliquota, dopo = ricalcola) {
    const err = root.querySelector("[data-errore-spalma]");
    const prova = (fn) => { try { scrivi(fn()); dopo(); } catch (e) { err.textContent = e.message; } };
    // Una rata sola è una tantum: la cadenza non ha senso e non si mostra; «prima rata» diventa «mese».
    const nIn = root.querySelector("input[data-spalma-n]"), passoSel = root.querySelector("select[data-spalma-passo]"), quando = root.querySelector("[data-spalma-quando]");
    const aggiornaCadenza = () => { const uno = !(parseInt(nIn.value, 10) > 1); passoSel.hidden = uno; if (quando) quando.textContent = uno ? "mese" : "prima rata"; };
    nIn.oninput = aggiornaCadenza;
    root.querySelector("button[data-spalma]").onclick = () => {
      const t = euroDa(root.querySelector("input[data-spalma-tot]"));
      if (t === null) return;
      const base = root.querySelector("select[data-spalma-base]");
      const tot = base && base.value === "lordo" ? FORMATO.nettoDaLordo(t, aliquota) : t;
      const n = parseInt(root.querySelector("input[data-spalma-n]").value, 10);
      const passo = parseInt(root.querySelector("select[data-spalma-passo]").value, 10);
      prova(() => FORMATO.spalma(tot, root.querySelector("select.sel-spalma-da").value, n, passo, D.mesi));
    };
    root.querySelectorAll("button[data-sposta]").forEach((b) => { b.onclick = () => prova(() => FORMATO.sposta(leggi(), parseInt(b.dataset.sposta, 10), D.mesi)); });
  }
  const selSoc = (val) => `<select data-campo="societa">${SOC.map((s) => `<option ${s === val ? "selected" : ""}>${s}</option>`).join("")}</select>`;
  // L'aliquota del pagamento entra tra le opzioni se non è tra le tre standard: la select non mente mai.
  const selIva = (val) => `<select data-campo="aliquota_iva">${([0, 10, 22].includes(val) ? [0, 10, 22] : [0, 10, 22, val].sort((a, b) => a - b)).map((a) => `<option value="${a}" ${a === val ? "selected" : ""}>IVA ${a}%</option>`).join("")}</select>`;

  function grigliaMesi(mesi, pref) {
    const chiavi = Object.keys(mesi).sort();
    const liberi = D.mesi.filter((m) => !(m in mesi));
    // Ogni rata si può dividere (metà resta, metà va al mese dopo) o unire con la rata successiva: la somma non cambia mai.
    return `<div class="mesi">${chiavi.map((m, i) => `<label>${meseIt(m)}${IPO.has(m) ? " ·" : ""}<span class="cella"><input type="text" class="eur" data-${pref}="${m}" value="${fmt(mesi[m], true)}">${D.mesi.indexOf(m) < D.mesi.length - 1 ? `<button type="button" class="mini op" data-${pref}-dividi="${m}" title="dividi: metà resta a ${meseIt(m)}, metà va al mese dopo" aria-label="dividi la rata di ${meseIt(m)}">÷</button>` : ""}${i < chiavi.length - 1 ? `<button type="button" class="mini op" data-${pref}-unisci="${m}" title="unisci con la rata di ${meseIt(chiavi[i + 1])}" aria-label="unisci la rata di ${meseIt(m)} con quella di ${meseIt(chiavi[i + 1])}">⇥</button>` : ""}</span></label>`).join("")}
      ${liberi.length ? `<label>+ mese<select data-${pref}-nuovo><option value="">…</option>${liberi.map((m) => `<option value="${m}">${meseIt(m)}${IPO.has(m) ? " (senza PF)" : ""}</option>`).join("")}</select></label>` : ""}</div>`;
  }

  // Peso di una leva: di quanto cambia il minimo della sua società togliendola (o accendendola).
  function peso(variante, soc, acceso) {
    const r = calcolaSicuro(variante);
    if (!r) return "";
    const fine = (x) => x.righe.filter((q) => q.societa === soc)[D.mesi.length - 1].fin;
    const d = acceso ? ris.minimi[soc].saldo - r.minimi[soc].saldo : r.minimi[soc].saldo - ris.minimi[soc].saldo;
    const df = acceso ? fine(ris) - fine(r) : fine(r) - fine(ris);
    const pre = acceso ? "" : "se acceso: ";
    if (!d) return `<span class="peso ${df < 0 ? "neg" : ""}">${pre}non muove il minimo ${soc}${df ? `, a ${meseIt(ULTIMO)} ${segno(df, false)}` : ""}</span>`;
    return `<span class="peso ${d < 0 ? "neg" : ""}">${pre}${acceso ? "pesa " : ""}${segno(d, false)} sul minimo ${soc}</span>`;
  }

  // ── Progetti a livelli: budget del progetto → macro → sottovoci, in una tabella come Excel ──
  // Si scrive nelle celle; si aggiunge scrivendo nell'ultima riga vuota di una macro (una sottovoce) o del
  // progetto (una macro). Il calcolo legge solo i pagamenti: si derivano dai livelli a ogni modifica.
  const AREE = ["Opere", "Fornitura e posa", "Da comprare"];
  const eu = (c) => fmt(c, c % 100 !== 0);
  const conMesi = (pesi) => Object.values(pesi || {}).some((w) => w > 0);
  const mesiDi = (lista) => { const o = {}; for (const g of lista) for (const [m, v] of Object.entries(g.mesi || {})) o[m] = (o[m] || 0) + v; return o; };
  const ivaMacro = (L, m) => m.aliquota_iva ?? L.aliquota_iva ?? 22;
  const nettoVoce = (v) => (Object.keys(v.mesi || {}).length ? somma(v.mesi) : v.netto || 0);
  // `totale` sugli stessi mesi in proporzione (mesi tutti a zero: parti uguali); l'ultimo prende il resto.
  function riscala(mesi, totale) {
    const ks = Object.keys(mesi || {});
    if (!ks.length) return {};
    return FORMATO.perPesi(totale, somma(mesi) > 0 ? mesi : Object.fromEntries(ks.map((m) => [m, 1])), ks);
  }
  // I pesi di un budget letti come «quando»: gli importi che si pagherebbero, nel testo dell'Excel.
  const quandoBudget = (budget, pesi) => (conMesi(pesi) ? FORMATO.quandoTesto(FORMATO.perPesi(budget || 10000, pesi, Object.keys(pesi))) : "");
  const nuovoId = (pre, usati) => { let k = usati.length + 1; while (usati.includes(`${pre}${k}`)) k += 1; return `${pre}${k}`; };
  const aggiungi = (lista, x) => { lista.push(x); return x; };
  const idVoci = (L) => L.macro.flatMap((m) => (m.voci || []).map((v) => v.id));
  const nuovaMacro = (L, nome = "") => ({ id: nuovoId("m", L.macro.map((m) => m.id)), nome: nome || `Macro ${L.macro.length + 1}`, budget_netto: null, mesi_budget: null, aliquota_iva: null, area: null, voci: [] });
  const nuovaVoce = (L, nome = "") => ({ id: nuovoId("v", idVoci(L)), nome, fornitore_id: null, area: null, netto: 0, mesi: {}, aliquota_iva: null, stato: null, documenti: [], note: "" });
  const livelliVuoti = () => ({ budget_netto: null, mesi_budget: null, aliquota_iva: 22, macro: [] });

  // Ogni modifica passa da qui: i pagamenti si derivano dai livelli, poi si ricalcola tutto.
  // La cella che aveva il fuoco lo ritrova dopo il ridisegno (Tab porta alla cella dopo, come in Excel).
  let rinomina = null;   // la riga vuota appena diventata una riga vera: il fuoco la segue
  function aggiornaProgetto(p) {
    p.pagamenti = FORMATO.derivaPagamenti(p, D.mesi);
    const f = fuocoLivelli();
    ricalcola();
    rimettiFuoco(f);
    rinomina = null;
  }
  function fuocoLivelli() {
    const a = document.activeElement;
    const tr = a && a.closest ? a.closest("table.livelli tr[data-riga]") : null;
    if (!tr || !a.dataset.col) return null;
    const leva = tr.closest("details.leva[data-k]");
    const testo = a.tagName === "INPUT";
    return { k: leva.dataset.k, riga: tr.dataset.riga, col: a.dataset.col, inizio: testo ? a.selectionStart : null, fine: testo ? a.selectionEnd : null, tutto: testo && a.selectionStart === 0 && a.selectionEnd === a.value.length };
  }
  function rimettiFuoco(f) {
    if (!f) return;
    const riga = rinomina && rinomina.k === f.k && rinomina.da === f.riga ? rinomina.a : f.riga;
    const x = document.querySelector(`details.leva[data-k="${f.k}"] tr[data-riga="${riga}"] [data-col="${f.col}"]`);
    if (!x) return;
    x.focus({ preventScroll: true });
    if (x.tagName === "INPUT") { if (f.tutto) x.select(); else if (f.inizio !== null) try { x.setSelectionRange(f.inizio, f.fine); } catch (e) { /* campo senza selezione */ } }
  }

  // Una cella scritta: la legge, la valida e la scrive nel suo nodo. Ritorna un messaggio se non va.
  function scriviCella(p, tipo, nodo, m, col, valore) {
    const L = p.livelli, raw = String(valore).trim();
    const fuori = (mesi) => Object.keys(mesi).filter((x) => !D.mesi.includes(x));
    if (col === "nome") { if (!raw) return "il nome non può restare vuoto"; nodo.nome = raw; return null; }
    if (col === "fornitore") { nodo.fornitore_id = raw || null; return null; }
    if (col === "area") { nodo.area = raw || null; return null; }
    if (col === "iva") { nodo.aliquota_iva = raw === "" ? null : parseInt(raw, 10); return null; }
    if (col === "netto" && tipo === "voce") {
      const v = parseEuro(raw);
      if (v === null || v < 0) return "scrivi un importo netto, es. 30.000";
      // stessi mesi in proporzione; una sottovoce senza mesi prende quelli della sua macro, o del progetto
      const pesi = Object.keys(nodo.mesi || {}).length ? null : conMesi(m.mesi_budget) ? m.mesi_budget : conMesi(L.mesi_budget) ? L.mesi_budget : null;
      nodo.mesi = pesi ? FORMATO.perPesi(v, pesi, Object.keys(pesi).filter((x) => D.mesi.includes(x))) : riscala(nodo.mesi, v);
      nodo.netto = v;
      return null;
    }
    if (col === "netto") {   // il budget del progetto o della macro; vuoto = nessun budget
      const v = raw === "" ? null : parseEuro(raw);
      if (v === null && raw !== "") return "scrivi il budget netto, es. 165.000 (vuoto = nessun budget)";
      if (v !== null && v < 0) return "il budget non può essere negativo";
      // la prima volta, i mesi del budget sono quelli dei pagamenti che ha sotto (pesi = importi)
      if (v !== null && nodo.budget_netto == null && !conMesi(nodo.mesi_budget)) {
        const sotto = tipo === "progetto" ? mesiDi(p.pagamenti) : mesiDi(nodo.voci || []);
        nodo.mesi_budget = conMesi(sotto) ? sotto : tipo === "macro" && conMesi(L.mesi_budget) ? { ...L.mesi_budget } : null;
      }
      nodo.budget_netto = v;
      return null;
    }
    if (col === "quando") {
      if (tipo === "voce") {
        const tot = nettoVoce(nodo);
        const mesi = raw ? FORMATO.quandoParse(raw, tot) : {};
        if (!mesi) return `non capisco «${raw}»: es. «mar 27», «gen 27–mar 27 ×3», «ott 26 15% · nov 26–mar 27 ×5»`;
        if (fuori(mesi).length) return `${fuori(mesi).map(meseIt).join(", ")} fuori dall'orizzonte (fino a ${meseIt(ULTIMO)})`;
        nodo.mesi = mesi;
        nodo.netto = tot;
        return null;
      }
      // i mesi di un budget sono pesi: si leggono sul budget (o su 100, se il budget non c'è ancora)
      const mesi = raw ? FORMATO.quandoParse(raw, nodo.budget_netto || 10000) : null;
      if (raw && !mesi) return `non capisco «${raw}»: es. «gen 27–mar 27 ×3», «feb 27 40% · mar 27 60%»`;
      if (mesi && fuori(mesi).length) return `${fuori(mesi).map(meseIt).join(", ")} fuori dall'orizzonte (fino a ${meseIt(ULTIMO)})`;
      nodo.mesi_budget = mesi && conMesi(mesi) ? mesi : null;
      return null;
    }
    return null;
  }

  const AIUTO_QUANDO = "es. «mar 27», «gen 27–mar 27 ×3», «ott 26 15% · nov 26–mar 27 ×5»";
  function selArea(val, eredita) {
    const opz = ["", ...AREE, ...(val && !AREE.includes(val) ? [val] : [])];
    return `<select data-col="area" aria-label="area">${opz.map((a) => `<option value="${esc(a)}" ${a === (val || "") ? "selected" : ""}>${a ? esc(a) : eredita ? `(${esc(eredita)})` : "—"}</option>`).join("")}</select>`;
  }
  function selIvaL(val, eredita) {
    const opz = [0, 10, 22, ...(val != null && ![0, 10, 22].includes(val) ? [val] : [])];
    return `<select data-col="iva" aria-label="IVA" title="IVA; «↑» = la stessa del livello sopra">${eredita !== undefined ? `<option value="" ${val == null ? "selected" : ""}>${eredita}% ↑</option>` : ""}${opz.map((a) => `<option value="${a}" ${a === val ? "selected" : ""}>${a}%</option>`).join("")}</select>`;
  }
  // La busta di un livello: budget · assegnati · da assegnare. Oltre budget si dice «oltre di X ⚠», mai un negativo.
  function testoBusta(b, vuota = false) {
    if (b.budget === null) return vuota ? "nessun budget" : `${fmt(b.assegnato, false)} nelle sottovoci · nessun budget`;
    if (b.oltre) return `assegnati ${fmt(b.assegnato, false)} · <span class="oltre">oltre di ${fmt(b.oltre, false)} ⚠</span>`;
    return `assegnati ${fmt(b.assegnato, false)} · <span class="${b.da_assegnare ? "resta" : "ok-t"}">da assegnare ${fmt(b.da_assegnare, false)}</span>`;
  }
  const chiuse = new Set();     // macro richiuse: "<progetto>:<macro>"
  let conferma = null;          // la macro con sottovoci di cui si sta chiedendo «elimino?»

  function bloccoLivelli(p) {
    const L = p.livelli, B = FORMATO.buste(L);
    const ivaP = L.aliquota_iva ?? 22;
    const avvisi = [...FORMATO.avvisiLivelli(p.livelli, D.mesi),
      ...L.macro.flatMap((m) => (m.voci || []).filter((v) => v.netto && !Object.keys(v.mesi || {}).length).map((v) => `${v.nome}: ${eu(v.netto)} senza «quando»: non conta finché non scrivi i mesi`))];
    const quandoIn = (val, ph, err = false) => `<input type="text" class="quando${err ? " invalid" : ""}" data-col="quando" value="${esc(val)}" placeholder="${esc(ph)}" title="${val ? `${esc(val)} · ` : ""}quando si paga: ${esc(AIUTO_QUANDO)}">`;
    const fornIn = (val, ph = "fornitore") => `<input type="text" data-col="fornitore" value="${esc(val || "")}" placeholder="${esc(ph)}" list="lista-fornitori-id" title="id del fornitore: lo stesso in ogni progetto, lo trovi nella scheda Fornitori">`;
    const nettoIn = (val, ph, attr = "") => `<input type="text" class="eur" data-col="netto" ${attr} value="${val === null ? "" : eu(val)}" placeholder="${esc(ph)}">`;
    const voceRiga = (m, v, nuova = false) => {
      const riga = nuova ? `nv:${m.id}` : `v:${m.id}:${v.id}`;
      const kd = `vd:${p.id}:${m.id}:${v.id}`;
      const netto = nettoVoce(v);
      const ndoc = (v.documenti || []).length;
      const patti = !nuova && (p.contratti || []).some((c) => voceDeiPatti(p, c) === v.id);
      return `<tr class="liv-voce${nuova ? " liv-nuova" : ""}" data-riga="${riga}" ${nuova ? `data-nuova-voce="${esc(m.id)}"` : ""}>
        <td class="nome-l"><input type="text" data-col="nome" value="${esc(nuova ? "" : v.nome)}" placeholder="${nuova ? "scrivi qui una sottovoce…" : "nome"}" aria-label="sottovoce di ${esc(m.nome)}"></td>
        <td>${fornIn(v.fornitore_id, nuova && !(m.voci || []).length && m.fornitore_id ? m.fornitore_id : "fornitore")}</td>
        <td>${selArea(v.area, m.area)}</td>
        <td>${nettoIn(nuova ? null : netto, "netto")}</td>
        <td>${quandoIn(nuova ? "" : FORMATO.quandoTesto(v.mesi), nuova ? "quando" : "quando?", !nuova && netto > 0 && !Object.keys(v.mesi || {}).length)}</td>
        <td>${selIvaL(v.aliquota_iva ?? null, ivaMacro(L, m))}</td>
        <td class="az">${nuova ? "" : `<button type="button" class="mini" data-dett="${esc(m.id)}:${esc(v.id)}" aria-expanded="${aperte.has(kd)}" title="rate mese per mese, stato, note, documenti e patti col fornitore">${aperte.has(kd) ? "▴" : "⋯"}${patti ? " patti" : ""}${ndoc ? ` 📄${ndoc}` : ""}</button><button type="button" class="mini" data-elimina-voce="${esc(m.id)}:${esc(v.id)}" title="togli la sottovoce" aria-label="togli ${esc(v.nome)}">×</button>`}</td></tr>
        ${!nuova && aperte.has(kd) ? dettaglioVoce(p, m, v) : ""}`;
    };
    const macroRighe = L.macro.map((m, i) => {
      const b = B.macro[i], voci = m.voci || [], km = `${p.id}:${m.id}`, chiusa = chiuse.has(km);
      const proprio = quandoBudget(m.budget_netto, m.mesi_budget);
      const daProgetto = conMesi(L.mesi_budget) ? `come il progetto: ${quandoBudget(L.budget_netto, L.mesi_budget)}` : "quando?";
      const lordoV = voci.reduce((t, v) => t + nettoVoce(v), 0);
      return `<tr class="liv-macro" data-riga="m:${esc(m.id)}">
        <td class="nome-l"><div class="nome-macro"><button type="button" class="mini piega" data-piega="${esc(m.id)}" aria-expanded="${!chiusa}" title="${chiusa ? "apri" : "chiudi"} la macro">${chiusa ? "▸" : "▾"}</button><input type="text" data-col="nome" value="${esc(m.nome)}" aria-label="nome della macro"></div>
          <div class="piccolo">${voci.length ? `${voci.length} ${voci.length === 1 ? "sottovoce" : "sottovoci"} · ` : ""}${testoBusta(b, !voci.length)}</div></td>
        <td>${voci.length ? "" : fornIn(m.fornitore_id)}</td>
        <td>${selArea(m.area)}</td>
        <td>${nettoIn(m.budget_netto ?? null, voci.length ? eu(b.assegnato) : "budget", `data-budget-macro="${esc(m.id)}" title="il budget della macro; vuoto = vale la somma delle sottovoci"`)}</td>
        <td>${quandoIn(proprio, m.budget_netto == null && !voci.length ? "quando" : daProgetto, m.budget_netto != null && b.da_assegnare > 0 && !conMesi(m.mesi_budget) && !conMesi(L.mesi_budget))}</td>
        <td>${selIvaL(m.aliquota_iva ?? null, ivaP)}</td>
        <td class="az"><button type="button" class="mini" data-elimina-macro="${esc(m.id)}" title="togli la macro" aria-label="togli la macro ${esc(m.nome)}">×</button></td></tr>
        ${conferma === km ? `<tr class="liv-conferma" data-riga="c:${esc(m.id)}"><td colspan="7">Togliere «${esc(m.nome)}» con ${voci.length === 1 ? "la sua sottovoce" : `le sue ${voci.length} sottovoci`} (${fmt(lordoV, false)} netto)?
          <button type="button" class="mini primario" data-conferma-macro="${esc(m.id)}">sì, togli</button> <button type="button" class="mini" data-annulla-macro>no</button></td></tr>` : ""}
        ${chiusa ? "" : voci.map((v) => voceRiga(m, v)).join("") + voceRiga(m, nuovaVoce(L), true)}`;
    }).join("");
    const nuovaM = nuovaMacro(L, "");
    return `<div class="livelli-testa"><strong>Budget, macro e sottovoci</strong> <span class="piccolo">scrivi nelle celle; per aggiungere, scrivi nell'ultima riga vuota</span><span class="excel-progetto"><button type="button" class="mini" data-esporta-progetto title="il progetto in un foglio Excel: una riga per sottovoce, budget in testa; si corregge in Excel e si reimporta">Esporta (.xlsx)</button><button type="button" class="mini" data-esporta-vuoto title="solo l'intestazione e il budget del progetto: da riempire in Excel">Esporta vuoto</button><button type="button" class="mini" data-importa-progetto title="un foglio Excel sostituisce il progetto (o una sua macro): prima vedi cosa entra, cambia e sparisce">Importa (.xlsx/.csv)</button><input type="file" data-importa-file accept=".xlsx,.csv,.txt" hidden></span></div>
      ${imp.p === p.id && imp.fogli ? pannelloImport(p) : ""}
      ${avvisi.length ? `<div class="avvisi-livelli">${avvisi.map((a) => `<div>⚠ ${esc(a)}</div>`).join("")}</div>` : ""}
      <div class="livelli-wrap"><table class="livelli">
        <colgroup><col class="c-nome"><col class="c-forn"><col class="c-area"><col class="c-netto"><col class="c-quando"><col class="c-iva"><col class="c-az"></colgroup>
        <thead><tr><th>macro / sottovoce</th><th>fornitore</th><th>area</th><th class="num">netto €</th><th>quando</th><th>IVA</th><th></th></tr></thead>
        <tbody>
        <tr class="liv-progetto" data-riga="P"><td class="nome-l"><strong>Budget del progetto</strong><div class="piccolo">${L.budget_netto == null ? `nessun budget: vale la somma delle macro, ${fmt(B.progetto.assegnato, false)}` : testoBusta(B.progetto)}</div></td><td></td><td></td>
          <td>${nettoIn(L.budget_netto ?? null, "budget", 'data-budget-progetto title="il budget netto del progetto; vuoto = vale la somma delle macro"')}</td>
          <td>${quandoIn(quandoBudget(L.budget_netto, L.mesi_budget), "quando", L.budget_netto != null && B.progetto.da_assegnare > 0 && !conMesi(L.mesi_budget))}</td>
          <td>${selIvaL(ivaP)}</td><td></td></tr>
        ${macroRighe}
        <tr class="liv-macro liv-nuova" data-riga="nm" data-nuova-macro>
          <td class="nome-l"><input type="text" data-col="nome" value="" placeholder="scrivi qui una nuova macro…" aria-label="nuova macro"></td>
          <td>${fornIn("")}</td><td>${selArea(nuovaM.area)}</td><td>${nettoIn(null, "budget")}</td><td>${quandoIn("", "quando")}</td><td>${selIvaL(null, ivaP)}</td><td></td></tr>
        </tbody></table></div>
      <div class="nota">Le sottovoci consumano la macro, le macro consumano il budget del progetto. Quello che non è assegnato si paga nei mesi del budget, IVA compresa: aggiungere una riga non cambia il totale, finché non si va oltre.</div>`;
  }
  // Il dettaglio di una sottovoce: le rate mese per mese, stato, note, documenti e i patti col fornitore.
  function dettaglioVoce(p, m, v) {
    const iva = v.aliquota_iva ?? ivaMacro(p.livelli, m);
    const F = String(v.fornitore_id || "").trim();
    const contratti = (p.contratti || []).map((c, ci) => [c, ci]).filter(([c]) => voceDeiPatti(p, c) === v.id);
    return `<tr class="liv-dett" data-riga="d:${esc(m.id)}:${esc(v.id)}"><td colspan="7"><div class="pag">
      <div class="frase">${esc(comeSiPaga(v.mesi, iva))}</div>
      <div class="riga"><label class="piccolo">stato <input type="text" class="n" style="width:110px" data-vcampo="stato" value="${esc(v.stato || "")}" placeholder="${esc(p.stato || "ipotesi")}"></label>
        <label class="piccolo" style="flex:1 1 200px;display:flex;gap:6px;align-items:center">note <input type="text" class="nome" data-vcampo="note" value="${esc(v.note || "")}"></label></div>
      ${bloccoRate(v.mesi, iva)}
      ${grigliaMesi(v.mesi, "mese")}
      <div class="documenti"><div class="piccolo">documenti (preventivo, contratto, fattura: link Drive)</div>
        ${(v.documenti || []).map((d, di) => `<div class="riga" data-doc="${di}"><input type="text" class="nome" style="flex:1 1 120px" data-doc-titolo value="${esc(d.titolo || "")}" placeholder="titolo, es. preventivo 0066/26"><input type="url" class="nome" style="flex:2 1 200px" data-doc-url value="${esc(d.url || "")}" placeholder="https://drive.google.com/…"><button type="button" class="mini" data-elimina-doc title="togli il documento" aria-label="togli il documento ${esc(d.titolo || "")}">×</button></div>`).join("")}
        <div class="riga"><button type="button" class="mini" data-aggiungi-doc>+ documento</button></div></div>
      ${contratti.map(([c, ci]) => bloccoContratto(p, c, ci)).join("")}
      ${contratti.length ? "" : F ? `<div class="riga"><button type="button" class="mini" data-patti-voce title="anticipo, SAL, ritenuta: generano i mesi di questa sottovoce">+ come paghi ${esc(F)}</button></div>` : '<div class="nota">scrivi il fornitore per mettere i patti (anticipo, SAL, ritenuta)</div>'}
    </div></td></tr>`;
  }
  function collegaLivelli(div, p) {
    const L = p.livelli;
    div.querySelector("button[data-esporta-progetto]").onclick = () => esportaProgetto(p, false);
    div.querySelector("button[data-esporta-vuoto]").onclick = () => esportaProgetto(p, true);
    const fi = div.querySelector("input[data-importa-file]");
    div.querySelector("button[data-importa-progetto]").onclick = () => fi.click();
    fi.onchange = async (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) await apriImport(p, f); };
    const box = div.querySelector("#progetto-import-pannello");
    if (box) collegaImport(box, p);
    const tab = div.querySelector("table.livelli");
    if (!tab) return;
    const k = div.dataset.k;
    // si ridisegna dopo che il fuoco è passato alla cella dopo (Tab), così la ritrova
    const poi = () => setTimeout(() => aggiornaProgetto(p), 0);
    const macroDi = (id) => L.macro.find((m) => m.id === id);
    const voceDi = (m, id) => (m.voci || []).find((v) => v.id === id);
    tab.querySelectorAll("tr[data-riga]").forEach((tr) => {
      const r = tr.dataset.riga;
      let tipo, nodo, m = null, crea = null;
      if (r === "P") { tipo = "progetto"; nodo = L; }
      else if (r === "nm") { tipo = "macro"; crea = () => { const x = aggiungi(L.macro, nuovaMacro(L)); rinomina = { k, da: r, a: `m:${x.id}` }; return x; }; }
      else if (r.startsWith("m:")) { tipo = "macro"; nodo = macroDi(r.slice(2)); }
      else if (r.startsWith("nv:")) {
        tipo = "voce"; m = macroDi(r.slice(3));
        crea = () => {
          const x = aggiungi(m.voci, nuovaVoce(L, `sottovoce ${m.voci.length + 1}`));
          if (m.voci.length === 1 && m.fornitore_id) x.fornitore_id = m.fornitore_id;   // la prima sottovoce eredita il fornitore della macro
          rinomina = { k, da: r, a: `v:${m.id}:${x.id}` };
          return x;
        };
      } else if (r.startsWith("v:")) { tipo = "voce"; const [mid, vid] = r.slice(2).split(":"); m = macroDi(mid); nodo = voceDi(m, vid); }
      else return;
      tr.querySelectorAll("[data-col]").forEach((inp) => {
        inp.onchange = () => {
          if (!nodo && !inp.value.trim()) return;
          // una riga vuota diventa vera solo se quello che hai scritto è valido
          const x = nodo || (tipo === "macro" ? nuovaMacro(L) : nuovaVoce(L, "sottovoce"));
          const prova = copia(x);
          const err = scriviCella(p, tipo, prova, m, inp.dataset.col, inp.value);
          inp.classList.toggle("invalid", !!err);
          inp.title = err || (inp.dataset.col === "quando" ? `quando si paga: ${AIUTO_QUANDO}` : "");
          if (err) return;
          const vero = nodo || crea();
          if (!nodo && inp.dataset.col === "nome") vero.nome = "";
          scriviCella(p, tipo, vero, m, inp.dataset.col, inp.value);
          poi();
        };
      });
    });
    tab.querySelectorAll("button[data-piega]").forEach((b) => { b.onclick = () => { const km = `${p.id}:${b.dataset.piega}`; if (chiuse.has(km)) chiuse.delete(km); else chiuse.add(km); renderLeve(); }; });
    tab.querySelectorAll("button[data-dett]").forEach((b) => { b.onclick = () => { const kd = `vd:${p.id}:${b.dataset.dett}`; if (aperte.has(kd)) aperte.delete(kd); else aperte.add(kd); renderLeve(); }; });
    tab.querySelectorAll("button[data-elimina-voce]").forEach((b) => {
      b.onclick = () => {
        const [mid, vid] = b.dataset.eliminaVoce.split(":"), mm = macroDi(mid), v = voceDi(mm, vid), i = mm.voci.indexOf(v);
        mm.voci.splice(i, 1);
        aggiornaProgetto(p);
        avvisa(`«${v.nome}» tolta da ${mm.nome}: ${fmt(nettoVoce(v), false)} tornano nel da assegnare, se c'è un budget`, () => { mm.voci.splice(i, 0, v); aggiornaProgetto(p); });
      };
    });
    const togliMacro = (mm) => {
      const i = L.macro.indexOf(mm);
      L.macro.splice(i, 1);
      conferma = null;
      aggiornaProgetto(p);
      avvisa(`macro «${mm.nome}» tolta`, () => { L.macro.splice(i, 0, mm); aggiornaProgetto(p); });
    };
    // una macro con sottovoci chiede conferma qui, nella riga; una vuota si toglie (e si può annullare)
    tab.querySelectorAll("button[data-elimina-macro]").forEach((b) => {
      b.onclick = () => { const mm = macroDi(b.dataset.eliminaMacro); if ((mm.voci || []).length) { conferma = `${p.id}:${mm.id}`; renderLeve(); } else togliMacro(mm); };
    });
    tab.querySelectorAll("button[data-conferma-macro]").forEach((b) => { b.onclick = () => togliMacro(macroDi(b.dataset.confermaMacro)); });
    tab.querySelectorAll("button[data-annulla-macro]").forEach((b) => { b.onclick = () => { conferma = null; renderLeve(); }; });
    tab.querySelectorAll("tr.liv-dett").forEach((tr) => {
      const [mid, vid] = tr.dataset.riga.slice(2).split(":"), mm = macroDi(mid), v = voceDi(mm, vid);
      const iva = v.aliquota_iva ?? ivaMacro(L, mm);
      tr.querySelectorAll("[data-vcampo]").forEach((inp) => { inp.onchange = () => { v[inp.dataset.vcampo] = inp.value.trim() || (inp.dataset.vcampo === "note" ? "" : null); poi(); }; });
      const dopoMesi = () => { v.netto = somma(v.mesi); aggiornaProgetto(p); };
      leggiMesi(tr, "mese", v.mesi, dopoMesi);
      collegaRate(tr.querySelector(".come"), () => v.mesi, (mesi) => { v.mesi = mesi; }, iva, dopoMesi);
      tr.querySelectorAll(".documenti .riga[data-doc]").forEach((rd) => {
        const d = v.documenti[parseInt(rd.dataset.doc, 10)];
        rd.querySelector("input[data-doc-titolo]").onchange = (e) => { d.titolo = e.target.value.trim(); aggiornaProgetto(p); };
        rd.querySelector("input[data-doc-url]").onchange = (e) => { d.url = e.target.value.trim(); aggiornaProgetto(p); };
        rd.querySelector("button[data-elimina-doc]").onclick = () => { v.documenti.splice(v.documenti.indexOf(d), 1); aggiornaProgetto(p); };
      });
      tr.querySelector("button[data-aggiungi-doc]").onclick = () => { v.documenti = v.documenti || []; v.documenti.push({ titolo: "", url: "" }); renderLeve(); };
      const pv = tr.querySelector("button[data-patti-voce]");
      if (pv) pv.onclick = () => {
        const F = String(v.fornitore_id).trim();
        p.contratti = p.contratti || [];
        p.contratti.push({ ...FORMATO.contrattoDaPagamenti(p.pagamenti.filter((g) => g.voce_id === v.id), F, D.mesi), voce_id: v.id });
        renderLeve();
      };
    });
  }
  // ── Il giro Excel del progetto: esporta, correggi in Excel, reimporta. L'import sostituisce: un file con la
  // colonna «Macro» tutto il progetto, uno senza solo la macro scelta qui. Prima di applicare si vede, riga per
  // riga, cosa entra, cambia e sparisce, il totale prima → dopo e il minimo della società; ogni riga si spegne. ──
  const imp = { p: null, file: "", fogli: null, foglio: 0, testa: 0, colonne: {}, macro: "", mese: null, iva: null, spente: new Set() };
  const nomeDaFile = () => imp.file.replace(/\.(xlsx|csv|txt)$/i, "").slice(0, 60);
  function esportaProgetto(p, vuoto) {
    const bytes = EXCEL.costruisci([{ nome: p.nome, colonne: FORMATO.TESTA_PROGETTO, righe: FORMATO.righeProgetto(p, vuoto), euro: [4] }]);
    scaricaXlsx(bytes, `${String(p.nome || "progetto").replace(/[^\w.-]+/g, "_")}-${new Date().toISOString().slice(0, 10)}${vuoto ? "-vuoto" : ""}.xlsx`);
  }
  async function apriImport(p, file) {
    let fogli;
    try { fogli = await EXCEL.leggi(file); } catch (e) { mostraErrore(`Importa in «${p.nome}» il file «${file.name}»: ${e.message}`); return; }
    // senza «Quando» una rata al primo mese in cui il progetto paga già (o al primo dell'orizzonte)
    const primo = Object.keys(mesiDi(p.pagamenti)).sort().find((m) => D.mesi.includes(m)) || D.mesi[0];
    Object.assign(imp, { p: p.id, file: file.name, fogli, mese: primo, iva: null, spente: new Set() });
    imp.macro = nomeDaFile();   // di default una macro nuova col nome del file
    scegliFoglioImport(foglioMigliore(fogli));
    renderLeve();
    const box = el("progetto-import-pannello");
    if (box) box.scrollIntoView({ behavior: ridotto() ? "auto" : "smooth", block: "nearest" });
  }
  function scegliFoglioImport(i) {
    const g = FORMATO.indovinaColonne(imp.fogli[i].righe);
    Object.assign(imp, { foglio: i, testa: g.testa, colonne: g.colonne, spente: new Set() });
  }
  // Il file letto contro il progetto: differenze, righe da sistemare e il progetto come sarebbe (righe spente escluse).
  function anteprimaImport(p) {
    const sc = stato.scenario, c = imp.colonne, scelta = c.macro >= 0 ? null : imp.macro;
    // i fornitori: un id già in uso resta quello (il giro Excel scrive gli id); gli altri si riconoscono come in «Importa budget»
    const ids = new Set([...Object.keys(sc.fornitori || {}), ...sc.progetti.flatMap((q) => q.pagamenti.map((g) => g.fornitore_id)).filter(Boolean)]);
    const ric = {};
    const fornitore = (nome) => { if (ids.has(nome)) return nome; const r = riconosciFornitoreBudget(nome); if (r.id) ric[r.id] = r; return r.id || null; };

  // ── Importa budget (brief UI, punto 8, ultimo passo): «ti metto il budget, tu riconosci i fornitori» ──
  // Un foglio con una riga per opera (fornitore · area · totale) diventa pagamenti proposti in un progetto:
  // il fornitore si riconosce (scheda esistente, anagrafica Esolver, o nuovo id), i mesi vengono dai patti

  const budget = { file: "", fogli: null, foglio: 0, testa: 0, colonne: {}, progetto: "", mese: null, iva: 22, righe: [] };

  // il foglio buono è quello con più righe che hanno un numero in una colonna «totale/importo»

    return migliore;
  }
  async function apriBudget(file) {

    budget.file = file.name;
    scegliFoglioBudget(foglioMigliore(budget.fogli));
    budget.progetto = budget.progetto || (stato.scenario.progetti[0] || {}).id || "";
    budget.mese = budget.mese || D.mesi[0];
    renderBudget();
    el("budget-pannello").scrollIntoView({ behavior: ridotto() ? "auto" : "smooth", block: "start" });
  }
  function scegliFoglioBudget(i) {
    budget.foglio = i;

  }
  const slugId = (nome) => String(nome || "").toUpperCase().replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 24);
  function riconosciFornitoreBudget(nome) {
    const n = String(nome || "").trim();
    if (senzaFornitore(n)) return { id: "", nome: n, stato: "non_registrato", perche: "fornitore non indicato nel budget" };
    const mappa = stato.scenario.fornitori || {};
    const cNome = n.toLowerCase().replace(/[^a-z0-9]+/g, "");
    const gia = Object.entries(mappa).find(([id, f]) => id === slugId(n) || String(f.nome || "").toLowerCase().replace(/[^a-z0-9]+/g, "") === cNome);
    if (gia) return { id: gia[0], nome: gia[1].nome || gia[0], stato: "attestato", perche: "scheda già nello scenario", patti: gia[1].patti || null };
    const inUso = new Set(stato.scenario.progetti.flatMap((p) => p.pagamenti.map((g) => g.fornitore_id)).filter(Boolean));
    if (inUso.has(slugId(n))) return { id: slugId(n), nome: n, stato: "dichiarato", perche: "id già usato nei pagamenti" };
    const r = riconosci(n);
    if (r) return { id: slugId(n), nome: n, stato: "da_verificare", perche: `in anagrafica Esolver: ${r.nome} (${r.codice})`, codice: r.codice, societa: r.societa };

  // Un fornitore riconosciuto (riconosciFornitoreBudget) senza scheda nello scenario la riceve, col codice Esolver se c'è.
  function schedaFornitore(sc, ric) {
    sc.fornitori = sc.fornitori || {};

    sc.fornitori[ric.id] = { nome: ric.nome };
    if (ric.codice) { sc.fornitori[ric.id].codice_esolver = ric.codice; if (ric.societa) sc.fornitori[ric.id].societa = ric.societa; }

  function preparaRigheBudget() {

      const fornitore = c.fornitore >= 0 ? String(r[c.fornitore] ?? "").trim() : "";

  function pianoRigaBudget(riga) {

  }
  function renderBudget() {

        ${budget.fogli.length > 1 ? `<label class="piccolo">foglio <select id="budget-foglio">${budget.fogli.map((x, i) => `<option value="${i}" ${i === budget.foglio ? "selected" : ""}>${esc(x.nome)}</option>`).join("")}</select></label>` : ""}
        <button type="button" class="mini" id="budget-chiudi">chiudi</button></div>
      <div class="riga piccolo">colonne: fornitore ${selCol("fornitore")} opera ${selCol("opera")} importo netto ${selCol("importo")} note ${selCol("note")}</div>
      <div class="riga piccolo">nel progetto <select id="budget-progetto">${prog.map((p) => `<option value="${esc(p.id)}" ${p.id === budget.progetto ? "selected" : ""}>${esc(p.nome)}</option>`).join("")}<option value="__nuovo" ${budget.progetto === "__nuovo" ? "selected" : ""}>nuovo progetto dal file</option></select>
        inizio ${selMesi(budget.mese, "sel-budget-mese")} IVA <select id="budget-iva">${[0, 10, 22].map((a) => `<option value="${a}" ${a === budget.iva ? "selected" : ""}>${a}%</option>`).join("")}</select></div>
      <div class="wrap"><table><thead><tr><th></th><th>riga</th><th>fornitore</th><th>riconosciuto</th><th>opera</th><th class="num">netto</th><th>come si paga</th></tr></thead><tbody>
        ${budget.righe.map((r, i) => `<tr class="${r.attiva ? "" : "salta"}"><td><input type="checkbox" data-briga="${i}" ${r.attiva ? "checked" : ""} ${r.importo ? "" : "disabled"}></td><td class="piccolo">${r.n}</td><td>${esc(r.fornitore || "—")}</td>
          <td>${r.ric.id ? `<code>${esc(r.ric.id)}</code> ` : ""}${chipStato(r.ric.stato, r.ric.perche, r.ric.stato === "attestato" ? "scheda" : r.ric.stato === "da_verificare" ? `Esolver? ${r.ric.codice}` : r.ric.stato === "non_registrato" ? "senza fornitore" : "nuovo")}</td>
          <td>${esc(r.opera)}${r.note ? `<div class="piccolo">${esc(r.note)}</div>` : ""}</td><td class="num">${r.importo === null ? "—" : fmt(r.importo, false)}</td><td class="piccolo">${r.attiva ? esc(pianoRigaBudget(r).come) : "saltata"}</td></tr>`).join("")}
      </tbody></table></div>

        <span class="piccolo">stato «ipotesi»; i fornitori nuovi ricevono una scheda (col codice Esolver se riconosciuto); poi si raffina: dividi, patti, documenti</span></div>`;
    box.querySelectorAll("select[data-bcol]").forEach((s) => { s.onchange = () => { budget.colonne[s.dataset.bcol] = parseInt(s.value, 10); preparaRigheBudget(); renderBudget(); }; });
    const sf = el("budget-foglio"); if (sf) sf.onchange = () => { scegliFoglioBudget(parseInt(sf.value, 10)); renderBudget(); };

    box.querySelectorAll("input[data-briga]").forEach((cb) => { cb.onchange = () => { budget.righe[+cb.dataset.briga].attiva = cb.checked; renderBudget(); }; });

  }
  function applicaBudget() {
    const sc = stato.scenario;

    if (!p) {
      const id = `P${Date.now().toString(36)}`;
      p = { id, nome: `Budget · ${budget.file.replace(/\.(xlsx|csv|txt)$/i, "")}`.slice(0, 60), societa: "INTUR", acceso: false, stato: "ipotesi", pagamenti: [], contratti: [], livelli: livelliVuoti() };
      sc.progetti.push(p);

    }

    const L = p.livelli;
    const m = aggiungi(L.macro, nuovaMacro(L, budget.file.replace(/\.(xlsx|csv|txt)$/i, "").slice(0, 60)));

  }

  // ── Il fornitore come oggetto (brief UI, punto 8) ──
  // Un fornitore è un id scritto in «fornitore» dentro i pagamenti, più una scheda nella mappa dello scenario:
  // nome, codice Esolver, società, cartella Drive. L'anagrafica Esolver (D.fornitori) serve a riconoscere
  // il codice da un nome scritto a mano: proposta, mai imposta.
  const normNome = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9àèéìòù ]+/g, " ").replace(/\b(srl|srls|spa|snc|sas|stp|di|e|the|ditta|societa|società|con|socio|unico|a)\b/g, " ").replace(/\s+/g, " ").trim();
  function riconosci(nome) {
    const n = normNome(nome);
    if (n.length < 4) return null;

    const esatti = ana.filter((f) => normNome(f.nome) === n);
    if (esatti.length === 1) return esatti[0];
    const parziali = ana.filter((f) => { const m = normNome(f.nome); return m.length >= 5 && (m.includes(n) || n.includes(m)); });
    if (parziali.length === 1) return parziali[0];
    // «AMCN» contro «A.M.C.N. COSTRUZIONI»: le sigle si confrontano sul nome grezzo, senza punti né spazi
    const compat = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
    const c = compat(nome);

    return sigle.length === 1 ? sigle[0] : null;
  }
  const nomeEsolver = (codice) => ((D.fornitori || []).find((x) => String(x.codice) === String(codice)) || {}).nome || "";
  function fornitoriDelloScenario(sc) {
    const mappa = sc.fornitori || {};
    const usi = {};
    const vuoto = () => ({ progetti: new Set(), societa: new Set(), lordo: 0, lordoAcceso: 0, n: 0, mesi: [], documenti: 0 });
    sc.progetti.forEach((p) => p.pagamenti.forEach((g) => {
      const id = (g.fornitore_id || "").trim();
      if (!id) return;
      const u = usi[id] = usi[id] || vuoto();
      u.progetti.add(p.nome); u.societa.add(p.societa); u.n += 1; u.documenti += (g.documenti || []).length;
      for (const [m, v] of Object.entries(g.mesi)) { const l = MOTORE.iva(v, g.aliquota_iva); u.lordo += l; if (p.acceso) u.lordoAcceso += l; u.mesi.push(m); }
    }));

    return ids.map((id) => {
      const f = mappa[id] || {}, u = usi[id] || vuoto(), mesi = u.mesi.sort();

        proposto: f.codice_esolver ? null : riconosci(f.nome || id), progetti: [...u.progetti], n: u.n, lordo: u.lordo, lordoAcceso: u.lordoAcceso,
        primo: mesi[0] || null, ultimo: mesi[mesi.length - 1] || null, documenti: u.documenti, patti: f.patti || null };

  }
  // ── patti abituali del fornitore: la forma di «come paghi» senza mesi assoluti né totale ──
  // Si ricordano da un contratto scritto (i mesi diventano distanze dall'inizio) e si riapplicano a un

  const mesePiu = (m, k) => { const [a, mm] = m.split("-").map(Number); const t = (mm - 1) + k; return `${a + Math.floor(t / 12)}-${String(((t % 12) + 12) % 12 + 1).padStart(2, "0")}`; };
  const mesiFra = (a, b) => { const [ya, ma] = a.split("-").map(Number), [yb, mb] = b.split("-").map(Number); return (yb - ya) * 12 + (mb - ma); };
  const dentroOrizzonte = (m) => (D.mesi.includes(m) ? m : m < D.mesi[0] ? D.mesi[0] : D.mesi[D.mesi.length - 1]);
  function pattiDaContratto(c) {
    const perc = c.modo === "percentuali";
    const inizio = perc ? ((c.quote || []).map((q) => q.mese).sort()[0] || D.mesi[0]) : ((c.anticipo_pct ? c.anticipo_mese : c.sal_da) || c.sal_da || D.mesi[0]);
    const p = { modo: perc ? "percentuali" : "sal", aliquota_iva: c.aliquota_iva ?? 22 };
    if (perc) p.quote = (c.quote || []).map((q) => ({ pct: q.pct, dopo: mesiFra(inizio, q.mese) }));
    else Object.assign(p, { anticipo_pct: c.anticipo_pct || 0, anticipo_dopo: c.anticipo_pct ? mesiFra(inizio, c.anticipo_mese || inizio) : 0, sal_modo: c.sal_modo || "n", sal_n: c.sal_n || 1, sal_ogni: c.sal_ogni || 0, sal_passo: c.sal_passo || 1, sal_dopo: mesiFra(inizio, c.sal_da || inizio), ritenuta_pct: c.ritenuta_pct || 0, svincolo_dopo: c.ritenuta_pct ? mesiFra(inizio, c.svincolo_mese || inizio) : 0 });
    return p;
  }
  function contrattoDaPatti(p, inizio, fornitore, totale) {

    if (c.modo === "percentuali") c.quote = (p.quote || []).map((q) => ({ pct: q.pct, mese: dentroOrizzonte(mesePiu(inizio, q.dopo || 0)) }));
    else Object.assign(c, { anticipo_pct: p.anticipo_pct || 0, anticipo_mese: dentroOrizzonte(mesePiu(inizio, p.anticipo_dopo || 0)), ritenuta_pct: p.ritenuta_pct || 0, svincolo_mese: dentroOrizzonte(mesePiu(inizio, p.svincolo_dopo || 0)), sal_modo: p.sal_modo || "n", sal_n: p.sal_n || 1, sal_ogni: p.sal_ogni || 0, sal_da: dentroOrizzonte(mesePiu(inizio, p.sal_dopo || 0)), sal_passo: p.sal_passo || 1, quote: [] });

  function riassuntoPatti(p) {
