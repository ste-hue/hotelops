<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cassa · CdG</title>
<style>
:root{
  --bg:#faf9f6; --card:#ffffff; --ink:#1d1c1a; --muted:#6d6a64; --line:#e5e2db; --soft:#f1efe9;
  --accent:#1d5c87; --ok:#3f6b58; --warn:#a86400; --bad:#b3261e; --warn-bg:#fbf1dd; --bad-bg:#fbe6e3; --ok-bg:#e4efe9;
  --ipo:#ebe9e3; --base-line:#8d8a83;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151513; --card:#1d1d1a; --ink:#ecebe6; --muted:#9c988f; --line:#32312d; --soft:#252521;
  --accent:#7db7e0; --ok:#86b8a0; --warn:#e2a64a; --bad:#f08a80; --warn-bg:#3a2e17; --bad-bg:#3d201d; --ok-bg:#1f3a2e;
  --ipo:#23231f; --base-line:#7a776f;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow-x:hidden}
main{max-width:1180px;margin:0 auto;padding:22px 16px 56px}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0}
h2{font-size:16px;font-weight:620;margin:22px 0 8px}
h3{font-size:14px;font-weight:620;margin:12px 0 6px}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad)}
.griglia{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:22px;align-items:start}
@media (max-width:900px){.griglia{grid-template-columns:minmax(0,1fr);row-gap:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;overflow-x:auto}
.invalid{border-color:var(--bad);background:var(--bad-bg)}
.errore{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:13px}
.minimi{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:560px){.minimi{grid-template-columns:1fr}}
.minimi .saldo{font-size:26px;font-weight:650;margin:2px 0}
.minimi .delta{font-size:13px;color:var(--muted);white-space:normal}
.minimi ul{margin:6px 0 0;padding-left:16px;font-size:13px}
.badge{display:inline-block;white-space:nowrap;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--muted);margin-left:4px;vertical-align:middle}
.badge.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.conti{margin:8px 0 0;font-size:12px;color:var(--muted)}
.conti div{margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
tr.ipo td{background:var(--ipo)}
tr.mese{cursor:pointer}
tr.mese:hover td{background:var(--soft)}
tr.dett td{background:var(--soft);text-align:left;font-size:12px;padding:6px 8px 8px}
tr.dett ul{margin:0;padding-left:16px;columns:2;column-gap:18px}
@media (max-width:560px){th.ini,td.ini{display:none} table{font-size:12px} tr.dett ul{columns:1}}
svg.graf{width:100%;height:auto;display:block;margin-top:8px}
.leg{font-size:12px;color:var(--muted);margin-top:4px}
.leg span{display:inline-block;margin-right:12px}
.leg i{display:inline-block;width:18px;border-top:2px solid var(--accent);vertical-align:middle;margin-right:4px}
.leg i.base{border-top:2px dashed var(--base-line)}
.leg i.ipo{width:12px;height:10px;border:0;background:var(--ipo);border-radius:2px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%}
button{cursor:pointer;background:var(--soft)}
button.primario{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input.eur{width:110px;text-align:right}
input.n{width:56px;text-align:right}
input.nome{width:100%}
.leva{border-top:1px solid var(--line);padding:10px 0}
.leva:first-of-type{border-top:0}
.leva.spento{color:var(--muted)}
.leva.spento .pag{opacity:.75}
.leva header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.leva header .nome{flex:1 1 160px;font-weight:600}
.leva .riga{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px;font-size:13px}
.pag{margin:8px 0 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.pag-testa{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.pag-nome{font-weight:600;flex:1 1 160px}
.pag-tot{font-weight:600;white-space:nowrap}
.frase{font-size:13px;line-height:1.45;margin-top:3px}
details.sotto{margin-top:6px}
details.sotto>summary{font-size:12px;color:var(--accent)}
.contratto{margin:8px 0 12px;padding:12px 14px;border:1px solid var(--accent);border-radius:12px;background:var(--card)}
.c-testa{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.c-testa strong{font-size:14px}
.contratto .riga{margin-top:8px}
.contratto .quota{display:inline-flex;gap:4px;align-items:center;margin-right:8px}
.ok-t{color:var(--ok)}
.warn-t{color:var(--warn)}
.pag .mesi{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.pag .mesi label{font-size:11px;color:var(--muted);display:flex;flex-direction:column}
.pag .mesi input{width:92px;text-align:right;font-size:12px;padding:3px 5px}
.nota{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px}
.come{margin-top:6px}
.come .errore-r{color:var(--bad);font-size:12px;font-style:normal}
.limiti{margin-top:18px;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--ink)}
.limiti h2{margin:0 0 6px;color:var(--warn)}
.limiti ul{margin:0;padding-left:18px;font-size:13px}
.piccolo{font-size:12px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.canone{margin-top:14px;border-color:var(--accent)}
.canone .testa{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:space-between}
.canone .grande{font-size:22px;font-weight:650}
.canone .slider{display:flex;gap:10px;align-items:center;margin-top:8px}
.canone .slider input[type=range]{flex:1;min-width:120px;accent-color:var(--accent);padding:0;border:0;background:transparent}
.canone .slider input[type=range]:disabled{opacity:.4}
.canone details{margin-top:8px}
.canone details .riga{margin-top:8px}
button.mini{font-size:12px;padding:2px 7px}
.strumenti{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:8px;font-size:13px}
details.leva{border-top:1px solid var(--line);padding:6px 0}
details.leva:first-of-type{border-top:0}
details.leva summary{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;list-style:none;color:var(--ink);font-size:13px;padding:4px 0 4px 18px;position:relative}
details.leva summary::-webkit-details-marker{display:none}
details.leva summary::before{content:"";position:absolute;left:4px;top:11px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;width:6px;height:6px;transform:rotate(-45deg);transition:transform .15s}
details.leva[open] summary::before{transform:rotate(45deg);top:9px}
details.leva summary .nome{font-weight:600;flex:1 1 140px}
details.leva summary .tot{font-weight:600}
details.leva summary .peso{color:var(--muted)}
details.leva summary .peso.neg{color:var(--bad)}
details.leva summary .sw{display:inline-flex;align-items:center}
details.leva.spento summary .nome,details.leva.spento summary .tot{color:var(--muted);font-weight:500}
details.leva .corpo{padding:4px 0 6px 18px}
.minimi .oltre{font-size:12px;color:var(--muted);margin-top:4px}
.minimi .avviso{color:var(--bad);margin-top:2px}
.minimi details.dettagli{margin-top:6px}
.minimi details.dettagli>summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px}
.minimi details.dettagli>summary::-webkit-details-marker{display:none}
.minimi details.dettagli>summary::before{content:"▸";transition:transform .15s}
.minimi details.dettagli[open]>summary::before{transform:rotate(90deg)}
.minimi details.dettagli>summary:hover{color:var(--ink)}
.canone details.dettagli{margin-top:6px}
.canone details.dettagli>summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:4px}
.canone details.dettagli>summary::-webkit-details-marker{display:none}
.canone details.dettagli>summary::before{content:"▸";transition:transform .15s}
.canone details.dettagli[open]>summary::before{transform:rotate(90deg)}
.canone details.dettagli>summary:hover{color:var(--ink)}
.canone details.dettagli ul{margin:6px 0 0;padding-left:16px;line-height:1.5}
@media (prefers-reduced-motion: reduce){.minimi details.dettagli>summary::before,.canone details.dettagli>summary::before{transition:none}}
.fonti{margin-top:16px;font-size:13px;color:var(--muted)}
.fonti summary{font-weight:600;color:var(--ink)}
.fonti ul{margin:6px 0 0;padding-left:18px}
.fonti li{margin-top:3px}
td.vuoto{color:var(--muted)}
.cal-testa{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.cal-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px}
table.cal{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
table.cal th,table.cal td{padding:4px 3px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;min-width:58px}
table.cal th{font-weight:500;color:var(--muted)}
table.cal .voce{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;min-width:0;max-width:170px;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
table.cal .voce small{display:block;color:var(--muted);font-size:11px}
table.cal .ipo{background:var(--ipo)}
table.cal tr.gruppo td{background:var(--soft);font-weight:600;text-align:left;position:static}
table.cal tr.tot td{font-weight:600;font-variant-numeric:tabular-nums}
table.cal tr.tot.primo td{border-top:2px solid var(--line)}
table.cal td.min{color:var(--bad);font-weight:700}
table.cal tr.spento{opacity:.45}
.chip{display:inline-block;box-sizing:border-box;min-width:46px;min-height:24px;line-height:18px;padding:3px 7px;border-radius:999px;border:0;font-size:12px;font-variant-numeric:tabular-nums;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;color:var(--ink);background:color-mix(in srgb,var(--accent) var(--a),var(--card))}
.chip.entrata{background:color-mix(in srgb,var(--ok) var(--a),var(--card))}
.chip.fisso{cursor:default;background:var(--soft)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip.preso{opacity:.3}
td.bersaglio{box-shadow:inset 0 0 0 2px var(--accent);border-radius:8px}
td.puo{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.fantasma{position:fixed;left:0;top:0;margin:0;pointer-events:none;z-index:50;will-change:transform;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.chip.in-volo{visibility:hidden}
.minimi .saldo.cambiato,.barra-minimi .num.cambiato{animation:battito .7s ease-out}
@keyframes battito{0%{background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:6px}100%{background:transparent}}
.barra-minimi{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;gap:0;padding:0 max(8px,env(safe-area-inset-left)) 0 max(8px,env(safe-area-inset-right));background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.35) inset}
.barra-minimi[hidden]{display:none}
.barra-minimi button{flex:1;min-width:0;display:flex;gap:6px;align-items:baseline;justify-content:center;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;padding:7px 8px;border:0;border-radius:0;background:transparent;color:var(--ink);font-size:13px;line-height:1.2;cursor:pointer}
.barra-minimi button:active{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.barra-minimi .num{font-weight:650;font-size:15px}
.barra-minimi .num.neg{color:var(--bad)}
.barra-minimi .quando{color:var(--muted)}
.barra-minimi .delta{color:var(--muted);font-size:12px}
@media (max-width:560px){.barra-minimi .delta,.barra-minimi .quando{display:none}.barra-minimi .num{font-size:14px}}
html{scroll-padding-top:44px}
@media (prefers-reduced-transparency: reduce){.barra-minimi{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion: reduce){.minimi .saldo.cambiato,.barra-minimi .num.cambiato{animation:none;background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:6px}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:13px;z-index:60;max-width:92vw;display:flex;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast button{background:transparent;color:var(--bg);border-color:var(--bg);font-size:12px;padding:2px 8px}
@media (max-width:600px){table.cal .voce{max-width:104px;font-size:11px;padding-right:4px}table.cal th,table.cal td{min-width:50px;padding:4px 2px}.chip{min-width:40px;padding:3px 5px}}
details.blocco{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
details.blocco>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:11px 14px;min-height:24px}
details.blocco>summary::-webkit-details-marker{display:none}
details.blocco>summary::before{content:"▸";color:var(--muted);width:12px;transition:transform .15s}
details.blocco[open]>summary::before{transform:rotate(90deg)}
details.blocco>summary .b-t{font-weight:620}
details.blocco>summary .b-s{color:var(--muted);font-size:13px;flex:1 1 220px}
details.blocco>.dentro{padding:0 12px 12px}
details.blocco .card{border:0;padding:4px 2px}
.blocchi-cmd{display:flex;gap:6px;margin-top:10px}
.leg i.eff{width:12px;height:10px;border:0;background:var(--accent);opacity:.35;border-radius:2px}
</style>
</head>
<body>
<main>
<header>
  <h1>Cassa · ORTI e INTUR</h1>
  <p class="sub" id="sub"></p>
</header>
<div id="errore" class="errore" hidden></div>

<section class="minimi" id="minimi"></section>
<div id="barra-minimi" class="barra-minimi" hidden aria-label="Minimi di cassa, sempre visibili"></div>

<div class="blocchi-cmd"><button class="mini" id="apri-tutto">apri tutto</button><button class="mini" id="chiudi-tutto">chiudi tutto</button></div>
<details class="blocco" data-blocco="canone"><summary><span class="b-t">Canone ORTI → INTUR</span><span class="b-s" id="som-canone"></span></summary>
<div class="dentro"><section class="card canone" id="canone"></section></div>
</details>
<details class="blocco" data-blocco="calendario"><summary><span class="b-t">Calendario dei pagamenti</span><span class="b-s" id="som-calendario"></span></summary>
<div class="dentro"><section class="card" id="calendario"></section></div>
</details>
<div id="toast" class="toast" hidden></div>

<div class="griglia">
  <div>
<details class="blocco" data-blocco="saldo"><summary><span class="b-t">Saldo di fine mese</span><span class="b-s" id="som-saldo"></span></summary>
<div class="dentro"><div id="grafici"></div></div>
</details>
  </div>
  <aside>
<details class="blocco" data-blocco="leve"><summary><span class="b-t">Scenario e leve</span><span class="b-s" id="som-leve"></span></summary>
<div class="dentro"><div class="card" id="scenario"></div>
    <h2>Progetti</h2>
    <div class="card" id="progetti"></div>
    <h2>Finanziamenti</h2>
    <div class="card" id="finanziamenti"></div>
    <h2>Voci del PF corrette</h2>
    <div class="card" id="correzioni"></div></div>
</details>
  </aside>
</div>

<details class="blocco" data-blocco="tabelle"><summary><span class="b-t">Mese per mese, voce per voce</span><span class="b-s" id="som-tabelle"></span></summary>
<div class="dentro"><div id="tabelle"></div></div>
</details>
<details class="blocco" data-blocco="consolidato"><summary><span class="b-t">Consolidato</span><span class="b-s" id="som-consolidato"></span></summary>
<div class="dentro"><div class="card" id="consolidato"></div></div>
</details>
<details class="blocco" data-blocco="fatti"><summary><span class="b-t">Pagamenti registrati</span><span class="b-s" id="som-fatti"></span></summary>
<div class="dentro"><div id="fatti"></div></div>
</details>
<details class="blocco" data-blocco="limiti"><summary><span class="b-t">Limiti di questa pagina</span><span class="b-s" id="som-limiti"></span></summary>
<div class="dentro"><section class="limiti" id="limiti"></section></div>
</details>
<details class="fonti" id="fonti"></details>
</main>

<script type="application/json" id="dati">__DATA__</script>

<script id="motore">
// Porting di verticals/condges/cassa_motore.py: stessa sequenza di `calcola`,
// interi (centesimi) ovunque. Nessun formato, nessun round.
const MOTORE = (() => {
  const SOSTITUZIONE = "sostituzione";   // origine speciale delle manuali: al posto della voce PF di quel mese
  const ORIGINI = ["pf", "canone", "finanziamento", "progetto", "manuale", "fatto"];
  const SOCIETA = ["ORTI", "INTUR"];

  function iva(netto, aliquota) {
    return Math.floor((netto * (100 + aliquota) + 50) / 100);
  }

  function distribuisci(totale, da, n, mesi) {
    if (n < 1) throw new Error(`numero rate non valido: ${n}`);
    const i = mesi.indexOf(da);
    if (i < 0 || i + n > mesi.length) throw new Error(`oltre l'orizzonte: ${n} rate da ${da}`);
    // Math.floor = `//` di Python (coincide con trunc per importi positivi).
    const quota = Math.floor(totale / n);
    const out = {};
    for (let k = 0; k < n - 1; k++) out[mesi[i + k]] = quota;
    out[mesi[i + n - 1]] = totale - quota * (n - 1);
    return out;
  }

  function flussiCanone(s, mesi) {
    const out = [];
    const anni = Object.keys(s.netto_per_anno).map(Number).sort((a, b) => a - b);
    for (const anno of anni) {
      const netto = s.netto_per_anno[anno];
      const cal = Object.entries(s.calendario || {})
        .filter(([m]) => m.slice(0, 4) === String(anno))
        .sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
      let lordi;
      if (cal.length) {
        lordi = cal.map(([m, v]) => [m, iva(v, s.aliquota_iva)]);
      } else {
        const da = `${anno}-${s.da_mese.slice(5)}`;
        if (!mesi.includes(da)) continue;
        lordi = Object.entries(distribuisci(iva(netto, s.aliquota_iva), da, s.rate_n, mesi));
      }
      for (const [m, v] of lordi) {
        if (mesi.includes(m)) out.push({ nome: "Fitto Hotel (canone)", da: "ORTI", a: "INTUR", mese: m, importo: v, stato: "scenario" });
      }
    }
    return out;
  }

  function riconcilia(progetti, fatti) {
    progetti = JSON.parse(JSON.stringify(progetti));
    const perId = {};
    for (const p of progetti) perId[p.id] = p;
    const nonRic = [];
    for (const f of fatti) {
      const p = perId[f.progetto_id];
      const slot = [];
      for (const pag of (p ? p.pagamenti : [])) {
        if (f.fornitore_id != null && pag.fornitore_id === f.fornitore_id) {
          for (const m of Object.keys(pag.mesi)) slot.push({ m, pag });
        }
      }
      slot.sort((a, b) => (a.m < b.m ? -1 : a.m > b.m ? 1 : 0));
      if (!slot.length) { nonRic.push(f); continue; }
      let resto = f.importo;
      for (const { m, pag } of slot) {
        if (resto <= 0) break;
        const lordo = iva(pag.mesi[m], pag.aliquota_iva);
        const presa = Math.min(resto, lordo);
        resto -= presa;
        const k = 100 + pag.aliquota_iva;
        pag.mesi[m] = presa === lordo ? 0 : Math.floor(((lordo - presa) * 100 + Math.floor(k / 2)) / k);
      }
    }
    return [progetti, nonRic];
  }

  function zero() {
    const o = {};
    for (const k of ORIGINI) o[k] = 0;
    return o;
  }

  function somma(o) {
    let s = 0;
    for (const k of ORIGINI) s += o[k];
    return s;
  }

  function movimenti(inp, societa, mese) {
    const ent = zero(), usc = zero();
    const sc = inp.scenario;
    const add = (r) => {
      if (r.societa === societa && r.mese === mese) (r.direzione === "E" ? ent : usc)[r.origine === SOSTITUZIONE ? "pf" : r.origine] += r.importo;
    };
    for (const r of inp.pf) add(r);
    for (const r of sc.manuali) add(r);
    for (const f of inp.intercompany) {
      if (f.mese !== mese) continue;
      if (f.stato === "una_gamba") {
        if (SOCIETA.includes(f.da)) {
          if (f.da === societa) usc.canone += f.importo;
        } else if (f.a === societa) ent.canone += f.importo;
        continue;
      }
      if (f.a === societa) ent.canone += f.importo;
      if (f.da === societa) usc.canone += f.importo;
    }
    for (const fin of sc.finanziamenti) {
      if (fin.societa === societa) {
        ent.finanziamento += fin.erogazioni[mese] || 0;
        usc.finanziamento += fin.rate[mese] || 0;
      }
    }
    for (const p of sc.progetti) {
      if (p.acceso && p.societa === societa) {
        for (const pag of p.pagamenti) usc.progetto += iva(pag.mesi[mese] || 0, pag.aliquota_iva);
      }
    }
    for (const f of inp.fatti) {
      if (f.societa === societa && f.mese === mese) usc.fatto += f.importo;
    }
    return [ent, usc];
  }

  // Scenario = la parte `scenario` del documento cdg-cassa-scenario/1 (manuali con importo_cent).
  function normalizza(scenario) {
    const sc = JSON.parse(JSON.stringify(scenario));
    sc.progetti = sc.progetti || [];
    sc.finanziamenti = sc.finanziamenti || [];
    sc.canone = sc.canone || null;
    sc.soglia = sc.soglia || 0;
    sc.manuali = (sc.manuali || []).map((r) => ({
      societa: r.societa, voce_id: r.voce_id, mese: r.mese,
      importo: r.importo_cent !== undefined ? r.importo_cent : r.importo,
      direzione: r.direzione, origine: r.origine === SOSTITUZIONE ? SOSTITUZIONE : "manuale",
    }));
    return sc;
  }

  function calcola(payload, scenario) {
    const sc = normalizza(scenario);
    const conFin = new Set(sc.finanziamenti.map((f) => f.societa));
    let pf = payload.pf.filter((r) => !(r.voce_id === "ENTRATE_FINANZIAMENTI" && conFin.has(r.societa)));
    // Una riga manuale con origine «sostituzione» prende il posto della voce PF di quel mese.
    const sost = new Set(sc.manuali.filter((r) => r.origine === SOSTITUZIONE).map((r) => `${r.societa}|${r.voce_id}|${r.mese}`));
    if (sost.size) pf = pf.filter((r) => !sost.has(`${r.societa}|${r.voce_id}|${r.mese}`));
    let interc = payload.intercompany;
    if (sc.canone) {
      const nuovi = flussiCanone(sc.canone, payload.mesi);
      const anni = new Set(nuovi.map((f) => f.mese.slice(0, 4)));
      interc = interc.filter((f) => !(f.nome.startsWith("Fitto Hotel") && anni.has(f.mese.slice(0, 4)))).concat(nuovi);
    }
    const [progetti, nonRic] = riconcilia(sc.progetti, payload.fatti);
    const ipo = new Set(payload.mesi_ipotetici);
    const inp = { mesi: payload.mesi, ancore: payload.ancore, pf, intercompany: interc, fatti: payload.fatti, scenario: { ...sc, progetti } };

    const righe = [];
    for (const soc of SOCIETA) {
      let saldo = inp.ancore[soc].saldo;
      for (const mese of inp.mesi) {
        const [ent, usc] = movimenti(inp, soc, mese);
        const fin = saldo + somma(ent) - somma(usc);
        righe.push({ mese, societa: soc, ini: saldo, entrate: ent, uscite: usc, fin });
        saldo = fin;
      }
    }

    const primoMin = (rs) => rs.reduce((m, r) => (r.fin < m.fin ? r : m));
    const minimi = {};
    for (const soc of SOCIETA) {
      const mie = righe.filter((r) => r.societa === soc);
      const pfR = mie.filter((r) => !ipo.has(r.mese));
      const coda = mie.filter((r) => ipo.has(r.mese));
      const m = primoMin(pfR.length ? pfR : coda);
      const c = coda.length ? primoMin(coda) : null;
      minimi[soc] = {
        mese: m.mese, saldo: m.fin,
        sotto_soglia: pfR.filter((r) => r.fin < sc.soglia).map((r) => r.mese),
        coda_mese: c ? c.mese : null, coda_saldo: c ? c.fin : null,
      };
    }

    const consolidato = [];
    for (const mese of inp.mesi) {
      const fl = inp.intercompany.filter((f) => f.mese === mese && SOCIETA.includes(f.da) && SOCIETA.includes(f.a));
      const flTutti = inp.intercompany.filter((f) => f.mese === mese);
      consolidato.push({
        mese,
        saldo: righe.filter((r) => r.mese === mese).reduce((s, r) => s + r.fin, 0),
        intercompany_nettato: fl.filter((f) => f.stato !== "una_gamba").reduce((s, f) => s + f.importo, 0),
        residuo: flTutti.filter((f) => f.stato === "una_gamba").reduce((s, f) => s + f.importo, 0),
      });
    }
    return { righe, minimi, consolidato, non_riconciliati: nonRic };
  }

  return { ORIGINI, SOCIETA, SOSTITUZIONE, calcola, distribuisci, iva, flussiCanone, riconcilia, normalizza };
})();
if (typeof module !== "undefined") module.exports = MOTORE;
</script>

<script id="formato">
// Formato e lettura degli importi: l'euro esiste solo qui, dentro e fuori centesimi interi.
const FORMATO = (() => {
  function fmt(cent, conCent = true) {
    const neg = cent < 0;
    const a = Math.abs(cent);
    const e = Math.floor(a / 100), c = a % 100;
    const s = String(e).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "−" : "") + s + (conCent ? "," + String(c).padStart(2, "0") : "");
  }
  // "1.234,56" / "1234.56" / "1.234" -> centesimi; "" -> 0; testo non valido -> null.
  function parseEuro(txt) {
    let s = String(txt || "").replace(/[\s€]/g, "");
    if (!s) return 0;
    const neg = /^[-−]/.test(s);
    s = s.replace(/^[-−]/, "");
    const lc = s.lastIndexOf(","), lp = s.lastIndexOf(".");
    const sep = Math.max(lc, lp);
    let intero = s, dec = "";
    if (sep >= 0) {
      const coda = s.slice(sep + 1);
      // Con entrambi i separatori l'ultimo è il decimale; con uno solo, 3 cifre dopo = migliaia.
      if ((lc >= 0 && lp >= 0) || coda.length <= 2) { dec = coda; intero = s.slice(0, sep); }
    }
    intero = intero.replace(/[.,]/g, "");
    if (!/^\d+$/.test(intero) || !/^\d{0,2}$/.test(dec)) return null;
    const cent = parseInt(intero, 10) * 100 + parseInt((dec + "00").slice(0, 2), 10);
    return neg ? -cent : cent;
  }
  function calendarioTesto(cal) {
    return Object.entries(cal || {})
      .sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0))
      .map(([m, v]) => `${m}=${fmt(v)}`).join("; ");
  }
  // "2027-03=200.000,00; 2027-06=300.000,00" -> {mese: cent}; {} se vuoto; null se una parte non è valida.
  function calendarioParse(txt) {
    const cal = {};
    for (const parte of String(txt || "").split(";")) {
      if (!parte.trim()) continue;
      const [m, v] = parte.split("=").map((s) => (s || "").trim());
      const cent = parseEuro(v);
      if (!/^\d{4}-\d{2}$/.test(m) || cent === null) return null;
      cal[m] = cent;
    }
    return cal;
  }
  // Lordo IVA inclusa -> netto, in centesimi interi: il netto più piccolo la cui IVA (come nel motore,
  // floor((netto*k + 50)/100)) arriva al lordo. Se il lordo è raggiungibile, iva(netto) lo ridà esatto.
  function nettoDaLordo(lordo, aliquota) {
    const k = 100 + aliquota;
    return Math.max(0, Math.floor((lordo * 100 - 50 + k - 1) / k));
  }
  // a*b/c arrotondato a metà in su, su interi non negativi, senza passare dai float.
  const mulDiv = (a, b, c) => Number((BigInt(a) * BigInt(b) * 2n + BigInt(c)) / (2n * BigInt(c)));
  // Rate lorde di riferimento {mese: lordo} scalate a un nuovo annuo lordo -> {mese: netto}.
  // Si scala in lordo perché il lordo è quello che si legge: un annuo tondo dà rate tonde.
  // Per ogni anno il totale lordo si fissa prima, e l'ultima rata dell'anno prende il resto dei centesimi.
  function scalaRate(rateLorde, lordoAnnuo, lordoRif, aliquota) {
    const cal = {};
    if (!lordoRif) return cal;
    const perAnno = {};
    for (const m of Object.keys(rateLorde).sort()) (perAnno[m.slice(0, 4)] = perAnno[m.slice(0, 4)] || []).push(m);
    for (const mesi of Object.values(perAnno)) {
      let resto = mulDiv(mesi.reduce((t, m) => t + rateLorde[m], 0), lordoAnnuo, lordoRif);
      mesi.forEach((m, i) => {
        const l = i === mesi.length - 1 ? Math.max(0, resto) : mulDiv(rateLorde[m], lordoAnnuo, lordoRif);
        resto -= l;
        cal[m] = nettoDaLordo(l, aliquota);
      });
    }
    return cal;
  }
  // Annuo lordo implicito: lordi dello scenario / lordi di riferimento × annuo lordo di riferimento.
  const annuoDaLordi = (lordiScenario, lordiBase, lordoRif) => (lordiBase ? mulDiv(lordiScenario, lordoRif, lordiBase) : lordiScenario);
  const MESI_IT = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
  const meseIt = (m) => `${MESI_IT[parseInt(m.slice(5), 10) - 1]} ${m.slice(2, 4)}`;
  const ordinati = (mesi) => Object.keys(mesi).sort();

  // Rateizza `totale` in n rate, una ogni `passo` mesi a partire da `da`, dentro l'orizzonte `orizzonte`.
  // Stessa regola di MOTORE.distribuisci: quote uguali, il resto dei centesimi sull'ultima.
  // I mesi delle n rate, una ogni `passo` mesi da `da`; errore leggibile se si esce dall'orizzonte.
  function mesiRate(da, n, passo, orizzonte) {
    if (!(n >= 1)) throw new Error(`numero di rate non valido: ${n}`);
    if (!(passo >= 1)) throw new Error(`cadenza non valida: ${passo}`);
    const i = orizzonte.indexOf(da);
    if (i < 0) throw new Error(`mese di partenza fuori dall'orizzonte: ${da}`);
    const j = i + (n - 1) * passo;
    if (j >= orizzonte.length) {
      const [a, m] = orizzonte[i].split("-").map(Number);
      const t = (m - 1) + (n - 1) * passo;
      const cade = `${a + Math.floor(t / 12)}-${String((t % 12) + 1).padStart(2, "0")}`;
      throw new Error(`l'ultima rata cadrebbe a ${meseIt(cade)}, oltre l'orizzonte che finisce a ${meseIt(orizzonte[orizzonte.length - 1])}`);
    }
    return Array.from({ length: n }, (_, k) => orizzonte[i + k * passo]);
  }
  function spalma(totale, da, n, passo, orizzonte) {
    const mesi = mesiRate(da, n, passo, orizzonte);
    const quota = Math.floor(totale / n);
    const out = {};
    mesi.forEach((m, k) => { out[m] = k === n - 1 ? totale - quota * (n - 1) : quota; });
    return out;
  }

  // ── contratti: dai patti (anticipo, SAL, ritenuta, o quote %) ai pagamenti ──
  const pctTesto = (x) => String(x).replace(".", ",");
  const bp = (pct) => Math.round(Number(pct) * 100);            // percentuale in punti base, intera
  const diPct = (totale, pct) => Math.round((totale * bp(pct)) / 10000);
  // Genera i pagamenti verso il fornitore del contratto. L'ultima quota prende sempre il resto:
  // la somma dei pagamenti è il totale del contratto al centesimo.
  function pagamentiDaContratto(c, orizzonte) {
    const F = String(c.fornitore || "").trim();
    if (!F) throw new Error("serve il fornitore: i pagamenti generati si riconoscono da lì");
    const T = c.totale;
    if (!(Number.isInteger(T) && T > 0)) throw new Error("serve il totale del contratto");
    const pag = (nome, mesi) => ({ nome: `${F} · ${nome}`, mesi, aliquota_iva: c.aliquota_iva, stato: c.stato || "contratto", fornitore_id: F });
    const dentro = (m, cosa) => { if (!orizzonte.includes(m)) throw new Error(`${cosa}: ${m ? meseIt(m) : "mese mancante"} fuori dall'orizzonte`); };
    if (c.modo === "percentuali") {
      const quote = c.quote || [];
      const somma = quote.reduce((t, q) => t + bp(q.pct), 0);
      if (somma !== 10000) throw new Error(`le percentuali fanno ${pctTesto(somma / 100)}%, devono fare 100%`);
      const mesi = {};
      let resto = T;
      quote.forEach((q, k) => {
        dentro(q.mese, `quota ${pctTesto(q.pct)}%`);
        const v = k === quote.length - 1 ? resto : diPct(T, q.pct);
        resto -= v;
        mesi[q.mese] = (mesi[q.mese] || 0) + v;
      });
      return [pag("a percentuali", mesi)];
    }
    const a = Number(c.anticipo_pct) || 0, r = Number(c.ritenuta_pct) || 0;
    if (a < 0 || r < 0 || bp(a) + bp(r) >= 10000) throw new Error(`anticipo ${pctTesto(a)}% e ritenuta ${pctTesto(r)}% insieme devono restare sotto il 100%`);
    const A = diPct(T, a), R = diPct(T, r), S = T - A - R;
    const out = [];
    if (A) { dentro(c.anticipo_mese, "anticipo"); out.push(pag(`anticipo ${pctTesto(a)}%`, { [c.anticipo_mese]: A })); }
    if (c.sal_modo === "ogni") {
      const X = c.sal_ogni;
      if (!(Number.isInteger(X) && X > 0)) throw new Error("serve l'importo di lavori per ogni SAL");
      const n = Math.ceil(T / X);
      const q = X - diPct(X, a) - diPct(X, r);
      const mesi = {};
      mesiRate(c.sal_da, n, c.sal_passo || 1, orizzonte).forEach((m, k) => { mesi[m] = k === n - 1 ? S - q * (n - 1) : q; });
      out.push(pag("SAL", mesi));
    } else {
      out.push(pag("SAL", spalma(S, c.sal_da, c.sal_n, c.sal_passo || 1, orizzonte)));
    }
    if (R) { dentro(c.svincolo_mese, "svincolo della ritenuta"); out.push(pag(`svincolo ritenuta ${pctTesto(r)}%`, { [c.svincolo_mese]: R })); }
    return out;
  }
  // Ricostruisce un contratto dai pagamenti già presenti verso F: un pagamento «anticipo N%» e uno
  // «ritenuta N%» (una rata ciascuno), il resto sono SAL. Serve a partire da quello che c'è.
  function contrattoDaPagamenti(pagamenti, F, orizzonte) {
    const suoi = pagamenti.filter((g) => g.fornitore_id === F);
    const tot = (g) => Object.values(g.mesi).reduce((t, v) => t + v, 0);
    const pct = (g, parola) => {
      const m = new RegExp(`${parola}\\s*(\\d+(?:[.,]\\d+)?)\\s*%`, "i").exec(g.nome);
      return m && Object.keys(g.mesi).length === 1 ? Number(m[1].replace(",", ".")) : null;
    };
    const ant = suoi.find((g) => pct(g, "anticipo") !== null);
    const rit = suoi.find((g) => g !== ant && pct(g, "ritenuta") !== null);
    const sal = suoi.filter((g) => g !== ant && g !== rit);
    const salMesi = {};
    for (const g of sal) for (const [m, v] of Object.entries(g.mesi)) salMesi[m] = (salMesi[m] || 0) + v;
    const f = formaRate(salMesi, orizzonte);
    const primo = ordinati(Object.assign({}, ...suoi.map((g) => g.mesi)))[0] || orizzonte[0];
    return {
      fornitore: F, totale: suoi.reduce((t, g) => t + tot(g), 0), aliquota_iva: suoi.length ? suoi[0].aliquota_iva : 22,
      stato: suoi.length ? suoi[0].stato : "contratto", modo: "sal",
      anticipo_pct: ant ? pct(ant, "anticipo") : 0, anticipo_mese: ant ? Object.keys(ant.mesi)[0] : primo,
      ritenuta_pct: rit ? pct(rit, "ritenuta") : 0, svincolo_mese: rit ? Object.keys(rit.mesi)[0] : orizzonte[orizzonte.length - 1],
      sal_modo: "n", sal_n: Math.max(1, f.n), sal_ogni: 0, sal_da: f.primo || primo, sal_passo: f.passo || 1, quote: [],
    };
  }
  // Sposta tutte le rate di `delta` mesi, importi e totale invariati.
  function sposta(mesi, delta, orizzonte) {
    const out = {};
    for (const m of ordinati(mesi)) {
      const i = orizzonte.indexOf(m) + delta;
      if (orizzonte.indexOf(m) < 0 || i < 0 || i >= orizzonte.length) throw new Error(`non si sposta: ${meseIt(m)} uscirebbe dall'orizzonte`);
      out[orizzonte[i]] = mesi[m];
    }
    return out;
  }
  // Calendario: la rata del mese `da` va nel mese `a` (si somma se lì c'è già una rata). Totale invariato.
  function spostaRata(mesi, da, a) {
    if (!(da in mesi) || da === a) return { ...mesi };
    const out = { ...mesi };
    const v = out[da];
    delete out[da];
    out[a] = (out[a] || 0) + v;
    return out;
  }
  // Come si paga: numero di rate, prima e ultima, cadenza se costante, quota se uguale (resto sull'ultima).
  function formaRate(mesi, orizzonte) {
    const ch = ordinati(mesi);
    const totale = ch.reduce((t, m) => t + mesi[m], 0);
    if (!ch.length) return { n: 0, primo: null, ultimo: null, passo: null, quota: null, totale };
    const idx = ch.map((m) => orizzonte.indexOf(m));
    const salti = idx.slice(1).map((v, k) => v - idx[k]);
    const passo = idx.every((v) => v >= 0) && salti.every((d) => d === (salti[0] || 1)) ? salti[0] || 1 : null;
    const q = mesi[ch[0]];
    const quota = ch.slice(0, -1).every((m) => mesi[m] === q) && mesi[ch[ch.length - 1]] - q >= 0 && mesi[ch[ch.length - 1]] - q < ch.length ? q : null;
    return { n: ch.length, primo: ch[0], ultimo: ch[ch.length - 1], passo, quota, totale };
  }
  // Legge un documento esportato dalla pagina (o da `hotelops cdg scenario`): {nome, base, scenario} o {errore}.
  function leggiDocumento(testo, schema) {
    let doc;
    try { doc = JSON.parse(testo); } catch (e) { return { errore: "il file non è JSON leggibile" }; }
    if (!doc || doc.schema !== schema) return { errore: `schema ${doc && doc.schema !== undefined ? doc.schema : "assente"} diverso da ${schema}` };
    const sc = doc.scenario;
    if (!sc || !Array.isArray(sc.progetti) || !Array.isArray(sc.finanziamenti)) return { errore: "manca lo scenario (progetti e finanziamenti)" };
    const mesiOk = (o, dove) => {
      for (const [m, v] of Object.entries(o || {})) {
        if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(m)) return `${dove}: mese ${m} non valido (serve AAAA-MM)`;
        if (!Number.isInteger(v)) return `${dove}: importo di ${m} non in centesimi interi`;
      }
      return null;
    };
    for (const p of sc.progetti) {
      if (!p.id || !p.nome) return { errore: "un progetto non ha id o nome" };
      const nomi = new Set();
      for (const g of p.pagamenti || []) {
        if (nomi.has(g.nome)) return { errore: `${p.nome}: pagamento «${g.nome}» duplicato` };
        nomi.add(g.nome);
        const e = mesiOk(g.mesi, `${p.nome} · ${g.nome}`);
        if (e) return { errore: e };
      }
    }
    for (const f of sc.finanziamenti) {
      const e = mesiOk(f.erogazioni, `${f.nome} · erogazioni`) || mesiOk(f.rate, `${f.nome} · rate`);
      if (e) return { errore: e };
    }
    return { nome: doc.nome || sc.nome || "importato", base: doc.base || {}, scenario: sc, salvato_il: doc.salvato_il || null };
  }
  return { fmt, parseEuro, calendarioTesto, calendarioParse, nettoDaLordo, scalaRate, annuoDaLordi, meseIt, spalma, sposta, formaRate, leggiDocumento, pagamentiDaContratto, contrattoDaPagamenti, spostaRata };
})();
if (typeof module !== "undefined") module.exports = FORMATO;
</script>

<script id="app">
(() => {
  const D = JSON.parse(document.getElementById("dati").textContent);
  const SOC = MOTORE.SOCIETA;
  const IPO = new Set(D.mesi_ipotetici);
  const MESI_PF = D.mesi.filter((m) => !IPO.has(m));
  const ULTIMO_PF = MESI_PF[MESI_PF.length - 1];
  const ULTIMO = D.mesi[D.mesi.length - 1];
  const { fmt, parseEuro, calendarioTesto, calendarioParse, nettoDaLordo, scalaRate, annuoDaLordi } = FORMATO;
  // Legge un campo euro: null = non valido (campo marcato, stato invariato).
  const euroDa = (inp) => { const v = parseEuro(inp.value); inp.classList.toggle("invalid", v === null); return v; };
  // Nome del PF senza il prefisso del file temporaneo del promote (solo a video: `base` resta com'è).
  const nomeFile = (s) => String(s).replace(/^hotelops_raw_.*?(?=[A-Z]{2,}_)/, "");
  const meseIt = FORMATO.meseIt;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const copia = (o) => JSON.parse(JSON.stringify(o));
  const el = (id) => document.getElementById(id);
  // Prima di SOGLIA_PRESA px di movimento un tocco su una rata non è un trascinamento: può essere
  // uno scorrimento della pagina. Chi ha chiesto movimento ridotto non vede voli né battiti animati.
  const SOGLIA_PRESA = 8;
  const ridotto = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  const etichetta = (v) => v.replace(/^(ENTRATE|USCITE)_/, "").toLowerCase().replace(/_/g, " ");
  const oraDi = (iso) => (iso ? String(iso).replace("T", " ").slice(0, 16) : "");
  const segno = (v, conCent = true) => (v > 0 ? "+" : "") + fmt(v, conCent);
  const somma = (o) => Object.values(o).reduce((a, b) => a + b, 0);
  const periodoDi = (mesi) => { const k = Object.keys(mesi).sort(); return k.length ? (k.length === 1 ? meseIt(k[0]) : `${meseIt(k[0])} – ${meseIt(k[k.length - 1])}`) : "nessun mese"; };
  const badgeStato = (s) => (/contratto|tua/.test(s) ? "ok" : /verificare|decidere/.test(s) ? "warn" : /fuori/.test(s) ? "bad" : "");
  const statoIt = (s) => esc(String(s).replace(/_/g, " "));
  const dataIt = (iso) => (/^\d{4}-\d{2}-\d{2}/.test(String(iso)) ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : esc(iso));

  // ── stato ──
  // origine = lo scenario com'era quando è stato aperto: se cambia, uscendo resta nel menu come bozza.
  let stato = { nome: D.seme.nome, scenario: copia(D.seme.scenario), origine: JSON.stringify(D.seme.scenario) };
  let ris = null;
  const aperti = new Set();   // righe della tabella aperte (società|mese)
  const aperte = new Set();   // tendine aperte: "canone", "p:<id>", "f:<id>"

  function mostraErrore(msg) {
    const e = el("errore");
    e.textContent = msg;
    e.hidden = !msg;
  }

  function calcolaSicuro(scenario) {
    try { return MOTORE.calcola(D, scenario); } catch (e) { return null; }
  }

  function ricalcola(opts = {}) {
    try {
      ris = MOTORE.calcola(D, stato.scenario);
    } catch (e) {
      mostraErrore(`Scenario non calcolabile: ${e.message}`);
      return;
    }
    mostraErrore("");
    render(opts);
  }

  const vuoto = () => ({ nome: "Nessuna leva", scenario: { nome: "Nessuna leva", soglia: 0, canone: null, progetti: [], finanziamenti: [], manuali: [] } });

  // Lo stato aperto/chiuso delle tendine si legge dal DOM prima di ridisegnare:
  // l'evento toggle arriva in ritardo e un re-render in mezzo le richiuderebbe.
  function sincronizzaAperte() {
    document.querySelectorAll("details.leva[data-k], details.sotto[data-k], details.dettagli[data-k], #canone-dett").forEach((d) => {
      const k = d.id === "canone-dett" ? "canone" : d.dataset.k;
      d.open ? aperte.add(k) : aperte.delete(k);
    });
  }

  // Effetto delle leve fuori dal PF: delta a fine orizzonte meno delta all'ultimo mese PF.
  function effettoOltrePF(soc, r = ris) {
    const rs = r.righe.filter((x) => x.societa === soc), bs = D.baseline.righe.filter((x) => x.societa === soc);
    const i = D.mesi.indexOf(ULTIMO_PF), n = D.mesi.length - 1;
    return (rs[n].fin - bs[n].fin) - (rs[i].fin - bs[i].fin);
  }

  // ── testa, fonti e scenari ──
  function renderTesta() {
    const basi = SOC.map((s) => `${s}: ${D.base[s] ? nomeFile(D.base[s].file_sorgente) : "—"}`).join(" · ");
    const anc = Object.values(D.ancore)[0];
    // Corta: chi vuole i file e le ore li trova in «Fonti e versioni».
    el("sub").textContent = `saldi al ${anc ? dataIt(anc.data) : "—"} · pagina del ${oraDi(D.generato_il)}`;
  }

  function renderScenario() {
    const sel = document.createElement("select");
    const tutti = [{ ...D.seme, _k: "seme", _e: `${D.seme.nome} · seme` }, { ...vuoto(), compatibile: true, _k: "vuoto", _e: "Solo PF, nessuna leva" },
      ...D.scenari.map((s, i) => ({ ...s, _k: String(i), _e: s._etichetta || `${s.nome} · salvato ${oraDi(s.salvato_il)}` }))];
    el("scenario").innerHTML = `<div class="strumenti" style="margin-top:0"><label class="piccolo">Scenario <select id="sel-scenari"></select></label>
      <input type="text" id="nome-scenario" class="nome" style="width:180px" placeholder="nome scenario">
      <label class="piccolo">Soglia € <input type="text" class="eur" id="soglia"></label>
      <button id="esporta" class="primario">Esporta scenario</button>
      <button id="importa">Importa scenario</button><input type="file" id="importa-file" accept=".json,application/json" hidden>
      <button id="nessuna" title="le modifiche restano nel menu come bozza">Vedi solo PF</button></div>`;
    const s0 = el("sel-scenari");
    for (const s of tutti) {
      const o = document.createElement("option");
      o.value = s._k;
      o.textContent = s._e + (s.compatibile ? "" : " · base diversa");
      s0.appendChild(o);
    }
    s0.value = stato.chiave || "seme";
    s0.onchange = () => apriScenario(s0.value);
    el("nome-scenario").value = stato.nome;
    el("nome-scenario").oninput = (e) => { stato.nome = e.target.value; stato.scenario.nome = e.target.value; };
    el("soglia").value = fmt(stato.scenario.soglia || 0, false);
    el("soglia").onchange = (e) => { const v = euroDa(e.target); if (v === null) return; stato.scenario.soglia = v; ricalcola(); };
    el("esporta").onclick = esporta;
    el("nessuna").onclick = () => apriScenario("vuoto");
    el("importa").onclick = () => el("importa-file").click();
    el("importa-file").onchange = async (e) => {
      const file = e.target.files[0];
      e.target.value = "";
      if (!file) return;
      const r = FORMATO.leggiDocumento(await file.text(), D.schema);
      if (r.errore) { mostraErrore(`Importa «${file.name}»: ${r.errore}`); return; }
      const compatibile = SOC.every((x) => ((r.base[x] || {}).raw_object_id || null) === ((D.base[x] || {}).raw_object_id || null));
      D.scenari.push({ nome: r.nome, salvato_il: r.salvato_il, scenario: r.scenario, compatibile, _etichetta: `${r.nome} · importato da ${file.name}` });
      apriScenario(String(D.scenari.length - 1));
    };
  }

  // Apre uno scenario del menu. Se quello corrente è stato modificato, resta nel menu come bozza.
  function apriScenario(chiave) {
    const s = chiave === "seme" ? D.seme : chiave === "vuoto" ? vuoto() : D.scenari[parseInt(chiave, 10)];
    if (JSON.stringify(stato.scenario) !== stato.origine) {
      D.scenari.push({ nome: stato.nome, salvato_il: new Date().toISOString(), scenario: copia(stato.scenario), compatibile: true,
        _etichetta: `${stato.nome} · bozza delle ${new Date().toTimeString().slice(0, 5)}, non esportata` });
    }
    stato = { nome: s.nome, scenario: copia(s.scenario), origine: JSON.stringify(s.scenario), chiave };
    aperti.clear();
    renderScenario();
    ricalcola();
  }

  function esporta() {
    const doc = { schema: D.schema, nome: stato.nome, salvato_il: new Date().toISOString(), base: D.base, scenario: { ...stato.scenario, nome: stato.nome } };
    const blob = new Blob([JSON.stringify(doc, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `cassa-scenario-${(stato.nome || "scenario").replace(/[^\w.-]+/g, "_")}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  function renderFonti() {
    const basi = SOC.map((s) => D.base[s] ? `<li>PF ${s}: <code>${esc(nomeFile(D.base[s].file_sorgente))}</code>, caricato il ${esc(String(D.base[s].data_caricamento).slice(0, 16))}</li>` : `<li>PF ${s}: assente</li>`).join("");
    const ancore = SOC.map((s) => {
      const a = D.ancore[s];
      if (!a) return "";
      const conti = Object.entries(a.conti).map(([banca, c]) => `<li>${esc(banca)} <span class="num">${fmt(c.saldo)}</span> <span class="badge ${c.attestato ? "ok" : "warn"}">${c.attestato ? "attestato" : "dichiarato"}</span> ${esc(c.motivo)}</li>`).join("");
      return `<li>Ancora ${s} al ${dataIt(a.data)}: <span class="num">${fmt(a.saldo)}</span> <span class="badge ${a.attestato ? "ok" : "warn"}">${a.attestato ? "attestata" : "dichiarata"}</span><ul>${conti}</ul></li>`;
    }).join("");
    const nascosti = D.scenari_sostituiti.length ? ` Nascosti perché hanno lo stesso nome del seme: ${D.scenari_sostituiti.map((s) => `${esc(s.nome)} (${oraDi(s.salvato_il)})`).join(", ")}.` : "";
    el("fonti").innerHTML = `<summary>Fonti e versioni</summary><ul>${basi}${ancore}
      <li>Fonti lette da BigQuery il ${oraDi(D.acquisito_il) || "—"} · pagina generata il ${oraDi(D.generato_il)}</li>
      <li>Seme «${esc(D.seme.nome)}» dal file locale, salvato il ${oraDi(D.seme.salvato_il)}${D.seme.compatibile ? "" : " (base PF diversa)"}</li>
      <li>Scenari salvati su BigQuery nel menu: ${D.scenari.length}.${nascosti}</li>
      ${CONTR ? `<li>Contratto del canone: ${esc(CONTR.fonte)}</li>` : ""}
      <li>Canone di riferimento: ${CR.dichiarato ? `${fmt(CR.lordo_annuo, false)} € lordo/anno IVA inclusa (${fmt(CR.netto_annuo, false)} netto) dichiarato il ${esc(CR.dichiarato_il || "—")} — ${esc(CR.fonte)}` : esc(CR.fonte)}</li>
      <li>Mesi senza PF: ${D.mesi_ipotetici.length ? `${meseIt(D.mesi_ipotetici[0])} – ${meseIt(ULTIMO)}` : "nessuno"} (il PF finisce a ${meseIt(ULTIMO_PF)})</li></ul>`;
  }

  // ── canone: lo slider parte dal PF ──
  // Canone di riferimento: l'annuo è DICHIARATO (file canone_dichiarato.json), le rate nell'orizzonte
  // sono quelle del PF. Lo slider muove l'annuo e scala le rate PF nell'orizzonte in proporzione.
  // Slider e campo sono in LORDO IVA inclusa (è cassa); il motore resta in netto + aliquota.
  const CR = D.canone_rif || { dichiarato: false, netto_annuo: 0, lordo_annuo: 0, aliquota_iva: 22, rate_pf: {}, fonte: "", rate_orizzonte: [], netto_pf_orizzonte: 0 };
  const RATE_ORIZ = CR.rate_orizzonte.filter((r) => D.mesi.includes(r.mese));
  const CONTR = CR.contratto || null;   // {rate_mese: {"06": netto, ...}, fonte}
  // Rate LORDE del contratto nei mesi dell'orizzonte (anche oltre il PF: lì contano come effetto leve).
  const rateLordeContratto = () => {
    const cal = {};
    if (!CONTR) return cal;
    for (const m of D.mesi) {
      const q = CONTR.rate_mese[m.slice(5, 7)];
      if (q !== undefined) cal[m] = MOTORE.iva(q, CR.aliquota_iva);
    }
    return cal;
  };
  const ANNO = RATE_ORIZ.length ? Number(RATE_ORIZ[0].mese.slice(0, 4)) : Number(ULTIMO_PF.slice(0, 4));
  const MAX_SLIDER = Math.max(30000000, Math.ceil((CR.netto_annuo * 2) / 10000000) * 10000000);
  const dellAnno = (cal) => Object.fromEntries(Object.entries(cal).filter(([m]) => m.slice(0, 4) === String(ANNO)));
  // Rate lorde del PF nell'orizzonte per l'anno di riferimento.
  const rateLordePf = () => Object.fromEntries(RATE_ORIZ.filter((r) => r.mese.slice(0, 4) === String(ANNO)).map((r) => [r.mese, r.lordo]));
  // Aliquota con cui lo slider converte lordo <-> netto: quella dello scenario se c'è, altrimenti il riferimento.
  const aliquotaSlider = () => (stato.scenario.canone ? stato.scenario.canone.aliquota_iva : CR.aliquota_iva);

  // Imposta l'annuo lordo: le rate di riferimento dell'orizzonte vengono scalate in lordo (calendario in netto).
  function impostaCanone(lordoAnnuo) {
    const sc = stato.scenario;
    const al = aliquotaSlider();
    if (CONTR) {
      const cal = scalaRate(rateLordeContratto(), lordoAnnuo, CR.lordo_annuo, al);
      const perAnno = {};
      for (const [m, v] of Object.entries(cal)) perAnno[m.slice(0, 4)] = (perAnno[m.slice(0, 4)] || 0) + v;
      const primo = Object.keys(cal).sort()[0] || MESI_PF[0];
      if (!sc.canone) {
        sc.canone = { netto_per_anno: perAnno, rate_n: Object.keys(CONTR.rate_mese).length, da_mese: primo, calendario: cal, aliquota_iva: CR.aliquota_iva };
      } else {
        sc.canone.netto_per_anno = { ...sc.canone.netto_per_anno, ...perAnno };
        sc.canone.calendario = { ...(sc.canone.calendario || {}), ...cal };
      }
      return;
    }
    const rate = rateLordePf();
    const mesi = Object.keys(rate).sort();
    const cal = mesi.length ? scalaRate(rate, lordoAnnuo, CR.lordo_annuo, al) : { [`${ANNO}-${ULTIMO_PF.slice(5)}`]: nettoDaLordo(lordoAnnuo, al) };
    const totale = somma(cal);
    if (!sc.canone) {
      sc.canone = { netto_per_anno: { [ANNO]: totale }, rate_n: Math.max(1, mesi.length), da_mese: mesi.length ? mesi[0] : MESI_PF[0], calendario: cal, aliquota_iva: CR.aliquota_iva };
    } else {
      sc.canone.netto_per_anno[ANNO] = totale;
      const altri = Object.fromEntries(Object.entries(sc.canone.calendario || {}).filter(([m]) => m.slice(0, 4) !== String(ANNO)));
      sc.canone.calendario = { ...altri, ...cal };
    }
  }
  const calendarioAnno = (c) => !!(c && c.calendario && Object.keys(c.calendario).some((m) => m.slice(0, 4) === String(ANNO)));
  function lordoAnno() {
    const c = stato.scenario.canone;
    if (!c) return RATE_ORIZ.filter((r) => r.mese.slice(0, 4) === String(ANNO)).reduce((s, r) => s + r.lordo, 0);
    try { return MOTORE.flussiCanone(c, D.mesi).filter((f) => f.mese.slice(0, 4) === String(ANNO)).reduce((s, f) => s + f.importo, 0); } catch (e) { return 0; }
  }
  // Annuo lordo implicito dello scenario: dai lordi in cassa dell'anno di riferimento, mai da un giro netto->lordo.
  function lordoSlider() {
    if (!stato.scenario.canone) return CR.lordo_annuo;
    return annuoDaLordi(lordoAnno(), somma(dellAnno(CONTR ? rateLordeContratto() : rateLordePf())), CR.lordo_annuo);
  }
  function renderCanone() {
    const c = stato.scenario.canone;
    const lordo = lordoSlider();
    const MAX_LORDO = MOTORE.iva(MAX_SLIDER, aliquotaSlider());
    const anni = c ? Object.entries(c.netto_per_anno).sort((a, b) => Number(a[0]) - Number(b[0])) : [];
    const dett = c ? `<div class="riga">${anni.map(([a, v]) => `<label class="piccolo">${a} netto € <input type="text" class="eur" data-canone-anno="${a}" value="${fmt(v)}"></label>`).join("")}
          <label class="piccolo">anno <input type="number" class="n" style="width:72px" min="2026" max="2040" data-canone-nuovo-anno value="${Math.max(...anni.map(([a]) => Number(a))) + 1}"></label>
          <button data-canone-aggiungi>+ anno</button></div>
        <div class="riga"><label class="piccolo">rate <input type="text" class="n" id="canone-rate" value="${c.rate_n}"></label>
          <label class="piccolo">da mese ${selMesi(c.da_mese, "sel-canone-da")}</label>
          <label class="piccolo">IVA % <input type="text" class="n" id="canone-iva" value="${c.aliquota_iva}"></label>
          <button data-canone-pf>Torna al canone del PF</button></div>
        <div class="riga"><label class="piccolo" style="flex:1">oppure calendario libero (mese=netto; vince sulle rate per quell'anno)<br>
          <input type="text" class="nome" id="canone-cal" placeholder="2027-03=200.000,00; 2027-06=300.000,00" value="${esc(calendarioTesto(c.calendario))}"></label></div>
        <div class="nota">Il canone è lordo in cassa: esce da ORTI ed entra in INTUR nello stesso mese. Negli anni coperti dalla scaletta sostituisce le righe «Fitto Hotel» del PF.</div>`
      : `<div class="nota">Canone come nel PF: rate nell'orizzonte ${RATE_ORIZ.length ? RATE_ORIZ.map((r) => `${meseIt(r.mese)} ${fmt(r.lordo, false)} lordo`).join(", ") : "nessuna"}. ${CONTR ? ` Il contratto prevede ${Object.keys(CONTR.rate_mese).sort().map((mm) => `30/${mm}`).join(", ")}: <button data-canone-contratto class="mini">applica il calendario del contratto</button>.` : ""} Muovi lo slider, oppure <button data-canone-attiva class="mini">apri la scaletta</button> per anni, rate e calendario.${stato.canoneParcheggiato ? ' <button data-canone-ripristina class="mini">riprendi la scaletta di prima</button>' : ""}</div>`;
    el("canone").innerHTML = `<div class="testa"><div><strong>Canone Fitto Hotel</strong> <span class="piccolo">ORTI → INTUR · lordo annuo IVA inclusa${CR.dichiarato ? " (dichiarato)" : " (dalle rate PF nell'orizzonte)"}</span></div>
        <div class="grande num" id="canone-val"></div></div>
      <div class="slider"><input type="range" id="canone-slider" min="0" max="${MAX_LORDO}" step="100000" value="${Math.min(Math.max(lordo, 0), MAX_LORDO)}" aria-label="Canone lordo annuo IVA inclusa">
        <input type="text" class="eur" id="canone-num" value="${fmt(lordo, lordo % 100 !== 0)}" aria-label="Canone lordo annuo IVA inclusa in euro"></div>
      <div class="piccolo" id="canone-info"></div>
      <details id="canone-dett" ${aperte.has("canone") ? "open" : ""}><summary>Scaletta pluriennale e scadenze</summary>${dett}</details>`;
    const slider = el("canone-slider"), num = el("canone-num");
    slider.oninput = () => { const l = parseInt(slider.value, 10); impostaCanone(l); num.value = fmt(l, false); ricalcola({ canoneLeggero: true }); };
    slider.onchange = () => ricalcola();
    num.onchange = () => { const v = euroDa(num); if (v === null || v < 0) return; impostaCanone(v); ricalcola(); };
    const box = el("canone");
    const contr = box.querySelector("button[data-canone-contratto]");
    if (contr) contr.onclick = () => { impostaCanone(CR.lordo_annuo); ricalcola(); };
    const rip = box.querySelector("button[data-canone-ripristina]");
    if (rip) rip.onclick = () => { stato.scenario.canone = stato.canoneParcheggiato; stato.canoneParcheggiato = null; ricalcola(); };
    const att = box.querySelector("button[data-canone-attiva]");
    if (att) att.onclick = () => { if (!stato.scenario.canone) impostaCanone(CR.lordo_annuo); el("canone-dett").open = true; ricalcola(); };
    if (c) {
      box.querySelectorAll("input[data-canone-anno]").forEach((inp) => { inp.onchange = () => { const v = euroDa(inp); if (v === null) return; c.netto_per_anno[inp.dataset.canoneAnno] = v; ricalcola(); }; });
      box.querySelector("button[data-canone-aggiungi]").onclick = () => {
        const inp = box.querySelector("input[data-canone-nuovo-anno]");
        const a = inp.value.trim();
        const ok = /^\d{4}$/.test(a) && +a >= 2026 && +a <= 2040 && !(a in c.netto_per_anno);
        inp.classList.toggle("invalid", !ok);
        if (ok) { c.netto_per_anno[a] = 0; ricalcola(); }
      };
      el("canone-rate").onchange = (e) => { c.rate_n = parseInt(e.target.value, 10) || 1; ricalcola(); };
      el("canone-iva").onchange = (e) => { c.aliquota_iva = parseInt(e.target.value, 10) || 0; ricalcola(); };
      box.querySelector("select.sel-canone-da").onchange = (e) => { c.da_mese = e.target.value; ricalcola(); };
      el("canone-cal").onchange = (e) => {
        const cal = calendarioParse(e.target.value);
        e.target.classList.toggle("invalid", cal === null);
        if (cal === null) return;
        c.calendario = Object.keys(cal).length ? cal : null;
        ricalcola();
      };
      box.querySelector("button[data-canone-pf]").onclick = () => { stato.canoneParcheggiato = stato.scenario.canone; stato.scenario.canone = null; ricalcola(); };
    }
    aggiornaCanoneInfo();
  }

  function aggiornaCanoneInfo() {
    const c = stato.scenario.canone;
    const lordo = lordoSlider();
    const netto = nettoDaLordo(lordo, aliquotaSlider());
    el("canone-val").textContent = `${fmt(lordo, lordo % 100 !== 0)} €`;
    // Il canone mese per mese: esce da ORTI ed entra in INTUR nello stesso mese.
    const pfFl = D.intercompany.filter((f) => f.nome.startsWith("Fitto Hotel") && f.stato === "pf");
    const fuori = Object.keys(CR.rate_pf || {}).filter((m) => !D.mesi.includes(m));
    const scFl = c ? MOTORE.flussiCanone(c, D.mesi) : pfFl;
    const perMese = {};
    for (const f of scFl) perMese[f.mese] = (perMese[f.mese] || 0) + f.importo;
    const pfPerMese = {};
    for (const f of pfFl) pfPerMese[f.mese] = (pfPerMese[f.mese] || 0) + f.importo;
    const mesiCan = Object.keys(perMese).sort();
    const diffMesi = [...new Set([...Object.keys(perMese), ...Object.keys(pfPerMese)])].sort().filter((m) => (perMese[m] || 0) !== (pfPerMese[m] || 0));
    const totDiff = diffMesi.reduce((s, m) => s + ((perMese[m] || 0) - (pfPerMese[m] || 0)), 0);
    // La frase: quante rate, quanto, quando, e in una cifra per società quanto cambia rispetto al PF.
    const importi = [...new Set(mesiCan.map((m) => perMese[m]))];
    const rate = mesiCan.length === 0 ? "nessuna rata nell'orizzonte"
      : `${mesiCan.length === 1 ? "una rata" : `${mesiCan.length} rate`}${importi.length === 1 ? ` da ${fmt(importi[0], false)} lorde` : ""}: ${mesiCan.map(meseIt).join(", ")}`;
    const vsPf = diffMesi.length ? `rispetto al PF: ORTI ${segno(-totDiff, false)} · INTUR ${segno(totDiff, false)}` : "come nel PF";
    const frase = `${fmt(netto, false)} netto l'anno · ${rate} · ${vsPf}`;
    // I dettagli: tutto quello che prima stava in vista. Niente si perde, ma non è in faccia a tutti.
    const parti = [];
    if (CR.dichiarato) parti.push(`annuo dichiarato ${fmt(CR.netto_annuo, false)} netto (${fmt(CR.lordo_annuo, false)} lordo) il ${CR.dichiarato_il || "—"}`);
    else parti.push("nessun annuo dichiarato: la base è la somma delle rate PF nell'orizzonte");
    if (CONTR) parti.push(`contratto: rate il ${Object.keys(CONTR.rate_mese).sort().map((mm) => `30/${mm}`).join(", ")} da ${fmt(Object.values(CONTR.rate_mese)[0], false)} netto`);
    const ratePf = Object.entries(CR.rate_pf || {}).sort().map(([m, v]) => `${meseIt(m)} ${fmt(v, false)}`).join(", ");
    if (ratePf) parti.push(`rate nel PF: ${ratePf}`);
    parti.push(c ? `IVA ${c.aliquota_iva}%` : "calendario come nel PF");
    const esce = mesiCan.length ? mesiCan.map((m) => `${meseIt(m)} ${fmt(perMese[m], false)}`).join(", ") : "nessun mese nell'orizzonte";
    const vsMese = diffMesi.length ? `<li>rispetto al PF, mese per mese: ${diffMesi.map((m) => `${meseIt(m)} ORTI ${segno(-((perMese[m] || 0) - (pfPerMese[m] || 0)), false)} · INTUR ${segno((perMese[m] || 0) - (pfPerMese[m] || 0), false)}`).join(", ")}</li>` : "";
    const prima = el("canone-info").querySelector("details.dettagli");
    const aperto = prima ? prima.open : aperte.has("canone-info");
    el("canone-info").innerHTML = `<div class="frase">${frase}</div>
      <details class="dettagli" data-k="canone-info" ${aperto ? "open" : ""}><summary>dettagli</summary><ul class="piccolo">
        ${parti.map((p) => `<li>${p}</li>`).join("")}
        <li>esce da ORTI ed entra in INTUR nell'orizzonte (lordo): ${esce}${fuori.length ? ` · fuori orizzonte: ${fuori.map(meseIt).join(", ")}` : ""}</li>
        ${vsMese}</ul></details>`;
  }

  // ── voci di un mese (dettaglio e "tre voci più grandi") ──
  function vociMese(soc, mese) {
    const sc = stato.scenario;
    const voci = { E: {}, U: {} };
    const add = (dir, nome, imp) => { if (imp) voci[dir][nome] = (voci[dir][nome] || 0) + imp; };
    const conFin = new Set(sc.finanziamenti.map((f) => f.societa));
    for (const r of D.pf) {
      if (r.societa === soc && r.mese === mese && !(r.voce_id === "ENTRATE_FINANZIAMENTI" && conFin.has(soc))) add(r.direzione, etichetta(r.voce_id), r.importo);
    }
    let interc = D.intercompany;
    if (sc.canone) {
      const nuovi = MOTORE.flussiCanone(sc.canone, D.mesi);
      const anni = new Set(nuovi.map((f) => f.mese.slice(0, 4)));
      interc = interc.filter((f) => !(f.nome.startsWith("Fitto Hotel") && anni.has(f.mese.slice(0, 4)))).concat(nuovi);
    }
    for (const f of interc) {
      if (f.mese !== mese) continue;
      const tag = f.stato === "una_gamba" ? " (una gamba)" : f.stato === "scenario" ? " (scaletta)" : "";
      if (f.stato === "una_gamba") {
        if (SOC.includes(f.da)) { if (f.da === soc) add("U", f.nome + tag, f.importo); }
        else if (f.a === soc) add("E", f.nome + tag, f.importo);
        continue;
      }
      if (f.a === soc) add("E", f.nome + tag, f.importo);
      if (f.da === soc) add("U", f.nome + tag, f.importo);
    }
    for (const r of (sc.manuali || [])) if (r.societa === soc && r.mese === mese) add(r.direzione, `${etichetta(r.voce_id)} (${r.origine === MOTORE.SOSTITUZIONE ? "corretta nello scenario" : "manuale"})`, r.importo_cent !== undefined ? r.importo_cent : r.importo);
    for (const f of sc.finanziamenti) {
      if (f.societa !== soc) continue;
      add("E", `${f.nome} · erogazione`, f.erogazioni[mese] || 0);
      add("U", `${f.nome} · rata`, f.rate[mese] || 0);
    }
    const [progetti] = MOTORE.riconcilia(sc.progetti, D.fatti);
    for (const p of progetti) {
      if (!p.acceso || p.societa !== soc) continue;
      for (const g of p.pagamenti) add("U", `${p.nome}: ${g.nome}`, MOTORE.iva(g.mesi[mese] || 0, g.aliquota_iva));
    }
    for (const f of D.fatti) if (f.societa === soc && f.mese === mese) add("U", `${f.progetto_id} · ${f.fornitore_id || "fatto"} (registrato)`, f.importo);
    return voci;
  }

  // ── minimi ──
  // «mar 27, apr 27, mag 27, giu 27» → «da mar 27 a giu 27» se sono consecutivi; altrimenti l'elenco.
  function intervalloMesi(mesi) {
    if (mesi.length < 2) return mesi.map(meseIt).join(", ");
    const idx = mesi.map((x) => D.mesi.indexOf(x));
    const consecutivi = idx.every((v, i) => i === 0 || v === idx[i - 1] + 1);
    return consecutivi ? `da ${meseIt(mesi[0])} a ${meseIt(mesi[mesi.length - 1])}` : mesi.map(meseIt).join(", ");
  }
  let minimiPrima = null;
  function renderMinimi() {
    const box = el("minimi");
    box.innerHTML = "";
    for (const soc of SOC) {
      const m = ris.minimi[soc], b = D.baseline.minimi[soc], a = D.ancore[soc];
      const delta = m.saldo - b.saldo;
      const usc = Object.entries(vociMese(soc, m.mese).U).sort((x, y) => y[1] - x[1]).slice(0, 3);
      const sotto = m.sotto_soglia.length ? `<div class="piccolo avviso">${stato.scenario.soglia ? `sotto la soglia di ${fmt(stato.scenario.soglia, false)}` : "sotto zero"} ${intervalloMesi(m.sotto_soglia)}</div>` : "";
      const eff = IPO.size ? effettoOltrePF(soc) : 0;
      const oltre = IPO.size ? `<div class="oltre">oltre ${meseIt(ULTIMO_PF)}, senza PF: ${eff ? `leve ${segno(eff, false)} entro ${meseIt(ULTIMO)}` : "nessuna leva"}</div>` : "";
      // La card dà la risposta: società, mese critico, il numero, lo scostamento dal solo PF, e il
      // segnale rosso se va sotto zero. Tutto il resto (ancora, solo PF, cosa pesa nel mese, le leve
      // oltre il PF) sta in «dettagli», chiuso: c'è per chi vuole saperlo, non in faccia a tutti.
      const kd = `dett-${soc}`;
      box.insertAdjacentHTML("beforeend", `<div class="card" data-soc="${soc}">
        <div><strong>${soc}</strong> · minimo a ${meseIt(m.mese)}</div>
        <div class="saldo num ${m.saldo < 0 ? "neg" : ""}">${fmt(m.saldo)} €</div>
        <div class="delta num">${delta === 0 ? "come con il solo PF" : `${segno(delta, false)} rispetto al solo PF`}</div>
        ${sotto}
        <details class="dettagli" data-k="${kd}" ${aperte.has(kd) ? "open" : ""}><summary>dettagli</summary>
          <div class="piccolo">solo PF: minimo ${fmt(b.saldo)} a ${meseIt(b.mese)} · ancora al ${dataIt(a.data)} <span class="badge ${a.attestato ? "ok" : "warn"}" title="vedi Fonti e versioni">${a.attestato ? "quadra coi movimenti" : "dichiarata"}</span></div>
          <div class="piccolo" style="margin-top:4px">pesano a ${meseIt(m.mese)}:</div>
          <ul>${usc.map(([n, v]) => `<li>${esc(n)} <span class="num">${fmt(v, false)}</span></li>`).join("") || "<li>nessuna uscita nel mese</li>"}</ul>
          ${oltre}
        </details>
      </div>`);
    }
    // Il numero che è appena cambiato lo dice con un battito: un salto silenzioso da +61k a −293k
    // non lega l'azione al risultato. Il primo disegno non è un cambiamento.
    if (minimiPrima) {
      for (const soc of SOC) {
        if (ris.minimi[soc].saldo !== minimiPrima[soc]) box.querySelector(`.card[data-soc="${soc}"] .saldo`).classList.add("cambiato");
      }
    }
    renderBarra(minimiPrima);
    minimiPrima = Object.fromEntries(SOC.map((s) => [s, ris.minimi[s].saldo]));
  }

  // La barra fissa: i due minimi in una riga sola quando la card è uscita dallo schermo, così
  // l'oggetto d'interesse resta visibile mentre si muove la leva che lo muove. Un tocco riporta
  // alla card. Compare e scompare la decide l'osservatore in fondo al file, non lo scroll.
  function renderBarra(prima) {
    const barra = el("barra-minimi");
    if (!barra) return;
    barra.innerHTML = SOC.map((soc) => {
      const m = ris.minimi[soc], d = m.saldo - D.baseline.minimi[soc].saldo;
      const cambiato = prima && prima[soc] !== m.saldo ? " cambiato" : "";
      return `<button type="button" data-soc="${soc}" title="torna ai minimi"><strong>${soc}</strong><span class="num${m.saldo < 0 ? " neg" : ""}${cambiato}">${fmt(m.saldo)} €</span><span class="quando">${meseIt(m.mese)}</span><span class="delta num">${d === 0 ? "come il solo PF" : `${segno(d, false)} vs solo PF`}</span></button>`;
    }).join("");
    barra.querySelectorAll("button").forEach((b) => {
      b.onclick = () => el("minimi").scrollIntoView({ behavior: ridotto() ? "auto" : "smooth", block: "start" });
    });
  }

  // ── grafico SVG: linee nei mesi PF, barre dell'effetto leve nei mesi senza PF ──
  function grafico(soc) {
    const W = 640, H = 230, L = 62, R = 10, T = 12, B = 34;
    const n = D.mesi.length;
    const sce = ris.righe.filter((r) => r.societa === soc).map((r) => r.fin);
    const bas = D.baseline.righe.filter((r) => r.societa === soc).map((r) => r.fin);
    const nPF = MESI_PF.length;
    const dPF = sce[nPF - 1] - bas[nPF - 1];
    const eff = D.mesi.map((m, i) => (IPO.has(m) ? (sce[i] - bas[i]) - dPF : 0));
    const tutti = sce.slice(0, nPF).concat(bas.slice(0, nPF), eff.slice(nPF), [0]);
    let lo = Math.min(...tutti), hi = Math.max(...tutti);
    if (hi === lo) hi = lo + 100;
    const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
    const x = (i) => L + (n === 1 ? 0 : (i * (W - L - R)) / (n - 1));
    const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
    const path = (vals) => vals.slice(0, nPF).map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const dx = n > 1 ? x(1) - x(0) : 20;
    const i0 = nPF < n ? nPF : -1;
    const coda = i0 >= 0 ? `<rect x="${(x(i0) - dx / 2).toFixed(1)}" y="${T}" width="${(W - R - x(i0) + dx / 2).toFixed(1)}" height="${H - T - B}" fill="var(--ipo)"/>
      <text x="${(x(i0) - dx / 2 + 4).toFixed(1)}" y="${T + 11}" font-size="10" fill="var(--muted)">senza PF · solo leve dopo ${meseIt(ULTIMO_PF)}</text>` : "";
    const barre = i0 >= 0 ? D.mesi.slice(nPF).map((m, k) => { const i = nPF + k, v = eff[i]; if (!v) return ""; const y0 = y(0), y1 = y(v); return `<rect x="${(x(i) - dx * 0.3).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${(dx * 0.6).toFixed(1)}" height="${Math.max(1, Math.abs(y1 - y0)).toFixed(1)}" fill="${v < 0 ? "var(--bad)" : "var(--accent)"}" opacity="0.35"><title>${meseIt(m)}: leve dopo ${meseIt(ULTIMO_PF)} ${segno(v)} € (nessun saldo previsto)</title></rect>`; }).join("") : "";
    const passo = n > 12 ? 2 : 1;
    const assi = D.mesi.map((m, i) => (i % passo ? "" : `<text x="${x(i).toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="10" fill="var(--muted)">${meseIt(m)}</text>`)).join("");
    const griglia = [lo + pad, (lo + hi) / 2, hi - pad].map((v) => `<text x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)" class="num">${fmt(Math.round(v / 100) * 100, false)}</text>`).join("");
    const punti = sce.slice(0, nPF).map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${v < 0 ? "var(--bad)" : "var(--accent)"}"><title>${meseIt(D.mesi[i])}: ${fmt(v)} € (solo PF ${fmt(bas[i])})</title></circle>`).join("");
    return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo ${soc}">
      ${coda}
      <line x1="${L}" x2="${W - R}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      ${griglia}${barre}
      <path d="${path(bas)}" fill="none" stroke="var(--base-line)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path d="${path(sce)}" fill="none" stroke="var(--accent)" stroke-width="2"/>
      ${punti}${assi}
    </svg>`;
  }

  function renderGrafici() {
    el("grafici").innerHTML = SOC.map((soc) => `<h2>${soc} · saldo di fine mese</h2><div class="card">${grafico(soc)}
      <div class="leg"><span><i></i>scenario</span><span><i class="base"></i>solo PF, nessuna leva</span>${IPO.size ? `<span><i class="eff"></i>oltre il PF: effetto cumulato delle leve dopo ${meseIt(ULTIMO_PF)}, non un saldo</span>` : ""}</div></div>`).join("");
  }

  // ── tabelle per società ──
  function renderTabelle() {
    const box = el("tabelle");
    box.innerHTML = "";
    for (const soc of SOC) {
      const righe = ris.righe.filter((r) => r.societa === soc);
      const basi = D.baseline.righe.filter((r) => r.societa === soc);
      const iPF = MESI_PF.length - 1;
      const dPF = righe[iPF].fin - basi[iPF].fin;
      const corpo = righe.map((r, i) => {
        const k = `${soc}|${r.mese}`;
        const ipo = IPO.has(r.mese);
        const ent = somma(r.entrate), usc = somma(r.uscite);
        const d = ipo ? (r.fin - basi[i].fin) - dPF : r.fin - basi[i].fin;
        let dett = "";
        if (aperti.has(k)) {
          const v = vociMese(soc, r.mese);
          const lista = (o, segno) => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([n, x]) => `<li>${segno} ${esc(n)} <span class="num">${fmt(x)}</span></li>`).join("");
          dett = `<tr class="dett"><td colspan="5">${ipo ? '<div class="nota">mese senza PF: contano solo le leve dello scenario</div>' : ""}<ul>${lista(v.E, "+") + lista(v.U, "−") || "<li>nessun movimento</li>"}</ul></td></tr>`;
        }
        const finale = ipo
          ? `<td class="num ${d < 0 ? "neg" : ""}">${d ? `<span class="piccolo">leve</span> ${segno(d)}` : "—"}</td>`
          : `<td class="num ${r.fin < 0 ? "neg" : ""}">${fmt(r.fin)}${d ? `<br><span class="piccolo num">${segno(d)}</span>` : ""}</td>`;
        return `<tr class="mese ${ipo ? "ipo" : ""}" data-k="${k}">
          <td>${meseIt(r.mese)}${ipo ? ' <span class="badge">senza PF</span>' : ""}</td>
          <td class="num ini ${ipo ? "vuoto" : ""}">${ipo ? "—" : fmt(r.ini)}</td><td class="num ${ipo && !ent ? "vuoto" : ""}">${ipo && !ent ? "—" : fmt(ent)}</td><td class="num ${ipo && !usc ? "vuoto" : ""}">${ipo && !usc ? "—" : fmt(usc)}</td>
          ${finale}</tr>${dett}`;
      }).join("");
      box.insertAdjacentHTML("beforeend", `<h2>${soc} · mese per mese <span class="piccolo">(tocca un mese per le voci)</span></h2>
        <div class="card" style="padding:4px 8px"><table><thead><tr><th>mese</th><th class="ini">iniziale</th><th>entrate</th><th>uscite</th><th>finale</th></tr></thead><tbody>${corpo}</tbody></table>
        ${IPO.size ? `<div class="nota">Da ${meseIt(D.mesi_ipotetici[0])} il PF non c'è: nessun saldo, solo l'effetto cumulato delle leve dopo ${meseIt(ULTIMO_PF)} rispetto al solo PF.</div>` : ""}</div>`);
    }
    box.querySelectorAll("tr.mese").forEach((tr) => {
      tr.onclick = () => { const k = tr.dataset.k; aperti.has(k) ? aperti.delete(k) : aperti.add(k); renderTabelle(); };
    });
  }

  function renderConsolidato() {
    const righe = ris.consolidato.map((c) => { const ipo = IPO.has(c.mese); return `<tr class="${ipo ? "ipo" : ""}"><td>${meseIt(c.mese)}${ipo ? ' <span class="badge">senza PF</span>' : ""}</td><td class="num ${ipo ? "vuoto" : c.saldo < 0 ? "neg" : ""}">${ipo ? "—" : fmt(c.saldo)}</td><td class="num">${fmt(c.intercompany_nettato)}</td><td class="num ${c.residuo ? "neg" : ""}">${fmt(c.residuo)}</td></tr>`; }).join("");
    el("consolidato").innerHTML = `<table><thead><tr><th>mese</th><th>saldo gruppo</th><th>intercompany nettato</th><th>residuo (una gamba)</th></tr></thead><tbody>${righe}</tbody></table>
      <div class="nota">Il residuo è un flusso intercompany presente su una sola società: resta lì, non si inventa la contropartita.</div>`;
    const nr = ris.non_riconciliati;
    el("fatti").innerHTML = D.fatti.length ? `<div class="card"><table><thead><tr><th>mese</th><th>società</th><th>progetto · fornitore</th><th>importo</th><th>stato</th></tr></thead><tbody>${
      D.fatti.map((f) => { const n = nr.some((x) => x.evento_id === f.evento_id); return `<tr><td>${meseIt(f.mese)}</td><td>${esc(f.societa)}</td><td>${esc(f.progetto_id)} · ${esc(f.fornitore_id || "—")}</td><td class="num">${fmt(f.importo)}</td><td><span class="badge ${n ? "bad" : "ok"}">${n ? "non riconciliato" : "riconciliato"}</span></td></tr>`; }).join("")
    }</tbody></table><div class="nota">Un fatto riconciliato riduce il pagamento previsto dello stesso fornitore (dal mese più vecchio); gli altri impegni del progetto non si muovono.</div></div>` : "";
  }

  // ── leve: progetti e finanziamenti a tendina ──
  const selMesi = (val, cls = "") => `<select class="${cls}">${D.mesi.map((m) => `<option value="${m}" ${m === val ? "selected" : ""}>${meseIt(m)}</option>`).join("")}</select>`;
  const PASSI = [[1, "ogni mese"], [2, "ogni 2 mesi"], [3, "ogni 3 mesi"], [4, "ogni 4 mesi"], [6, "ogni 6 mesi"], [12, "ogni anno"]];
  // La frase «come si paga»: quante rate, ogni quanto, la prima e l'ultima, e quante cadono senza PF.
  function comeSiPaga(mesi, aliquota) {
    const f = FORMATO.formaRate(mesi, D.mesi);
    if (!f.n) return "nessuna rata. Scrivi il totale, in quante rate, ogni quanto e la prima rata, poi «Rateizza».";
    const passo = f.passo ? (PASSI.find(([x]) => x === f.passo) || [0, `ogni ${f.passo} mesi`])[1] : "a mesi liberi";
    const conIva = aliquota !== null && aliquota > 0;
    const quota = f.n > 1 && f.quota !== null ? ` da ${fmt(f.quota, false)}${conIva ? ` netto (${fmt(MOTORE.iva(f.quota, aliquota), false)} lordo)` : ""}` : "";
    const quando = f.n === 1 ? `una tantum a ${meseIt(f.primo)}` : `${f.n} rate${quota} ${passo}, la prima a ${meseIt(f.primo)}, l'ultima a ${meseIt(f.ultimo)}`;
    const lordo = conIva ? Object.values(mesi).reduce((a, b) => a + MOTORE.iva(b, aliquota), 0) : f.totale;
    const tot = conIva ? `totale ${fmt(f.totale, false)} netto, ${fmt(lordo, false)} lordo in cassa` : `totale ${fmt(f.totale, false)}${aliquota === 0 ? " (IVA 0%)" : ""}`;
    const oltre = Object.keys(mesi).filter((m) => IPO.has(m)).length;
    return `${quando} · ${tot}${oltre ? ` · ${oltre === 1 ? "una rata cade" : `${oltre} rate cadono`} dopo ${meseIt(ULTIMO_PF)}, nei mesi senza PF` : ""}`;
  }
  function bloccoRate(mesi, aliquota) {
    const f = FORMATO.formaRate(mesi, D.mesi);
    return `<div class="come">
      <div class="riga"><label class="piccolo">totale <input type="text" class="eur" data-spalma-tot value="${fmt(f.totale)}"></label>
        ${aliquota ? '<select data-spalma-base><option value="netto">netto</option><option value="lordo">lordo IVA inclusa</option></select>' : ""}
        <label class="piccolo">in <input type="text" class="n" data-spalma-n value="${Math.max(1, f.n)}"> rate</label>
        <select data-spalma-passo ${f.n <= 1 ? "hidden" : ""}>${PASSI.map(([x, e]) => `<option value="${x}" ${x === (f.passo || 1) ? "selected" : ""}>${e}</option>`).join("")}</select>
        <label class="piccolo"><span data-spalma-quando>${f.n <= 1 ? "mese" : "prima rata"}</span> ${selMesi(f.primo || D.mesi[0], "sel-spalma-da")}</label>
        <button data-spalma>Rateizza</button></div>
      <div class="riga"><button class="mini" data-sposta="-1" ${f.n ? "" : "disabled"}>◀ tutto un mese prima</button>
        <button class="mini" data-sposta="1" ${f.n ? "" : "disabled"}>tutto un mese dopo ▶</button>
        <span class="errore-r" data-errore-spalma></span></div>
      <div class="piccolo">mese per mese (puoi correggere ogni importo)</div></div>`;
  }
  const selMeseA = (val, attr) => `<select ${attr}>${D.mesi.map((m) => `<option value="${m}" ${m === val ? "selected" : ""}>${meseIt(m)}</option>`).join("")}</select>`;
  const pctIt = (x) => String(x || 0).replace(".", ",");
  function riassuntoContratto(c) {
    if (c.modo === "percentuali") return (c.quote || []).map((q) => `${pctIt(q.pct)}% a ${meseIt(q.mese)}`).join(" · ") || "nessuna quota";
    const sal = c.sal_modo === "ogni" ? `un SAL ogni ${fmt(c.sal_ogni || 0, false)} di lavori` : `${c.sal_n} SAL`;
    const passo = (PASSI.find(([x]) => x === (c.sal_passo || 1)) || [0, ""])[1];
    return [c.anticipo_pct ? `anticipo ${pctIt(c.anticipo_pct)}% a ${meseIt(c.anticipo_mese)}` : "",
      `${sal} ${passo} da ${meseIt(c.sal_da)}`, c.ritenuta_pct ? `ritenuta ${pctIt(c.ritenuta_pct)}% svincolata a ${meseIt(c.svincolo_mese)}` : ""].filter(Boolean).join(" · ");
  }
  function bloccoContratto(p, c, ci) {
    const F = String(c.fornitore || "").trim();
