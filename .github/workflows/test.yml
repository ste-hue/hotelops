name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # I test marcati `bq` interrogano BigQuery live: il CI non ha (e non deve
      # avere) credenziali GCP, quindi restano esclusi qui e girano solo in locale.
      - run: pytest tests/ -q -m "not bq"
      # Baseline ruff ancora rossa su main (issue #46): il gate diventa
      # bloccante quando la baseline è azzerata.
      - run: ruff check .
        continue-on-error: true
