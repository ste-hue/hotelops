[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotelops"
version = "0.3.0"
description = "Financial decision platform for Gruppo Panorama hotel operations (INTUR + ORTI)"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.14",
  "google-api-python-client>=2.100",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
dashboard = ["streamlit>=1.35", "plotly>=5.0", "db-dtypes>=1.0"]
# Installa il pacchetto locale con: pip install -e /path/to/bank_reconcile
reconcile = ["bank-reconcile"]
# Installa il parser Esolver con: pip install -e /path/to/reconciliation_dino
# esolver = ["esolver-accodamenti"]

[project.scripts]
hotelops = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "bq: tests that query live BigQuery (skip with -m 'not bq' or HOTELOPS_SKIP_BQ=1)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ingest*", "condges*", "workspace*"]

[tool.setuptools]
py-modules = ["cli"]