[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hotelops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "bank-reconcile",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
dashboard = ["streamlit>=1.35", "plotly>=5.0", "db-dtypes>=1.0"]
# Installa il parser Esolver con: pip install -e /path/to/reconciliation_dino
# esolver = ["esolver-accodamenti"]

[tool.setuptools.packages.find]
where = ["."]
include = ["actions*", "pipelines*", "lib*", "services*"]